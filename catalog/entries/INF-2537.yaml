id: INF-2537
legacy_ids: []
slug: aclnn_roll_launch_failure_reported_success
aliases: []
title: aclnnRoll 启动失败被当成功返回
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnRoll op_api
  behavior: l0op::Roll 在 RollAiCore 返回 null（加算子失败）后仍返回已分配的 rollOut，aclnnRollGetWorkspaceSize 只判空，于是 workspace 准备成功但 Roll 算子没有下发。
effect:
  objects:
  - 数值结果
  detail: AiCore 平台加算子失败时两段接口返回成功，Roll 未执行，输出保持调用方原值/未初始化；无错误码，调用方以为滚动已完成。
  visibility: 静默错误
mitigation:
  detect: 在 AiCore 平台人为制造 launcher 加算子失败（或注入 fault），检查 aclnnRoll 两段返回码与输出是否实际写出；对比 CPU/小算子参考。
  fix: '待定（issue #4726 open；建议 l0op::Roll 在 RollAiCore 失败时返回 null 或错误码，不要用已分配 tensor 掩盖）。'

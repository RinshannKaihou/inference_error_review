remarks: 与 INF-2412（triton-ascend#2981 lowering 索引通道损坏、fp16/bf16 返回非极值索引）同为 argmax/argmin 索引域但缺陷位置与机制不同：本条在 torch_npu triton_helpers 的 NaN 匹配语义，非 lowering 通道损坏。

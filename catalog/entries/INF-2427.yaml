cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: triton_helpers 极值归约
  behavior: _extremum/max_with_index/min_with_index 索引阶段只判断 value==极值，NaN 与自身比较为假致全部匹配失败返回填充值最大索引；极值阶段也未完整传播 NaN 与最低索引语义
effect:
  objects:
  - 数值结果
  detail: 32×32 含 NaN 输入全 NaN 列 argmax 应返回最低索引 0，NPU 编译结果返回 31，2/32 索引不一致（相对差 inf），test_argmax_argmin_with_nan_npu 退出码 1
  visibility: 静默错误
mitigation:
  detect: 含 NaN 输入的 argmax/argmin 与 eager/CPU 对照
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49185（open 未合入）：极值阶段复用上游比较器传播 NaN，索引阶段补「输入值与极值均为 NaN」匹配并取最小原始索引；6 项回归 PASS

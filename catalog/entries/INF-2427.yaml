original:
  mechanism: torch_npu/_inductor/runtime/triton_helpers.py 的 _extremum/max_with_index/min_with_index（Ascend_950、torch_npu 2.13）：浮点极值归约与索引匹配未完整保留 NaN 传播与最低索引语义——原索引阶段只判断 value==peak/valley，NaN 与自身比较为假可能全部匹配失败，返回用作填充值的最大索引。修复沿用两次单源归约：极值阶段复用上游 maximum/minimum 比较器传播 NaN，索引阶段补「输入值与极值均为 NaN」的匹配条件再选携带的最小原始索引。新进程+独立缓存补丁前后对照：原节点通过，覆盖 6×6/32×32/1028×1028 及两个归约轴的 argmax/argmin，生成代码确认使用 NPU helper；与另 5 项既有回归合计 6 PASS。完整 wheel、其他硬件、完整 dtype 覆盖待验证。
  source: https://gitcode.com/Ascend/pytorch/issues/5924
  behavior: 含 NaN 输入做 argmax/argmin（如 mask 或脏数据产生全 NaN 列）时，NPU torch.compile 路径对该列返回最大索引 31 而非期望的最低索引 0：32×32 用例 2/32 索引不一致、最大绝对差 31、相对差 inf，测试断言失败但业务侧无任何报错，下游按错误索引取值。
  trigger_surface: NPU 编译路径 argmax/argmin+输入含全 NaN 归约段；Ascend_950、torch_npu 2.13
  discovery: 2026-11-06 每日扫描

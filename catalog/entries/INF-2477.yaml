original:
  mechanism: triton-ascend 3.6.0（CANN 9.2.0-beta.2）、910B4 实测的三个相关地址算术正确性问题：1) 地址表达式含负偏移（pooling padded 坐标）时，clamp、masked load、where 三种常用防护全部产出错误结果，且三种路径错值位级相同——同一错误地址模式而非随机；2) ptr+scalar_base+3D 索引形态下标量偏移被丢弃，load 读到错误地址段；3) 地址数组含重复地址（gather 式折叠索引）时标量基址同样丢失。2/3 共享根因：lane 寻址无法证明为规范仿射形态时，标量基址项被静默丢弃。报告建议：无法证明仿射的 load 应拒绝编译或保守标量回退，并文档化约束。
  source: https://github.com/triton-lang/triton-ascend/issues/3058
  behavior: kernel 里出现负坐标地址（如带 padding 的池化）时，无论用 clamp、mask 还是 where 防护，load 结果都是错的（且三种写法错得位级一致）；带标量基址的 3D load 或 gather 式重复地址 load 会静默丢掉标量基址、读到错误地址段。全部无报错；host 侧预移基指针使坐标非负可恢复正确。
  trigger_surface: triton-ascend 3.6.0 + 负坐标进入地址算术 / ptr+scalar+3D 索引 / 含重复地址的非单调 lane 寻址；910B4 实测。
  discovery: 2026-11-09 每日扫描

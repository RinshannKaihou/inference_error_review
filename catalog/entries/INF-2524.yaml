title: Runtime Bank 读锁内擦缓存并发错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: op host tiling 缓存
  behavior: Query 在 rwlock 读锁下命中 tuning_cache_ 后直接 erase；多个 Query 可同时持读锁，构成对 unordered_map 的并发读写，只有 SetTuningTiling 走写锁。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: 并发 tiling 查询命中同一项时可能返回错误缓存 tiling、查找异常或进程崩溃；源码确认读锁内 erase 路径在 d1efef7c HEAD 仍存在，未声称生产已观测。
  visibility: 静默错误
mitigation:
  detect: 多线程并发调用同一 RuntimeBankManager::Query 并命中同一 tuning 项，开启 TSAN/重复压测观察 map 异常；检查 rwlock 读锁内是否存在 erase。
  fix: 修复 PR !14327（open，未发布）：读锁只探测，命中后升级写锁重查、复制并擦除，未命中保持读路径。

id: INF-2520
legacy_ids: []
slug: inkling_router_bf16_ties
aliases: []
title: Inkling BF16 router 先并列后 Top-K 失真
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: transformers
    component: InklingTopkRouter 精度路径
  behavior: InklingTopkRouter 在 BF16 下做 sigmoid 与 bias 加法（bias/scale 参数加载时也舍入到 BF16），不同分数 Top-K 前并列，专家选择改变，无 NaN。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: bf16 加载或 BF16 autocast：8 个精确可表示的 sigmoid 分数全为 1.0，Top-2 专家集 CPU {5,6}/CUDA {0,1}，FP32 应为 {6,7}；三层小模型 19/48 token 专家集变而 loss 仅差 ~4.8e-7（合成，全模型未测）。
  visibility: 静默错误
mitigation:
  detect: 对比 FP32 路由决策（报告者用精确可表示的 logits 断言排除 GEMM 舍入）。
  fix: issue 内给出三步修复方案（FP32 投影/sigmoid/bias 关 autocast、e_score_correction_bias 与 gate.global_scale 进 _keep_in_fp32_modules_strict、路由系数末步回转隐状态 dtype），作者待维护者意见后提 PR；未开 PR。SGLang 同名模型已用 FP32 输出 gate projection 作对照。

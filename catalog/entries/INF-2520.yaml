original:
  mechanism: transformers InklingTopkRouter.forward（models/inkling/modeling_inkling.py L359-379）：sigmoid 与 correction-bias 加法在模型 dtype（BF16）下执行，且从_pretrained(dtype=bfloat16) 加载时 e_score_correction_bias 与 gate.global_scale 参数被舍入到 BF16（事后 cast 无法恢复）。BF16 精度下不同 sigmoid 分数在 Top-K 前并列：报告者用 BF16 精确可表示的 logits（排除 GEMM 舍入，断言 float 线性与 BF16 逐位相等）展示 8 个分数全部变成 1.0，Top-2 选择退化为实现定义的 tie-break（CPU {5,6}、CUDA {0,1}，FP32/FP64 为 {6,7}）。三层 InklingForCausalLM save→load(dtype=bf16) 后 FP32 路由使 19/48 token 专家集改变、loss 差 ~4.8e-7（合成，非全模型质量实测）。与 INF-2465（Step-3.7 need_fp32_gate 被忽略）同为 router 精度 FP32 保持缺失类，但机制与代码路径不同（本条为路由算子内部 dtype 与加载舍入，非配置开关被忽略）。Transformers 5.23.0.dev0 b2556881、PyTorch 2.13.0+cu130、CPU 与 RTX A1000 复现。
  source: 'https://github.com/huggingface/transformers/issues/50599 '
  behavior: Inkling 模型以 bfloat16 加载（或 FP32 权重开 BF16 autocast）后，MoE router 打分在 Top-K 前被 BF16 舍入成并列值：同一输入选出的专家集合与 FP32 路由不同（示例中 8 个分数全为 1.0，CPU 与 CUDA 的并列解序还不一致），模型照常运行、无 NaN 无报错，小模型上 loss 变化极小，但专家分派已系统性偏离 FP32 语义。
  trigger_surface: transformers Inkling MoE 模型 + dtype=bfloat16 加载或 BF16 autocast；CPU/CUDA 均复现；FP32 路由为对照。

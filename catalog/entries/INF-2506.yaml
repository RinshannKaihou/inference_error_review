original:
  mechanism: 'vllm-ascend MTP acceptance regression：从 #21285 分立的独立单（报告者声明与 KV cache layout 问题无关）。Atlas 950DT 8x96GB、driver 25.1.rc2、Qwen3.8-27B w8a8c8-mxfp8 checkpoint、--kv-cache-dtype mxfp8、MTP speculative decoding，两组运行 CLI/quant config/bench 完全一致，唯一变量为 vllm-ascend 镜像版本：v0.30.0-a5 接受率 ~49%（accept length ~2.49、~7.4k tok/s DP8），v0.32.0rc-a5（e25，更新 op headers）41.6%（4933 tok/s 单 DP vanilla）。根因未定位：疑 serving 侧 MTP/draft 路径变化（draft weight handling、MTP sampling/top-k、quant fusion）。正确性影响未证实——MTP 验证仍保证输出分布，接受率回退反映 draft/target 数值一致性变化。父单 #21285 为量化 KV cache 索引读损坏（已编目），同 bench 同 setup，注意关联避免双重计数。'
  source: 'https://github.com/vllm-project/vllm-ascend/issues/21529 （split from #21285=量化 KV 索引读损坏）'
  behavior: Qwen3.8-27B mxfp8 KV + MTP 的服务从 v0.30.0-a5 换到 v0.32.0rc-a5 镜像后，同样的 2400-prompt 基准（in1024/out256/c256）投机解码接受率从约 49% 掉到 41.6%，吞吐从 ~7.4k tok/s 掉到 4933 tok/s；服务不报任何错误，输出文本看上去正常，只是明显变慢，用户因此留在 v0.30.0-a5。
  trigger_surface: 950DT、Qwen3.8-27B w8a8c8-mxfp8、mxfp8 KV、MTP 开启、v0.32.0rc-a5 镜像；等价配置下 v0.30.0-a5 正常。
  discovery: 2026-11-11 每日扫描

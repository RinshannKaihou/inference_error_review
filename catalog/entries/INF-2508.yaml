original:
  mechanism: 'vllm-ascend Mooncake layerwise PUSH connector（kv_p2p/mooncake_layerwise_connector.py）：每个 prefill stage 自己入队 KV 传输，其后台线程在队列内做同步写；流水线 activation sends 不排空 KV 队列，wait_for_save() 为空（L889-891）。PR #21517 给非最终 stage 设 last_layer_idx=-1，完成回调与失败清理都被该层索引门控（L1569-1573、L292-328）——最终 stage 成功时看不到早 stage 的未完成写或失败。接收侧用源自 TP 与 context-parallel 映射的 trans_count 判完成，无 PP stage quorum，测试拓扑里一个 DONE 就够。受控复现（Windows/Py3.12/CPU-only 组件测试，执行 pin 的 Python 传输映射/sender/完成回调/接收跟踪，模拟 I/O、ACK 与设备事件；prefill PP=2 decode PP=1，TP=PCP=DCP=1）：stage0 写阻塞时 stage1 DONE 即 finished_recving（Layer0 在门释放后才到）；stage0 写失败同样判完成（失败请求留在 stage0 failed_reqs）；PP=1 对照首层写失败则正确报 FAILED。端到端 NPU 执行与输出精度待验证。'
  source: 'https://github.com/vllm-project/vllm-ascend/issues/21558 '
  behavior: 开启 prefill 流水线并行（PP>1）的 Mooncake layerwise KV 传输场景：最后一个 prefill stage 完成传输就上报整请求 KV 完成，前面 stage 还没写完（甚至写失败）时 decode 侧即认为收完并恢复解码，请求在不完整的前缀 KV 上继续生成，输出错误内容且看不到失败上报；组件级测试里 stage0 阻塞约 6 秒的案例中 decode 已在只有 Layer1 的目的端恢复。
  trigger_surface: 'vllm-ascend Mooncake layerwise PUSH + prefill pipeline parallelism>1（PR #21517 引入的路径）；早 stage 写慢或写失败时触发；PP=1 不受影响。'

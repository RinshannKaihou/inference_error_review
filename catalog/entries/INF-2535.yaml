title: DSpark 拒绝草稿 token 未清零致 logprob 越界
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 解码/采样
    stack: sglang
    component: DSpark sample 输出缓冲
  behavior: build_out_tokens_triton 只覆盖 bonus 位，拒绝的 draft 后缀原样保留；DSpark logprob gather 不按 correct_len 裁剪，把每个位置当词表索引，越界 ID 触发越界或错值。
effect:
  objects:
  - 输出分布
  detail: draft=[10,11,12]、correct_len=1、bonus=99 输出 [10,99,12,0] 而非 [10,99,0,0]；词表 100 时 gather 用 101 越界（CPU 复现 index 101 out of bounds）；接受前缀与 bonus 不变。
  visibility: 静默错误
mitigation:
  detect: 构造 correct_len<gamma 的 DSpark 输出，检查 bonus 之后是否清零；给 return_logprob 请求用词表边界外的 draft token 观察 compute_spec_logprobs 是否按越界索引 gather。
  fix: '修复 PR https://github.com/sgl-project/sgl-kernel-npu/pull/1025 （open，未发布）：按 col<GAMMA 且 col<correct_len 屏蔽 draft 加载、尾部位清零，同步 Torch 参考与 64 个回归；SGLang 主仓 #37472 已 merged c4b6338f。'

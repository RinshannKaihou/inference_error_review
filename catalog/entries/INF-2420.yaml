    component: histc 适配层展开
  behavior: min==max 时适配层 aminmax 后按 double ±1 展开经 x dtype 舍入，fp32 |m|≥2^24 坍缩为不等宽 range；标量一律转 double payload 回传，int64 遇 >2^53 丢精度

original:
  mechanism: 'cann/ops-transformer issue #7470（CANN 9.3.0 + Ascend950PR 实测）：RoPE 系列算子 RotaryPositionEmbedding / RotaryPositionEmbeddingGrad 的 int64 attr mode 在 tiling 层被按 char/uint32/int32 窄类型截断读取，高位丢失：mode=2^32（4294967296，低 32 位为 0）等非法值被静默当成 mode=0（half）接受执行，aclnn 返回成功但语义错误；前向与 Grad 对 mode=4294967296 均返回 0。来源是 Alice_zhou/issue#497、#498 排查中的衍生发现（#386 同族，ARPE V2 的 layout 读取正确不受影响）。修复 PR !15834 把 tiling 统一按 int64 读取 mode 并做范围校验，非法值返回参数错误。'
  source: https://gitcode.com/cann/ops-transformer/issues/7470 ｜修复 https://gitcode.com/cann/ops-transformer/merge_requests/15834
  behavior: 调用 RoPE/RoPE Grad 时如果 mode 来自配置/前端并被写成超出 32 位的整数（例如 2^32），接口不报错，直接按 mode=0 的 half 语义算位置编码；模型仍能生成文本，但位置编码方式与请求不符，长序列或特定 RoPE 变体的精度会异常，只有逐字节对比 mode=0 输出或检查 tiling 参数才能发现。
  trigger_surface: cann/ops-transformer RotaryPositionEmbedding/RotaryPositionEmbeddingGrad；int64 mode 超出 int32 范围（如 2^32）；CANN 9.3.0、Ascend950PR。
  discovery: 2026-11-13 每日扫描

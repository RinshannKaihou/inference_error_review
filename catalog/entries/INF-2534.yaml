id: INF-2534
legacy_ids: []
slug: rope_int64_mode_tiling_narrow_truncation
aliases: []
title: RoPE int64 mode 截断致非法值当 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: cann
    component: RoPE mode 属性读取
  behavior: RotaryPositionEmbedding/Grad 的 int64 mode 在 tiling 层按 char/uint32/int32 窄类型读取，高位丢失：mode=2^32 低 32 位为 0，被当 mode=0 放行执行。
effect:
  objects:
  - 数值结果
  detail: CANN 9.3.0 + Ascend950PR 实测前向与 Grad 对 mode=4294967296 均返回 0，执行 half 模式；非法值未按参数错误拒绝，语义静默错误。
  visibility: 静默错误
mitigation:
  detect: 传 mode=2^32 等超出 int32 的 int64 值，检查两段是否返回 0；与 mode=0 输出逐字节对比，相同即命中截断。
  fix: 修复 PR !15834（open，未发布）：tiling 统一按 int64 读取 mode 并做范围校验。

original:
  mechanism: vLLM 0.31.0 V2 GPU model runner；MultiModuleMTPSpeculator（SpeculativeConfig 在 method="mtp"、draft 多于一个 MTP 模块且 num_speculative_tokens>1 时选用）。三类缓存 cached_draft_input_ids[max_num_reqs,S-1]（speculator.py:56-61）、cached_target_hidden_states[:63-69]、cached_draft_input_embeds[:91-97]（MM 模型 load_model 分配）。三问题组合：1) 未覆写 add_request，BaseSpeculator.add_request（spec_decode/speculator.py:129-132）为空操作，GPUModelRunner.add_requests（model_runner.py:1290）每次槽位分配无任何重置；2) _cache_inputs_kernel（:912-921）只写 range(max(window_start,query_start), last_token_index+1)，短于 S-1 的 draft query 只覆写窗口尾部，低槽位保留前一占用者条目；3) _prepare_input_buffers_kernel（:520-527,:590-606）与 _prepare_input_hidden_states_and_embeddings_kernel（:708,:739-771）下一步重灌 R=max(0,num_rejected-1) 条（至多 S-1）不检查有效数量，位置 first_position-R+i。附 TRITON_INTERPRET=1 POC：请求 A（ids 900x、hidden 7.0）用槽 0 完成后，请求 B（ids 5xxx、hidden 3.0）复用槽 0、2 token prompt、首步拒绝全部 4 个 draft 即复现。
  source: https://github.com/vllm-project/vllm/issues/66886
  behavior: 开多模块 MTP 投机解码（num_speculative_tokens>1）时，新请求复用刚结束请求的槽位后，draft 模型的输入混入上一个请求的 token ids、target hidden states（多模态模型还包括 input embeds），并被写进新请求后续 MTP 模块的 draft KV：draft 质量与接受率受跨请求脏数据影响，全程无报错；触发依赖槽位复用、短 draft 窗口与拒绝路径的组合。
  trigger_surface: vLLM V2 + method="mtp" 多模块 MTP + num_speculative_tokens>1 + 槽位复用（新请求分到刚释放槽）+ 短 prompt/全拒绝触发重灌；v0.31.0。
  discovery: 2026-11-10 每日扫描

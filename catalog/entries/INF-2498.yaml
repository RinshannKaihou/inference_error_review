title: vLLM 多模块 MTP speculator 槽位残留泄漏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: MTP speculator 槽位缓存
  behavior: 每 request 槽位缓存（draft input ids/hidden states/MM embeds）在槽位复用时无重置、短窗只覆写尾部、拒绝后重灌不查有效数量，前一请求数据进入新请求 draft 上下文并写入其 draft KV。
effect:
  objects:
  - 跨请求/跨样本数据
  - KV状态
  detail: 开多模块 MTP（num_speculative_tokens>1）时，新请求复用刚结束请求的槽位，draft 模型跑在上一请求残留数据上，draft 质量与接受率受影响，全程无报错；触发依赖槽位复用、短 draft 窗口与拒绝路径的组合。
  visibility: 静默错误

title: XPU GDN recompute_w_u 留未初始化 u
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: sglang
    component: GDN recompute_w_u
  behavior: '#47944 用 masked pointer load/store 替换 block pointer 后，XPU 的 recompute_w_u masked store 在 K!=V 时只写部分 u，其余保留旧内存。'
effect:
  objects:
  - 数值结果
  detail: K!=V 时 u 的部分元素为未初始化值（NaN 及最高约 1e38），污染后续 chunk 输出；同源码 A100 逐位正确；该 kernel 在 XPU 还慢 6.9x。
  visibility: 数值异常
mitigation:
  detect: K!=V 的 GDN 模型在 XPU 上跑 chunk prefill，先 memset u 的分配区再比对；A100 同源码作对照，检查 NaN/1e38 与输出逐位一致。
  fix: '未核实修复 PR；规避：XPU 回退 #47944 或补全 recompute_w_u 的 masked store。'

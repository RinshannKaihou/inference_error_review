original:
  mechanism: torchtitan.models.common.rope._RotatePairs.rotate 的 bf16 fast path 通过 int32 位操作打包：pairs = x.view(torch.int32)，x_real=(pairs<<16).view(torch.float32)，x_imag=(pairs&~0xFFFF).view(torch.float32)，再用 cos/sin 旋转并重打包。当 cos/sin 是 stride[-1]==2 的非连续 slice view（RoPE cache gather：cache.unflatten(-1,(-1,2))[...,0]）时，torch.compile/inductor 生成的 Triton kernel 错误读取这些非连续输入，输出全 NaN；eager 输出有限且与布局无关，连续化 cos/sin 后编译路径也正确，说明缺陷在编译生成的地址/步长处理而非数学。环境：torch 2.15.0.dev20261005、torch_npu 2c8682d 源码构建 + storage.patch、CANN 9.2.0、8×Ascend 910B4（单卡可复现）。
  source: https://gitcode.com/Ascend/pytorch/issues/6095
  behavior: 用 torch.compile 跑 torchtitan 的 RoPE rotate（bf16、int32 位打包）时，只要 cos/sin 来自 cache.unflatten(-1,(-1,2))[...,0] 这种末维 stride=2 的切片，编译后 q/k 整张量变成 NaN；eager 同一输入完全正常，日志没有报错，直到 attention 输出全 NaN 才暴露。
  trigger_surface: torch_npu 源码构建 + inductor，RoPE 的 bf16/int32 位打包 fast path，cos/sin 为非连续 slice（stride[-1]=2）；8×910B4。
  discovery: 2026-11-13 每日扫描

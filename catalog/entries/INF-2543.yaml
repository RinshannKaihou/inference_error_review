title: Inductor RoPE 位操作非连续输入全 NaN
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: RoPE 位打包 codegen
  behavior: torchtitan RoPE 用 view(int32)、<<16、&~0xFFFF 打包 bf16 对；cos/sin 为 stride[-1]==2 的切片时，inductor 生成的 Triton kernel 按连续读取。
effect:
  objects:
  - 数值结果
  detail: 同一输入 eager 输出正确；torch.compile 后整张量全 NaN（每个元素），cos/sin 先 contiguous 后恢复正确，8×910B4 单卡可复现。
  visibility: 数值异常
mitigation:
  detect: compile 与 eager 对拍，cos/sin 分别用连续与 stride[-1]=2 的 slice view，检查输出是否 isnan().all()。
  fix: 未核实修复 PR；规避为调用前对 cos/sin 做 contiguous（eager 与编译结果逐位一致）。

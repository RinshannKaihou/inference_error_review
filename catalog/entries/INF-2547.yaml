original:
  mechanism: 'Triton main 上 bf16 的 tl.atomic_add 在 sm_80/sm_89 被降为 LLVM atomicrmw fadd bfloat align 2，LLVM AtomicExpand 把它展开成 32 位 cmpxchg 循环。PTX 中旧 bf16 值从循环前 load 的 32 位字里提取一次（cvt.u16.u32 %rs2, %r7），循环体内每次重试都用 stale_old + v，新的比较值只写回 %r7 而不重新提取，因此任何并发更新都会被覆盖。触发条件是 #12107（Preserve pointer argument alignment）让带 tt.divisibility=16 的指针参数获得 align 16；没有该属性时（3.8.0/3.9.0，或输出非 16 字节对齐）同一循环正确。实测 128 线程各加 1.0 结果只剩 1.0。报告者从 AtomicExpandPass.cpp 的 insertRMWCmpXchgLoop 推断机制，未自行构建 LLVM 验证；缺陷本体在 LLVM，#12107 只是暴露它。'
  source: https://github.com/triton-lang/triton/issues/12740
  behavior: 在 sm_80/sm_89 上用 bf16 做 tl.atomic_add 累加到同一地址（例如统计量、直方图、MoE 计数），大量更新被静默丢弃：128 个线程各加 1.0 只剩 1.0；没有异常也没有 warning，直到结果明显偏小才发现。
  trigger_surface: Triton main、bf16 tl.atomic_add、sm_80/sm_89，指针参数带 tt.divisibility=16；3.8.0/3.9.0 不受影响。
  discovery: 2026-11-13 每日扫描

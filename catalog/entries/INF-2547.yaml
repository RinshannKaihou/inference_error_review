  - subsystem: 编译器
    stack: triton
    component: AtomicExpand 展开
  behavior: Triton main、sm_80/sm_89 上 bf16 tl.atomic_add 被 AtomicExpand 展开为 32 位 cmpxchg 循环；指针带 align 16 时旧值仅循环前提取一次、重试不复取，并发更新被覆盖。
effect:
  objects:
  - 数值结果
  detail: '128 个线程各对同一地址加 1.0，结果只剩 1.0（期望 128.0），无报错；3.8.0/3.9.0 正确，main 上因 #12107 保留 align 16 触发。'
  visibility: 静默错误
mitigation:
  detect: sm_80/sm_89 上让 128 个线程对同一 bf16 地址 atomic_add 1.0，检查结果是否 128.0；对 16 字节对齐与非对齐缓冲各跑一次。
  fix: 未核实修复 PR；规避为改用 fp32 atomic_add 或去掉指针 tt.divisibility=16。

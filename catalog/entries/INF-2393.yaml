  mechanism: vllm-ascend main 0f85ed44 的 vllm_ascend/device_allocator/camem.py：直接导入裸 acl.rt.memcpy（ACL Python 契约返回整数状态，0 为成功），不复刻上游 cudaMemcpy 包装的 CUDART_CHECK 检查。sleep（199-209 行）：device→host 拷贝忽略返回值后仍保存新备份、解除映射并释放有效 device 分配、标记 asleep——拷贝报错时把未初始化/部分备份提交为唯一数据并丢弃有效源。wake_up（270-281 行）：先标 awake 再恢复，host→device 失败被忽略且清空有效 CPU 备份——分配看似已恢复但无重试来源。另发现 dest_max 传地址推导值（cpu_ptr+size*2）而非分配容量（64B 目标传 8320B），但拷贝计数仍 64，该参数缺陷单独不构成溢出证据。CPU/AST 加载生产代码 + mock 注入非零返回复现（无 NPU 环境，不声称端到端服务结果）；报告者自述 source-level 复现，置信度 documented。

original:
  mechanism: 'cann/ops-nn issue #8673（Ascend950DT_9592、A5/arch35，ScatterMul/ScatterDiv/ScatterMax/ScatterMin 共用 index/scatter_reduce_common）：浮点折叠在 f32 累加域直接连乘，长链下中间部分积必然溢出成 ±inf 或冲洗进亚正规丢有效位，而参考实现算的是与序无关的数学真值；为弥补分歧，代码里有 RescueNonFiniteSeg：当折叠结果非有限、或为零而原值非零、或窄回值贴近输出 dtype 边界带时，回读 outputGm_ 原值逐列逐条在缩放域重算。其触发判据（输出 dtype 边界带 + 链长≤1 跳过/≥16 必算）按用例调出，只在最终值落进边界带时触发，对中间部分积冲洗、最终值回摆到中段的元素完全隐身：L1_736（var (5,43303,15) fp16、sliceSize=649545、indices 仅 210）实测 43 个此类元素，相对误差 0.3%~90%。同一宽切片实测 3.16 s，而 updates 读一遍的搬运下界约 134 µs（4000 GB/s），约 23600×，其中 2.728 亿次 GM 标量读来自救援。另并行轴判据只看 M<=blockNum、列块宽度先顶满 UB 再轮转发核、host/内核两份 UB 账本；同族的 ScatterList_L0_012（var (4,4,270646) int8、dyn_tiling_key=106）在 mssanitizer 下报 illegal write of size 16854 @ GM，病灶在 NegLargeE(key106) 分段写点未按张量真实剩余元素钳位。golden 侧 scatter_div 用 Σlog2+exp2 在 |Σ|>1024 饱和、inf×0 产 NaN，zero_cnt 用 subtract.reduceat 计数错误。'
  source: https://gitcode.com/cann/ops-nn/issues/8673
  behavior: 用 ScatterMul/ScatterDiv 做重复索引归约时，如果长链乘除的中间积先溢出或被冲成次正规、最后又回到正常量级，结果会静默偏离参考值（实测 43 个元素相对误差 0.3%~90%）；同时宽切片场景会比搬运下界慢两万多倍，看起来像算子性能问题。全程返回成功，只有逐元素对拍 fp64 参考或做耗时分析才能发现。
  trigger_surface: Ascend950DT/A5 arch35 的 ScatterMul/ScatterDiv/ScatterMax/ScatterMin；宽切片（大量列、少量 indices）或长链重复索引；CANN 9.3.0/ops-nn 对应版本。
  discovery: 2026-11-13 每日扫描

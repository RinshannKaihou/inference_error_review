  behavior: scatter_reduce_common_sort.h 浮点折叠在 f32 域连乘，中间积溢出/冲洗后靠 RescueNonFiniteSeg 重算；判据只看最终值是否落 dtype 边界带，中间冲洗而最终回摆的元素不救。

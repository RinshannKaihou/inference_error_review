title: aclnnIndexAdd 出参版原地改写输入 self
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnIndexAdd 出参版执行路径
  behavior: 出参版 aclnnIndexAdd 在 self 连续时把结果原地写回输入 self 再拷到 out；非连续时先拷副本、原地计算落在副本上——连续性决定是否改写输入。
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: 调用结束后 self 的 device 缓冲区字节被改写为计算结果（资料声明 self 为输入）；实测 [512,8] fp32 连续 self 被整块改写、非连续 self 不改写（改写为 0）；torch.index_add（torch_npu 2.12.0）对照输入不变。两段返回 0，无告警。
  visibility: 静默错误
mitigation:
  detect: 调用前后对 self 同一块 device 缓冲区做原始字节比较（与 stride 布局无关）；连续 self 被改写即命中。
  fix: 待定（issue open，未见修复）

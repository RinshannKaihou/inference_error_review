original:
  mechanism: cann/ops-math 的 aclnnRsub（#4254）与 aclnnRsubs（#4247）对 int64 alpha 的窄化判等缺陷：实现用 ToInt32()（Rsub）/IsScalarOne（Rsubs，内部同样窄化为 int32 判等）判断 alpha 是否为 1 以走快捷路径，int64 标量 alpha=2^32+1 在窄化后低位为 1、被判成 alpha==1，输出按 1 计算，与真值（按 2^32+1）静默偏离 2^32 量级；两段接口返回 0。两 issue 均含完整判据与对照实测。
  source: GitCode issues https://gitcode.com/cann/ops-math/issues/4254 、https://gitcode.com/cann/ops-math/issues/4247 （均 open，2026-10-29）
  behavior: 用 aclnnRsub/Rsubs 做反减并传 int64 大标量 alpha（≥2^32 的值，如 4294967297）时，输出被当成 alpha=1 计算：结果数值静默错误（偏差达 2^32 倍量级），无报错；普通小 alpha 不受影响，只有低 32 位为 1 的大 alpha（如 2^32+1）踩中。
  trigger_surface: cann/ops-math rsub/rsubs；int64 标量 alpha 且低 32 位==1（如 2^32+1）；标量运算/数据变换路径。
  signature: alpha=2^32+1 输出==alpha=1 输出≠真值。
  repro: 两 issue 附对照判据。
  discovery: 2026-10-29 每日扫描

title: LightningIndexer 跨基块 top-K 等分候选丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: arch22 归并路径 MergeSort
  behavior: arch22 逐行归并路径跨 512 基块归并时，后块 0 分等分候选顶掉前块应选候选，top-K 索引集合与 golden 契约（分数降序、同分索引升序）不一致；MergeSort 比较器仅按 value 或非稳定为推断，需内核侧确认。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: actS2>512、actS1>4、K∈{16,32,64} 且行内有 ≥K 个等分候选时，aclnnLightningIndexer（910B3/v9.1.0）索引与 golden 失配：23 案 530,843 个多出索引全落在块 1 及以后；接口与同步返回成功，decode 不受影响。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（建议 MergeSort 比较器改 (value 降序,index 升序) 字典序或在并入 globalTopkUb_ 前对等分候选稳定化，并排查缓存路径/ProcessLD；无修复 PR）。

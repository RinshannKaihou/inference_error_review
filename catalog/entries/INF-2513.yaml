title: NixlConnector n>1 子请求读复用 KV 块
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: pull worker 通知计数释放
  behavior: n 个子请求共享 remote_request_id 各自发读通知；_get_new_notifs 按 req_id 计数不区分发送者，达 expected_consumers（TP 拓扑而非 n）即释放——首子读完即释放，晚子读到复用块。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: Nixl pull 模式 n>1：晚到子请求解码自已被复用重写的块，HTTP 200 返回无关文本（复现 16 子中 8/9 个丢密钥，~5.4s 传输差窗口），唯一信号是 prefill 侧每晚到子一行 KV blocks 日志；warm pod 全对。
  visibility: 静默错误
mitigation:
  detect: prefill 侧日志『Potentially invalid KV blocks for unrecognized request ... were retrieved by a decode worker. They may have expired.』（每个晚到子请求一条）。

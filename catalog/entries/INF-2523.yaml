id: INF-2523
legacy_ids: []
slug: matmul_v3_dav3510_fixpipe_splitm_by_output_dtype
aliases: []
title: MatMulV3 fp16 入 fp32 出 fixpipe 模式错
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MatMulV3 fixpipe 选择
  behavior: GetL0C2OutDav3510 按输入 dtype 选 fixpipe：fp16/bf16 输入一律 1_1 且不置 splitM；splitM 应由 fp32 输出决定，导致 fp32 输出未走 1V2/M 轴切分。
effect:
  objects:
  - 数值结果
  detail: Ascend950 bound 场景 fp16/bf16→fp32 输出精度实测 74.78%（应 ND_FIXPIPE_1_2+splitM）；fp32→fp32 与 fp16→fp16 组合正常。
  visibility: 静默错误
mitigation:
  detect: 在 Ascend950 fixpipe bound 场景用 fp16/bf16 输入 + fp32 输出 matmul，对拍 FP32 参考；同时检查 tiling 里 splitM 是否为 true、fixpipe 模式是否 1V2。
  fix: 修复 PR !14100（issue closed；合入/发布未核实）：按 cType==DT_FLOAT 选 ND_FIXPIPE_1_2 并置 splitM，删除不可达的 aType==FLOAT 分支，补 3 个 UT 与 380/380 op_host UT。

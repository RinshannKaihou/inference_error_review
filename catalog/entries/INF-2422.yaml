original:
  mechanism: 'CANN ops-nn aclnnForeachExpm1 缺 tensorNum>256 校验：传入超过 256 个 tensor 的列表被接受而非拒绝，尾部张量静默不算（输出保持输入原值，无错误码），且 host 侧 tiling/executor 结构体按 256 定长分配发生越界写。与同仓 aclnnForeach 家族其余成员（有 256 上限校验返回 161002）行为不一致。foreach 族是 torch._foreach_* 优化器/参数批量算子路径的底层接口。详细正文见批次缓存 issue #8254。'
  source: https://gitcode.com/cann/ops-nn/issues/8254
  behavior: 批量指数运算（foreach expm1）一次传超过 256 个张量时：接口不报错，前面 256 个算对了，第 257 个往后的张量原样返回、根本没算——静默漏算；同时 host 侧还有越界写风险。torch 优化器大批量参数分组场景（如大 MoE 模型分组更新）会静默拿到未计算的参数值。
  trigger_surface: CANN ops-nn aclnnForeachExpm1；tensorNum>256 的 TensorList；与 dtype 无关。

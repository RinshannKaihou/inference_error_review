title: torchair AddMM 拆分丢失 bias 低精度舍入边界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: torchair addmm 拆分
  behavior: 二维逐元素 bias 的 aten.addmm 在 lowering 中被拆成 MatMul+Add，bias 来自 BF16/FP16 Mul 时其生产者内联进 FP32 Add epilogue，丢失原 Mul 输出的低精度舍入边界
effect:
  objects:
  - 数值结果
  detail: 五轮 BF16 矩阵多项式图首轮 B 即 200252/1048576 元素不同，最大绝对差 3.05e-5，五轮放大后完整输出超 83 判据；恢复 10 处 bias Mul 的 BF16 舍入后与关闭 MM 融合逐 bit 一致
  visibility: 静默错误
mitigation:
  detect: 同输入多轮图对比 + 关闭 MM 融合逐 bit 对照；已保留失败节点真实中间输入可单片段验证
  fix: 待定（issue 2026-11-04 新开；建议保留带 bias MatMul IR 或拒绝后融合走 late fallback，未出修复 PR）

title: AddRmsNormQuant SingleN UB 记账漏项越界
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: SingleN 模板 UB 布局
  behavior: initSingleNUbSize 的 optionNum 只记 scales2/zeroPoints2，漏记 hasScales2 必配的 inQueueBeta(4F)，UB 总分配 191KB+4F 超预算致 VEC 越界读写 UB。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: A2 上 numRow≤40（SingleN 模板）且 scales2 非空：fp16 组合 numCol>256 同步报 507035 AI Core fault（两段 rc 均 0）；numCol≤256 越界写落 UB 尾部 1KB 预留区静默存活；全 bf16 组合任意 numCol 即崩。
  visibility: 报错
mitigation:
  detect: msSanitizer memcheck 在 bf16[8x1] 合法组合用例上抓到现行：illegal write of size 32 at 0x33280 on UB（超出 910B3 UB 预算 196608），同用例另报 GM 侧 illegal read；设备侧错误串『The address for the VEC instruction to read/write UB is out of bounds』。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/14264（account for all SingleN UB buffers，open，未发布）。

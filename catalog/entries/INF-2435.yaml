  mechanism: cann/ops-math conversion/slice_last_dim（Ascend950PR、CANN 9.3.0）arch35 实现多类缺陷：1) op_host/arch35/slice_last_dim_tiling_arch35.cpp 对非末维为 0 的退化输入（x=(0,6)/(2,0,5)）outShape 两轴>0 假设失效，outerSize 累乘为 0 时 DoTilingSearch 裸除零 SIGFPE（exit 136）；空输出时 tiling 空转 O(outerSize)。2) start/end 单侧截断触发有符号溢出（-ftrapv 下 SIGABRT，普通构建回绕出错误 lastDimOut）；stride≥2^40 直接透传。3) op_host/slice_last_dim_infershape.cpp 无 stride≥1 校验（stride=0 且 end>start 整数除零；负 stride 产出负长度维度含 -1 哨兵污染下游，仍返回成功）；无 rank∈[1,8] 校验（rank=0 下标回退越界读后静默输出 [0]；rank=9 放行）；[-2] 未知秩无处理分支返回成功且 GE 物化 0 字节输出。4) InferDataType 无 dtype 白名单原样放行 bool/complex128。5) op_kernel/arch35/slice_last_dim.h DoCopyIn 连续拷贝分支 GM 行距 static_cast<uint32_t> 窄化再赋 int64 字段（SDK DataCopyExtParams::srcStride 为 int64_t），行距≥2^32 字节丢高 32 位各 block 源地址错位产出无报错错误数据。6) proto 含未注册 DT_DOUBLE 缺实际交付的 DT_BF16。7-9) 交付规范/README 支持表虚标（A3/A2/200I A2 标√但无实现）/clang-format 违规。

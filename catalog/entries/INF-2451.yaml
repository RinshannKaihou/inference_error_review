original:
  mechanism: Ascend950PR_958b/CANN 9.3.0 上 MaxPoolGradWithArgmax 的 NHWC 小 C 场景精度 FAIL。Argmax 使用全局 (h*W+w)*C+c 编码；DoMulCNhwc() 在还原 h/w 时使用块内 C（cOutputActual）作为除数，当 Tiling 把 C 切分后 cOutputActual<cOutput，解码出的 h/w 错误，梯度被散射到错误位置或被 Range Check 丢弃。Tiling 主流程 AdjustInnerSplitForMultiCore() 在 N/H/W 调整后仍无条件执行 SearchOuterSingle(splitData.cOutputInner,1)，把已等于完整 C 的 cOutputInner 继续收缩到 1/2 等小值触发解码错误。复现用例（均命中 NHWC MergeHWC 向量模板 tiling Key 501、块内 C 严格小于完整 C）：fp32_int64_NHWC_000023（C=2→1）、bf16_int64_NHWC_000093（C=3→1）、fp32_int32_NHWC_000101（C=15→2）、fp32_int64_NHWC_000103（C=3→1）全 FAIL；块内 C==完整 C 的 verifyN100 对照 PASS。修复 !13770 为 Tiling 侧规避：仅完整 C 超 BigC 阈值（baseData.vRegSize/(2*baseData.indexBytes)）才切 C，小 C 保持 cOutputActual==cOutput，MergeHWC/MergeWC 解码恢复正确；BigC Kernel 用完整 cOutput 做 TransHWC2HW 不依赖块内 C 不受影响；阈值与 BigC 模板 IsCapable() 边界一致。静态分析完成（4 条 FAIL 用例完整 C 均小于等于阈值），黄区回归与 Ascend950 上板验证待做；小 C 场景可能损失切 C 并行度存在性能回退风险。SIMT（801-804）、NCHW 路径不受影响。
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/8366 （open）；修复 PR https://gitcode.com/cann/ops-nn/pull/13770 （open）
  behavior: 在 Ascend950 上以 NHWC 布局、通道数 C 较小（如 C=2/3/15）跑 MaxPoolGradWithArgmax 反向时，梯度输出与参考精度比对 FAIL 且无报错：fp32/int64、bf16/int64、fp32/int32 四类用例全错，梯度被写到错误的空间位置或被 Range Check 直接丢弃（部分梯度丢失）。块内 C 与完整 C 相同的对照用例全部 PASS，故症状随 tiling 切分决策隐性出现，仅在做精度回归时暴露。
  trigger_surface: CANN 9.3.0 ops-nn MaxPoolGradWithArgmax、Ascend950PR_958b；NHWC 布局 + 完整 C 较小（触发 MergeHWC/MergeWC 模板且 tiling 把 C 切到块内 C<完整 C，如 C=2/3/15）；BigC 大 C、SIMT、NCHW 路径不受影响。
  discovery: 2026-11-07 每日扫描

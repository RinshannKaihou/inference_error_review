title: MindFormers MLA TND 因 DSA 标志误判丢因果掩码
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 模型定义
    stack: mindformers
    component: MLA 掩码预处理 DSA 分支
  behavior: 掩码预处理只看 DSA 标志不检查实际 attention variant，普通 MLA+TND+EOD 压缩时提前返回空 mask，MLA FlashAttention V4 读整段序列
effect:
  objects:
  - 隐状态
  detail: 自回归位置本应只访问因果前缀，空 mask 下首 token 与因果前缀参考最大差 0.90（与全序列参考仅差 3.4e-5）；输出与 Q/K/V 梯度均有差异，末 token 不受影响
  visibility: 静默错误
mitigation:
  detect: 同输入 mask=None 与压缩因果 mask 双跑 local_v4_varlen_flash_attention 对比（首 token 差 0.90）
  fix: 修复 MR https://atomgit.com/mindspore/mindformers/merge_requests/8893 （open，未发布）：将省略 mask 分支限制到实际 DSA 稀疏路径

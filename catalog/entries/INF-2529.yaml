original:
  mechanism: 'cann/hcomm issue #1278：单机 16 rank 910C（8 卡×2 die，SOC=ascend910_9391），torch.distributed.all_to_all_single（fp16、每 rank 2048 token、hidden=4096、等分 split=[128]*16），HCCL_OP_EXPANSION_MODE=AIV。16/16 rank 均进入算子且 API 均返回；随后 torch_npu.npu.synchronize() 只有 rank6/rank7 完成，其余 14 个 rank 的 stream 永不完成，卡死期间被占用 chip 的 AICore 持续 100%（kernel 设备侧空转）；rank6/7 在后续 dist.barrier() 等其余 rank，600s 后报 Communication_Error_Get_Socket(EI0006) → ERR00100 PTA call acl api failed。同用例关闭 AIV（默认 AICPU 展开）16/16 正常；8 rank + AIV 正常。故障机 OS openEuler 6.6.0-72、driver 26.2.rc1、FW 9.2.0.2.200；对照机 veLinux 5.15、driver 26.1.0、FW 9.0.0.6.200，相同 CANN 9.2.1 且 libhccl/libhcomm/libhccl_alg/libhccl_plf 四个 so 逐字节相同，16/16 正常。差异锁定在 driver/FW 组合与 16 卡 AIV 展开路径。'
  source: https://gitcode.com/cann/hcomm/issues/1278
  behavior: 在单机 16 卡 910C 上开启 AIV 展开做 AllToAllV，all_to_all_single 调用本身返回，但同步时只有 2 个 rank 能结束，其余 14 个 rank 永久卡住、对应 AICore 满载空转；约 10 分钟后才在 barrier 上报 socket 超时。关掉 AIV 或改用 8 卡就正常，属于特定 driver/FW + 16 卡 + AIV 组合下的集合通信挂死，推理服务会整体停摆。
  trigger_surface: 单机 16 卡 910C、HCCL_OP_EXPANSION_MODE=AIV、torch.distributed.all_to_all_single 等分 16 rank；driver 26.2.rc1 / FW 9.2.0.2.200 + CANN 9.2.1；8 rank 或 AICPU 展开不复现。
  discovery: 2026-11-13 每日扫描

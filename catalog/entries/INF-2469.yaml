cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 2D load 向量化访存模式选择
  behavior: tile 行地址构成 stride-2 栅格（pooling stride=2）时，沿列轴单位步长的 2D tl.load 静默产生错误结果：奇数行 lane 返回 mask 的 other 值（含默认 0.0），偶数行正确。
effect:
  objects:
  - 数值结果
  detail: 910B4 实测：tile 行地址构成 stride-2 栅格（pooling stride=2）且沿列轴单位步长 2D tl.load（带 mask/other）时，奇数行整行等于 other（默认 0.0），逐位稳定复现，无警告无报错；列 mask 为 lane-uniform 时同样复现。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 社区规避：把访存重构为显式 affine-tap 形式（每 tap 行/col 范围 mask）稳定正确；上游修复未见，https://github.com/triton-lang/triton-ascend/issues/3057。

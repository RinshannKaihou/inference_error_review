original:
  mechanism: triton-ascend 3.6.0（CANN 9.2.0-beta.2）、Ascend 910B4：当 tile 行地址构成 stride-2 栅格（pooling stride=2：相邻输出行对应相隔 2 的输入行）时，沿列轴单位步长的 2D tl.load 静默产生错误结果——奇数行 lane 返回 mask 的 other 值（含默认 other=0.0），偶数行正确；无编译警告、无运行时错误；列 mask 为 lane-uniform 时同样复现。报告者判定为编译器为该形态选择了错误的向量化内存访问模式，根因未进一步定位。把访问重构成显式 affine-tap 形式（每个 tap 带 row/col 范围 mask）可稳定避开。报告者称这是其遇到的最危险失效类：无可观测信号。
  source: https://github.com/triton-lang/triton-ascend/issues/3057
  behavior: 写 pooling/下采样类 kernel 时，若输出行按 stride 2 映射到输入行、且列方向用单位步长 load（带 mask/other），则输出里奇数行整行等于 other 填充值（默认 0.0），结果静默错误且逐位稳定；没有任何警告或报错，改写为显式按 tap 加 range mask 的写法才正确。
  trigger_surface: triton-ascend 3.6.0 + stride>1 行栅格地址 + 沿列轴单位步长 2D tl.load（带 mask/other）；910B4 实测。
  discovery: 2026-11-09 每日扫描

original:
  mechanism: CANN ops-nn aclnnForeachCopy（A2 910B3，CANN 9.2.0，master 46ff6fdb）。x 与 out 指向同一块 device 内存的重叠区间（out 起址=x 起址+5 元素）时两段返回 0 但输出偏离 memmove 参考语义且逐次不同：真机 20 次中 19 次不一致，差异元素 5-10 个波动，差异位置聚类于 8 元素（32B）搬运块边界与前向重叠的交叠窗口。根因：(1) CheckParams（aclnn_foreach_copy.cpp:128-151）只校验空指针/dtype/rank/format，未对 x[i]/out[i] device 地址区间做重叠检测，文档 385 行亦无别名约束；(2) kernel ForeachCopyND::SingleTensorProcess 按 CopyIn→ComputeAndCopyOut 升序逐块搬运（BUFFER_NUM=1），前向重叠时第 i+1 块源区间已被第 i 块写入覆盖；块间 MTE3→MTE2 事件同步不保证 GM 写对后续 GM 读的可见性，污染窗口逐次不同（非确定性）。框架层影响：torch._foreach_copy_ NPU 实现直接路由本接口——CPU 同构造直接抛 RuntimeError（explicitly 拒绝重叠输入），NPU 910B3 上 5/5 次静默算错（corrupt=5 rejected=0），torch 2.14.0+cpu/torch_npu 2.14.0。非重叠路径正常（no_overlap_ok=True），地址重叠是唯一触发条件。
  source: https://gitcode.com/cann/ops-nn/issues/8261
  behavior: 对一个 buffer 做重叠视图拷贝（如 buf[5:37] ← buf[0:32]）：CPU 版 PyTorch 会直接报错拒绝；NPU 版不报错、返回成功，但拷出来的数据是错的——而且每次跑错的元素位置还不一样（10 次里 9 次错，错 5 到 10 个元素浮动）。torch._foreach_copy_ 这类优化器批量拷贝路径用同款接口，重叠使用时结果静默污染且不可复现，极难排查。
  trigger_surface: CANN 9.2.0；aclnnForeachCopy / torch._foreach_copy_ NPU 路由；x 与 out 指向同一存储的前向重叠区间；910B3 真机 20 次实测。

title: sglang AMD MLA decode ragged 批 NaN/错行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: sglang
    component: MLA decode 64-split 路径
  behavior: gfx1151 上 kv splits 选 64 时，同一 ragged 批内 ≥3 条序列跑满 64-split 即触发未初始化/竞态内存读；GQA shape 全干净、launch hints 无关，竞态点未定位。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: Lk 576/Lv 512 MLA decode 在 ragged 批（≥3 条 9000-token 序列混批）输出 NaN 或错误行，误差约 4（bf16 舍入仅 1e-2）；坏行逐 run 变化（8 seed 全坏）；双服务器 greedy 输出仅 4/64 一致（GQA 24-30/64）。
  visibility: 数值异常
mitigation:
  detect: 跑 issue 附 mla_decode_nan_repro.py（ragged MLA 批 × 8 seeds，对 fp32 参考比对）；或双服务器 greedy 一致性探针。
  fix: 待定（issue open，未见修复；触发依赖 64-split 满额混批，临时可限制 kv splits 上限规避——未验证）

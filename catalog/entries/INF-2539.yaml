original:
  mechanism: 'HCCL 的 AivReduceSoleMesh 与 AivAllReduceSoleMeshTwoShot 在归约前采用 push 语义：每个 rank 把自己数据写到对端 scratch，写完由对端从本地 scratch 读取归约。master PR #3856 的对照实验把根因定位到跨卡写通路本身：把跨卡写补齐到 32B 粒度后错误计数与位置完全不变，改为接收方跨卡读后同一场景一次通过。修复删除 Reduce ProcessMultiCore 的 WriteDataToAllPeers 与 ClearGM，改为核 i 跨卡读 peer i 发布区；ProcessMultiRank 由核 c 负责 peer c,c+n,c+2n… 各读到独立槽；AllReduce TwoShot SmallCoreReduceScatter 同样改 pull。新增发布区/工作区分离，CalcScratchMultiple 由 Reduce 2→3、AllReduce TwoShot 4→5。9.2.0 分支缺少该修复（基线 c0c93df8），PR !4058 做反合并新增 13 例 CPU 桩 UT。AllReduce OneShot 不在范围内（原 PR 已整体回退）。'
  source: https://gitcode.com/cann/hccl/issues/961 ｜https://gitcode.com/cann/hccl/pull/4058
  behavior: 多卡推理或训练执行 Reduce/AllReduce 时，小消息（十几张卡、几百字节，例如 allreduce 一个标量 loss 或很小的梯度张量）下部分 rank 的归约结果与其它 rank 不一致；没有报错也没有 NaN，后续层用的已经是错的激活或梯度，只能和单卡或 fp64 对拍才发现。
  trigger_surface: HCCL AIV Reduce/AllReduce（SoleMesh、TwoShot 少核路径），16 卡 fp32 256B 小消息，9.2.0 商用分支；master 已含 pull 修复。

title: aclnnFloorDivide fp32 真商贴近整数时结果偏差 1
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: floor_div vdiv→floor 链路
  behavior: A2 走 ops_legacy floor_div.py 的 vdiv→floor→cast 链路，商先按 fp32 舍入成整数再取 floor，真商贴近整数（相对差约 1e-7）时结果比数学值大 1（负商方向小 1），无余数校正。
effect:
  objects:
  - 数值结果
  detail: Atlas A2 fp32 输入、真商贴近整数时（0.5/0.1f 真商 4.9999999），floor_divide 返回 5 而非 4；误差恒为 1，超出资料 fp32 容差上限 max(1e-2, 32*ULP)；张量与标量全部入口一致偏差，无告警。
  visibility: 静默错误
mitigation:
  detect: fp32 位型精确构造 0.5/0.1f（真商 4.999999925）与 -3.5/0.7f（真商 -5.000000085），比对实测与双精度 floor 期望。
  fix: 待定（issue open，未见修复；建议按资料公式以双精度计算商后取 floor）

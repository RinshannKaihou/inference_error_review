title: NPU foreach 幂族 NaN 指数对非负底数返回 1.0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: foreach pow 适配层
  behavior: PowerAdapter 链对非负底数把 NaN 指数静默当 0 次幂处理（x^0=1）；负底数走另一支路正确返 nan；同机 torch.pow 正确，缺陷限定在 foreach kernel 适配链
effect:
  objects:
  - 数值结果
  detail: NPU（A3/A2，CANN 9.2.0-beta.2）上 exp=nan 时非负底数静默返 1.0：x=[0.5,2,0,-0.5,-2,1] 得 [1,1,1,nan,nan,1]，前五位应为 nan；负底数返 nan 正确，exp=inf/-inf/0/-1/0.5 与 torch 一致。
  visibility: 静默错误
mitigation:
  detect: 含 NaN 指数的 foreach_pow 输出比对 torch.pow
  fix: 待定（issue open，未见修复 PR）

original:
  mechanism: foreach 幂族（ForeachPowScalar/V2/ScalarList/ScalarAndTensor/PowList，A3 910+CANN 9.2.0-beta.2+ops-nn@118c0c71，A2 910B3 交叉验证一致）在指数为 NaN 时对非负底数返回 1.0（x^0=1），违反 IEEE-754（应 NaN）。边界矩阵证明只有 exp=nan 一列出错：x 段 [0.5..]/[2..]/[0..] 的 exp=nan 全返 1，exp=inf/-inf/0/-1/0.5 全部与 torch 一致；负底数段 [-0.5,-2,..] 返 nan 正确（另一支路），唯非负底数 NaN 指数被误判。关键反证：同一台 NPU torch.pow 标量版/tensor 版全对、torch._foreach_pow CPU 对，只有 torch._foreach_pow NPU 与 aclnnForeachPowScalarV2 直调错（x=[0.5,2,0,-0.5,-2,1] exp=nan：期望 [nan,nan,nan,nan,nan,1]，得 [1,1,1,nan,nan,1]，末位 1^nan=1 两边一致正确），把缺陷从平台收紧到 foreach kernel 适配链（foreach_one_scalar_binary.h→PowerAdapter），AscendC Power 基础实现无责。一行 Python 复现：torch._foreach_pow([tensor([0.5,2.0,0.0,-0.5]).npu()], nan) → [1.0,1.0,1.0,nan]。含自包含 C++ aclnn 直调复现。
  source: https://gitcode.com/cann/ops-nn/issues/8013
  behavior: NPU 上调用 foreach 幂族（torch._foreach_pow 或 aclnn ForeachPow* 直调）且指数含 NaN 时，非负底数那些元素静默返回 1.0 而不是 NaN；同元素指数为正常值时结果正确。CPU 与同机普通 pow 均正确。
  trigger_surface: A3（910）/A2（910B3）；CANN 9.2.0-beta.2；foreach 幂族算子 + NaN 指数 + 非负底数。
  discovery: 2026-11-03 每日扫描

id: INF-1714
legacy_ids: []
slug: fa_mla_skip_batch_softmax_slot_collision
aliases: []
title: FA MLA 被 skip 空 batch 占用 softmax 槽位
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FA MLA arch35 槽位管理
  behavior: multiCoreInnerIdx 在 skip 前递增，被 skip 的空 batch 也占用 softmaxSum/Max 的 mod3 环形槽位，PRELOAD_N=1 时 vec1 覆写 vec2 未读的 softmax 状态。
effect:
  objects:
  - 数值结果
  detail: MLA noquant 多 batch 场景下某 batch 的 s2LoopEndIdx<=0 被 skip、且累计 skip 次数%3==0 时 attention_out 逐元素错，LSE 仍正确，无报错；切到 PRELOAD_N=0 结果不同。
  visibility: 静默错误
mitigation:
  detect: 构造 KV 长度为 0 的空 batch 并置于核分配序列中间，比较 PRELOAD_N=1 与 PRELOAD_N=0 的 attention_out
  fix: 'PR #8319（master）/#8320（9.1.0）：把 multiCoreInnerIdx++ 从 ComputeAxisIdxByBnAndGs1 移到 skip 检查之后'

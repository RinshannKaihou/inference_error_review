id: INF-2487
legacy_ids: []
slug: detokenize_oov_silent_drop
aliases: []
title: /detokenize 词表外 ID 静默丢弃
kind: 故障
status: active
cause:
  objects:
  - subsystem: 分词/模板
    stack: vllm
    component: detokenize ID 校验
  behavior: create_detokenize() 把 request.tokens 直接交 tokenize_prompt_async()，未调用 validate_token_ids()，词表外正数 ID 无校验（负值仍被请求校验拦截）。
effect:
  objects:
  - 输出内容
  detail: POST /detokenize 对 [9707,999999999] 返回 200 与只含合法 ID 的文本；[151936]（词表+1）/[999999999] 返回 200 空串；同一 ID 在 /v1/completions 被 400 拒绝。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: '建议在 create_detokenize() 渲染前调用 renderer.validate_token_ids（未提交）；Rust 前端已有同类修复 #62775，https://github.com/vllm-project/vllm/issues/66610。'

id: INF-2546
legacy_ids: []
slug: toolcall_parser_nonfinite_json_arguments
aliases: []
title: tool-call 解析器输出非法 JSON 参数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: sglang
    component: tool-call 参数转换
  behavior: 参数值经 float()/json.loads()/ast.literal_eval() 转换后直接 json.dumps，不校验 NaN/Infinity 或 set 等非 JSON 类型。
effect:
  objects:
  - 输出内容
  detail: 参数含 NaN/Infinity 时 arguments 非合法 JSON，orjson.loads 抛 ValueError，agent 回传该轮消息即被拒；set 字面量使 json.dumps 抛 TypeError：流式下异常逃出，非流式丢弃全部 tool call，原始标记文本当正文返回。
  visibility: 静默错误
mitigation:
  detect: 构造参数为 NaN/Infinity/1e999 与 {1,2,3} 的 tool call，用 orjson.loads 校验 arguments；流式与非流式各跑一遍，检查是否丢 call 或抛 TypeError。
  fix: 未核实修复 PR；#48143 只修 qwen3_coder 的 number 分支，数组/对象与 Granite 路径未修。

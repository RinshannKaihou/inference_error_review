original:
  mechanism: flashinfer trtllm_fp4_block_scale_routed_moe（per-token NVFP4 activation scale 路径）：hidden_size 为 128 倍数但非 256 倍数（2688/2816 中仅 2688 触发——2816=256×11 对齐）时无有效 kernel 配置但不拒绝。实测（FlashInfer 0.7.3，vLLM 0.33.0 容器，GB200 SM100 与 SM107 一致）：hidden=2688、7/256 token 下 mean abs diff 达对齐隐维 ~5 倍（表：ReLU2 266.7→102.5/132.8，max 1896；SwiGLU 72.5 及 256-token NaN），单 token 正确；ReLU2/SwiGLU 双激活、E=128/top-6 与 E=32/top-4、intermediate 1920/2048 均同样触发，仅 hidden 对齐性决定。vLLM 不受影响：per-token 非 gated pad 到 512、其余 256（trtllm_nvfp4_hidden_alignment），其注释明言该 kernel 在 2688 无有效配置。最小复现复用 tests/moe/test_trtllm_gen_per_token_moe.py 的 _per_token_routed_case 与 check_accuracy，hidden∈{2688,2816,3072,4096} 参数化，2688 全败其余全过。
  source: 'https://github.com/flashinfer-ai/flashinfer/issues/9333 '
  behavior: 直接调用 flashinfer 的 trtllm_fp4_block_scale_routed_moe 且 hidden_size 是 128 的倍数但不是 256 的倍数（如 2688，Nemotron-3 Nano 的隐维）：MoE 输出大幅偏离参考（平均绝对误差约为对齐情况的 5 倍，个别配置还出 NaN），单 token 请求看起来正常；全程无错误无警告，只有与参考比对才能发现。走 vLLM 的调用因框架内部 pad 到 256/512 而幸免。
  trigger_surface: flashinfer 0.7.3 trtllm_fp4_block_scale_routed_moe per-token NVFP4 路径 + hidden_size≡128 (mod 256)（2688 等）；SM100/SM107 一致；token 数≥7 触发，单 token 不显。
  discovery: 2026-11-11 每日扫描

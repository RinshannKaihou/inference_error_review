title: NVFP4 路由 MoE 隐维不对齐静默错值
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 量化
    stack: flashinfer
    component: trtllm_fp4_routed_moe
  behavior: per-token NVFP4 路径在 hidden_size 为 128 倍数但非 256 倍数（如 2688）时无有效配置也不拒绝，静默错值；vLLM 靠 pad 到 256/512 规避，直传 2688 即 garbage。
effect:
  objects:
  - 数值结果
  detail: GB200/SM107 一致：hidden=2688 时 7/256 token 平均绝对误差约 5 倍于对齐隐维（ReLU2 diff 102.5~132.8、max 1896；SwiGLU 256-token NaN），单 token 对；2816/3072/4096 过；仅对齐性决定；无错误。
  visibility: 静默错误
mitigation:
  detect: 对 hidden 非 256 对齐的调用与参考实现对数比对（报告者复用 tests/moe 既有 helper 即稳定复现）。
  fix: 建议（issue open，1 评论未读）：拒绝非 256 对齐 hidden_size 或内部 pad；vLLM 0.33 因已 pad 不受影响。FlashInfer 0.7.3（vLLM 0.33.0 容器内）。

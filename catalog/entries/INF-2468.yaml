original:
  mechanism: NPU Inductor 的父子轴替换（parent-child axis substitution）直接比较范围表达式的结构是否相同，会漏判复合符号表达式的数值等价关系：s*u+s*z 与 s*floor((s*u+s*z)/s) 在对应整数、非零条件下等价，本应得到一致的源行/目的行映射。漏判导致 repeat 场景中 load 已被替换为子轴、store 仍使用旧父轴，行映射错误。受影响社区原始 NPU 用例：test_size_with_unbacked_add_expr_transitive_npu、test_size_with_unbacked_add_and_mul_expr_npu。修复补丁于 2026-11-05 在原 NPU 环境源码 A/B 验证：两项原用例均由 FAIL 转 PASS，test_repeat、test_repeat_as_strided 及动态索引/梯度检查通过，测试输入、断言与容差未改动。
  source: https://gitcode.com/Ascend/pytorch/issues/5962
  behavior: repeat 类算子（及依赖父子轴等价替换的用例）在 torch.compile 编译后源行与目的行映射不一致，输出值错误且无报错；受影响用例编译路径直接断言失败（FAIL），触发面为含 unbacked符号复合尺寸表达式的 repeat/strided 场景。
  trigger_surface: torch.compile + repeat/strided 场景中尺寸表达式含复合符号（s*u+s*z 类）需要父子轴等价替换的 kernel。
  discovery: 2026-11-09 每日扫描

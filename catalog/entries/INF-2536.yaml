original:
  mechanism: 'Ascend/torchair issue #969：inductor_npu_ext 的 ascendc（AF/AscIR）后端中，rand/randn 没有消费 Inductor 下发的 seed 和 offset。autofuse/ascir_api.py 中 AscIR Rand/Randn 使用固定 philoxKey={0,0}、philoxCounter={0,0,0,0} 的 continuous 模式；asc_ops.randn(seed, offset) 只生成 Op("Randn")，不把 seed/offset 作为输入；asc_ops.load_seed(name, offset) 直接返回 constant("0", torch.int64)，seed 成为死边。因此每次 kernel 执行得到相同随机数，torch.manual_seed 不生效，dropout/randn 失去随机性。期望参照 npu-triton 的 randn 实现（Philox(seed, offset)+Box-Muller），让新 CANN 把 seed/counter 作为输入（x1=seed、x2=offset），asc_ops.rand/randn 通过输入传递 seed/offset，load_seed 返回真实 seed。关联 PR #4005（rand_decompose）。'
  source: https://gitcode.com/Ascend/torchair/issues/969 ｜https://gitcode.com/Ascend/torchair/merge_requests/4005
  behavior: 用 torch.compile 的 AscendC 后端跑含 randn 或 dropout 的模型时，不管 torch.manual_seed 设成什么值，每次运行都得到完全相同的随机数序列；dropout 掩码固定、随机采样结果固定，实验无法通过换种子复现不同结果，也不会报任何错误。
  trigger_surface: torchair/inductor_npu_ext ascendc（AF/AscIR）后端；Rand/Randn/dropout；torch.manual_seed 与 philox seed/offset；NPU。
  discovery: 2026-11-13 每日扫描

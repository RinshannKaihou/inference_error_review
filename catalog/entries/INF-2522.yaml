original:
  mechanism: 'cann/ops-nn 两个空 tensor 早退缺陷，环境均为 Atlas A2（910B3）+ CANN 9.2.0、纯 aclnn C 两段式直调。① #8729 aclnnAddRmsNormDynamicQuantV2：文档《aclnnAddRmsNormDynamicQuantV2.md》:233 声明 y2Out 支持空 Tensor，:403-406 要求 outputMask 路由出的有效输出必须写出；x1/x2/gamma 非空、仅 y2Out 传 [0,64] 时，第一段 op_host/op_api/aclnn_add_rms_norm_dynamic_quant_v2.cpp:378-383 的早退判据 x1->IsEmpty()||x2->IsEmpty()||gamma->IsEmpty()||y2Out->IsEmpty() 不看 :365-368 已算出的 processOut1/processOut2 路由，直接 *workspaceSize=0; return ACLNN_SUCCESS。实测 outputMask=[0,1] 时 xOut 512/512、scale2Out 8/8 canary 保持；outputMask=[1,0] 时 y1Out 512/512、xOut 512/512 保持；y1Out 传空的反向对照返回 561002，显示判据只覆盖 y2Out。② #8743 aclnnAddRmsNorm：x1=x2=(8,4096) 非空、gamma=(0,) 时两段均返回 0，但 yOut/xOut/rstdOut 全部 32768 个 canary 未写；根因是 gamma 形状校验 CheckGammaAndRstdShape 仅在 IsRegbase() 分支调用（aclnn_add_rms_norm.cpp:189-191），非 regbase 平台无「x1 非空时 gamma numel>0」校验，gamma numel=0 进入 tiling 后 numCol=0，kernel 无写出任务。全空 x1=x2=(0,4096) 的空进空出形态两段 0/0 正常，说明缺陷只在空/非空混合组合。'
  source: https://gitcode.com/cann/ops-nn/issues/8729 ｜https://gitcode.com/cann/ops-nn/issues/8743
  behavior: 推理侧调用 AddRmsNorm/AddRmsNormDynamicQuantV2 时，只要某个输出占位或 gamma 传成空 tensor（框架在可选输出、动态 batch 或空序列场景里很自然会这样传），接口返回成功，但本应写出的 y/x/rstd/scale 等输出一个字节都没写；调用方按成功处理，读到的是分配器残留或预填 canary，表现为随机数值或全 0/NaN，且没有任何错误码。
  trigger_surface: aclnnAddRmsNormDynamicQuantV2 + y2Out 空 tensor（outputMask 路由有效输出）；aclnnAddRmsNorm + x1 非空而 gamma 为空；Atlas A2（910B3）、CANN 9.2.0、ops-nn master c090cedd/50bdfe72。
  discovery: 2026-11-13 每日扫描

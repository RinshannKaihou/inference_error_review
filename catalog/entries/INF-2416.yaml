original:
  mechanism: 'vllm-ascend 0.30.0rc2 + vLLM 0.30.0，GLM-5.3-Flash-w8a8（deepseek_mtp，num_speculative_tokens=1），PD 分离部署（TP8/DP2/EP），KV 传输 MultiConnector（MooncakeConnectorV2 + AscendStoreConnector）。(1) /v1/completions + prompt_logprobs=5：返回的 prompt_logprobs 全部为相同错误值 {logprob:0.0, rank:5, decoded_token:"!"}——未初始化或索引错位的垃圾数据，每个 prompt token 位置应各不相同，必现（HTTP 200 无任何异常）。(2) 完整 PD 分离（prefiller+decoder+proxy+Mooncake KV transfer）下向 prefiller 直接发同请求，token id 发生错位/溢出，抛 OverflowError: out of range integral type conversion attempted，整个 vLLM 引擎崩溃退出（async_llm.py:843 output_handler 栈，2026-11-05 02:35 崩溃日志）。服务崩溃前稳定运行 15 天。环境 torch 2.10.0+cpu / torch_npu 2.10.0.post7 / transformers 5.14.1 / CANN 9.2.0。根因未定位（issue 无维护者回应）。'
  source: https://github.com/vllm-project/vllm-ascend/issues/21103
  behavior: PD 分离部署的 vLLM-Ascend 服务上请求 /v1/completions 并带 prompt_logprobs 参数：返回 200 正常，但 prompt_logprobs 字段全是同一个垃圾值（logprob 0.0、rank 5、token "!"），完全不可用；在带 Mooncake KV 传输的完整架构下同请求还会触发 token id 溢出异常，整个推理引擎崩溃重启。服务此前已稳定跑 15 天，仅这个参数组合触发。
  trigger_surface: vllm-ascend 0.30.0rc2 / vLLM 0.30.0；PD 分离 + GLM-5.3-Flash-w8a8 + MTP；/v1/completions + prompt_logprobs；崩溃需 Mooncake KV transfer 路径。

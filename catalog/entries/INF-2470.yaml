original:
  mechanism: transformers 5.23.0.dev0（0f53828e）KimiLinear：缓存前缀之后，给下一段加零值 padding 会改变 KDA 输出及后续 token 使用的状态。当前 mask helper 保留了段内 padding mask，但 KimiLinearDeltaAttention（modeling_kimi_linear.py:608-712）只把 hidden states 置零，padding 位置仍推进因果卷积窗口与递归衰减。层级复现无需 checkpoint：构造 KimiLinearConfig 单层线性注意力，先跑 prefix 建立 DynamicCache，再对 suffix 分别加 left/right 零 padding（padding 值精确为 0）并以 create_recurrent_attention_mask 构造掩码，输出与 reference cache 推进不一致、probe token 的结果也随 padding 方向变化。CPU FP32 原生回退实现。
  source: https://github.com/huggingface/transformers/issues/50484
  behavior: 对 KimiLinear（KDA 线性注意力）模型做带 padding 的缓存续写或分块 prefill 时，即使 padding 值是零、掩码正确，卷积窗口和递归状态仍被 padding 位置推进——同一段文本带不同 padding 得到不同输出，且污染后续 token 使用的状态；无报错，只有与无 padding 参考对拍才能发现。
  trigger_surface: transformers KimiLinear/KDA + 缓存前缀后续写段带 padding（padded cache continuation、chunked prefill）；与硬件无关（CPU 复现）。
  discovery: 2026-11-09 每日扫描

original:
  mechanism: 'vllm-ascend issue 17527（2026-09-25，closed）。自 e5b903620（[Performance] Fuse DSV4 multi-group slot mapping，PR #15289）起，vllm_ascend/ops/triton/compute_slot_mapping.py 的 _compute_slot_mapping_fused_groups_adaptive_kernel 把 NUM_REQS 与 SMALL_TILE_BLOCK_SIZE（_next_power_of_2(tokens_per_req)，每步变化）都声明为 tl.constexpr，_select_slot_mapping_launch_config 又按步算 request_tile。混部准入下 num_reqs 在多个取值间游走而 num_tokens 贴近 max_num_batched_tokens，每个首见组合生成新 Triton 缓存键，键空间约为 max_num_seqs × 6 个自适应 tile；编译在 worker 内 subprocess.run 同步执行，把在途请求全冻住约 5.5 s（910B2）。一台节点的缓存已累积 135 个不同键。受影响版本：main 自 #15289 起、releases/v0.26.0rc 经 #15530 cherry-pick；v0.26.0rc2 早于它，故当时无 tag 携带。'
  source: 2026-09-25 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17527 （closed）
  behavior: DSV4 / DSV4-Flash / GLM-5-Next 这类多 KV 分组模型在混部压力下会周期性整段停顿：所有在途请求一起冻住约 5.5 秒，然后恢复，过一会儿再来一次。vLLM、vllm-ascend 和 CANN 都不打日志，只能在停顿时刻看到新的 Triton 缓存目录；重启后仍会复发，因为键取决于准入交错顺序。
  trigger_surface: MRV1 融合槽位映射路径 + 混部 prefill/decode 准入
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）

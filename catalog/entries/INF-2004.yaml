  behavior: 融合槽位映射内核把 NUM_REQS 与按步变化的 tile 大小写成 tl.constexpr，每个新 (num_reqs,tile,window) 组合都是新缓存键，在热路径上同步 JIT 编译约 5.5 s
effect:

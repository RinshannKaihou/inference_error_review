cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: static Triton launcher
  behavior: static launcher 在 Ascend950 one-program-per-tile 形态下 grid 与参数处理不正确，同一 in-place pointwise kernel 被多次执行，输出每执行一次被缩放一次
effect:
  objects:
  - 数值结果
  detail: Ascend950 上 triton_experimental 编译 matmul/8.0 与 eager 差 5.7~6.0；107 个社区模型 74 个 fail_accuracy；坏区域 compiled/raw≈0.0119 即 0.125 的幂；910B group-dispatch 免疫
  visibility: 静默错误
mitigation:
  detect: ic.use_static_triton_launcher=False 做 A/B 对照；坏区比值呈 0.125 幂次可识别
  fix: 规避：torch._inductor.config.use_static_triton_launcher=False（实测恢复 0.0/1.86e-06）；根治需修 static_launcher/compile_result.py 与 launcher_codegen.py（未提交）

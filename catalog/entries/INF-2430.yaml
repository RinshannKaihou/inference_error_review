original:
  mechanism: torch_npu master 1913f4f2c2（torch 2.13/torch_npu 2.13.0+git5412c2f/CANN 9.2.0）：PR !45989 引入的 static Triton launcher（torch_npu/_inductor/triton_experimental/static_launcher/）在 Ascend950（device_props.py is_a5() soc>=250 → one-program-per-tile，group_size=1）形态下启动 kernel 的 grid/参数处理不正确，导致融合出的 in-place pointwise kernel 被重复执行。证据链：1) 关闭 static launcher 后最小复现 max_abs=0.0、AlbertForMaskedLM logits 1.86e-06；2) 生成 kernel 源码原样单独以同样 grid 跑完全正确，逐步复现编译流程也正确；3) 坏区域 compiled/raw≈0.0119（0.125 幂），证明是重复缩放而非算错；4) 尺寸阈值 [4,12,128,64] 起错 55%、[4,12,512,64] 错 91.6%，[1,1,≤256,64] 与 [4,12,64,64] 全对。910B（soc<250）走 group-dispatch 不受影响。
  source: https://gitcode.com/Ascend/pytorch/issues/5920
  behavior: 在 Ascend950 上以 TORCHINDUCTOR_NPU_BACKEND=triton_experimental 跑 torch.compile，含「matmul+标量缩放」等会融合成 in-place pointwise kernel 的模型时输出被反复缩放：最小复现 (eager-compiled).abs().max() 达 5.7~6.0（期望 ~1e-6），AlbertForMaskedLM logits max_abs 1.56；社区 107 模型中 74 个/128 case 精度不通过，全程无报错。
  trigger_surface: Ascend950（soc≥250）+triton_experimental 后端+默认 static launcher+可融合为 in-place pointwise 的模式；910B 免疫

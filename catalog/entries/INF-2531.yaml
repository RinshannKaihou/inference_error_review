  kind: github_issue
relations: []
original:
  mechanism: 'flashinfer issue #9372（flashinfer 0.7.4、commit 77039051b0be921788dc2784ec41423b558878ec、SM120/RTX PRO 6000、CUDA 13.0）：packed（cu_seqlens）调用 flashinfer.gdn_prefill.chunk_gated_delta_rule 时，一个序列的最后一个不完整 chunk 会把下一序列的首行当作 padding 读入，并用乘 0 mask 屏蔽；NaN/Inf 乘 0 仍是 NaN，因此 k 或 v 的 NaN/Inf 会进入前一序列的输出与整个 final state。复现把 100 token 与 128 token 两条序列打包成一次调用，第一序列最后 chunk 覆盖 token 64-99，在第二序列首 token 的 q/k/v/g/beta 中逐个注入 NaN；只有 k 和 v 泄漏，q/g/beta 不泄漏。带与不带 state checkpoint 均复现。期望：序列结果不依赖其结束后的行，padding 用 select 或加载零值，而不是乘 0。'
  source: https://github.com/flashinfer-ai/flashinfer/issues/9372
  behavior: 用一个 packed batch 同时处理多条变长序列时，只要后一条序列开头的 k/v 含 NaN/Inf，前一条序列（长度不是 64 的倍数）的输出和整个 recurrent final state 就会被污染成 NaN；前一条请求本身完全正常，却返回 NaN 或后续解码全坏。没有报错，换 batch 组合或单独跑就恢复正常，属于跨请求污染。
  trigger_surface: flashinfer.gdn_prefill.chunk_gated_delta_rule packed cu_seqlens、SM120、序列长度非 64 倍数、后一序列首 token k/v 含 NaN/Inf；flashinfer 0.7.4。
  discovery: 2026-11-13 每日扫描

id: INF-2531
legacy_ids: []
slug: flashinfer_gdn_prefill_nan_cross_sequence_leak
aliases: []
title: GDN prefill NaN 跨序列污染前序状态
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: GDN prefill packed 路径
  behavior: packed varlen 的最后一个不完整 chunk 把下一序列首行当 padding，用乘 0 mask；NaN/Inf 乘 0 仍是 NaN，k/v 的 NaN 因此进入前一序列输出与最终状态。
effect:
  objects:
  - 跨请求/跨样本数据
  - KV状态
  - 输出内容
  detail: 两序列 100+128 token 打包，第二序列首 token 的 k 或 v 为 NaN 时，第一序列输出与整个 final state 含 NaN；q/g/beta 不泄漏；带/不带 state checkpoint 均复现。
  visibility: 数值异常
mitigation:
  detect: packed cu_seqlens 调用中把第二序列首 token 的 k/v 置 NaN，检查第一序列输出与 final state 是否被污染；再分别注入 q/g/beta 作对照。
  fix: '待定（issue #9372 open；期望 padding 用 select/零填而不是乘 0 mask）。'
labels:
  stage: N/A

original:
  mechanism: 'CANN ops-nn aclnnSituGlu（A2 910B3，CANN 9.2.0，master 46ff6fdb，ctypes+numpy 两段式直调实测）4 个缺陷全为两段 rc=0 的静默错误：(1) CheckY（situ_glu_tiling.cpp:229-278）只校验 rank、y[cutDim]==x[cutDim]/2、dtype 三项，文档要求的非 dim 轴一致性无校验；kernel 几何完全取自 x（:196-206）按 x 几何直写 yGm（situ_glu.hpp:140-172，:349）——x=[4,32]/out=[2,16] 时写 64 元素超 out 32 元素声明，尾后 128B 越界写（金丝雀 32/64 被踩）；out 行数大于 x 时多余行留脏；x=[0,32] 空×out 非空时 numel=0 早退 rc=0，out 32 元素全保持预填。(2) attr 按 float 读取（:171-174 GetAttrPointer<float>）而 API 签名/文档为 double：beta=1e300→float 溢出 inf→0×inf 全 NaN；beta=1e-46→下溢 0→0/0 全 NaN；linearBeta=1e-46 下溢后 lb>0 分支翻转不压缩 up（相对误差 2e46）；linearBeta=1e300→inf×0 全 NaN。(3) SituCore（situ_glu.hpp:262-291）Muls(gate,1/beta)→Tanh→Muls(beta) 结构把 tanh 绝对误差地板（~6.6e-9）按 β 放大：β=1e6 时 |gate|≤0.01 的 6/6 元素输出精确 0.0（标杆非零，相对误差 100%）；β=1e4 起归零，误差随 β 线性放大。(4) 非连续 out 视图（strides=[4096,1] 行间隙 2048）按连续直写：行 0 写对、间隙 2048 元素被越权改写、行 1 完全漏写。同库同模式参考 #7760（aclnnSwiGlu）。'
  source: https://gitcode.com/cann/ops-nn/issues/8265
  behavior: GLU 类激活算子在四种情形下静默出错：输出张量与输入形状不匹配（除切割轴外）时，算子越界写坏输出缓冲区后面的内存（金丝雀实测被踩 128 字节）或把没算到的行留成旧值；输入为空而输出非空时直接返回成功但输出全没写；beta 参数传 double 大值（1e300）或极小值（1e-46）时内部按 float 截断，输出整块 NaN 或数学语义翻转；beta≥1e4 时小数值门控输出精确归零；输出是非连续视图时按连续内存直写，漏写整行还污染行间隙。全部无报错。
  trigger_surface: CANN 9.2.0；aclnnSituGlu；A2 910B3；out 与 x 非切割轴不一致 / 空 x+非空 out / beta、linearBeta 超 float 表示域或 ≥1e4 / 非连续 out 视图。
  discovery: 2026-11-05 每日扫描
  notes:
  - 2026-11-11 2026-11-11 回访：修复 PR !14239（WIP open）按四类缺陷整改——out 非切分维 shape 校验+空 x 校验（消除越界写/留脏/静默成功）、非连续 out 视图拒绝、beta/linearBeta float32 可计算域校验（561002）、TanhScale 级数分支修复 β>=1e4 小输入整体归零；910B3 单算子包自验（越界/留脏/空 x 用例均 561002、金丝雀无改写、β=1e4~1e8 小输入 maxRel<=1.3e-07）+12 例 tiling UT。合入未核实。

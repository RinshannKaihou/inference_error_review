original:
  mechanism: 'arXiv 2611.06138（2026-11-04，KVGuard: A KV Cache Safety Checker for LLM Serving Systems）：论文论证现代 LLM serving 经 PagedAttention 管理 KV cache——把单个 CUDA 分配区切固定大小物理块、CPU 侧构建块表把请求映射到块——这一设计暴露此前未系统研究的 KV cache 内存安全缺陷类别：double-free、use-after-free、越界访问、未初始化读、权限违规，静默损坏输出或破坏请求隔离而从不崩溃。现有内存 sanitizer 无法检测这类缺陷：它们推理 CUDA 级地址而非 KV 块/请求/块表语义，且 redzone/quarantine 设计不适配 LLM serving 紧张的 GPU 显存预算。KVGuard 提出首个面向 KV cache 管理的系统性内存安全抽象（检查器）。该论文定义的缺陷类别与本库已收 KV 域条目（如 INF-2424 Nixl 租约过期读回收块、INF-2452 滑窗陈旧块跨请求污染、INF-1430 空 work 越界写污染相邻缓存）方向吻合，可作为监测方法参考；其对具体已编目缺陷的检出效果未经本库实测。'
  source: arXiv https://arxiv.org/abs/2611.06138 （2026-11-04 v1）
  behavior: 按论文描述：serving 栈 KV 管理器的块分配/回收/映射缺陷会以静默方式损坏生成输出或让一个请求读到另一请求的 KV 状态（double-free/UAF/越界/未初始化读/权限违规五类），进程不崩溃、无错误日志；KVGuard 作为检查器在块/请求/块表语义层拦截这类违规。
  trigger_surface: PagedAttention 式块管理 KV cache 的 serving 栈（vLLM 类块分配器+CPU 块表）；块生命周期管理代码缺陷。
  discovery: 2026-11-08 每日扫描

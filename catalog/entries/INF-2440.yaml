title: AdaptiveMaxPool2d NHWC 输出未转回布局，恒等池化即整块错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: adaptive_max_pool2d
  behavior: ConvertNHWCtoNCHW 只转输入，ProcessAdaptiveMaxPoolResults 把 NCHW 结果直接 Reshape 成 NHWC 形状后 ViewCopy，缺 NCHW→NHWC 反向 transpose
effect:
  objects:
  - 数值结果
  detail: 恒等池化（outputSize 取输入 H/W）下，4 维 NHWC 且 C>1（C=8 用例）输出 126/128 元素与输入不一致；NCHW 输入与 NHWC C=1 对照全对；两段接口均返回 0，自包含 C++ 复现脚本在缺陷复现时退出码 1。
  visibility: 静默错误
mitigation:
  detect: NHWC 路径恒等池化自检（输出应逐元素等于输入）
  fix: 待定（应在 ProcessAdaptiveMaxPoolResults/ProcessAndCopyResults 中把结果含 indices transpose 回 NHWC 再 ViewCopy）

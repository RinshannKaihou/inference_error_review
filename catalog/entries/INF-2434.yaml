original:
  mechanism: 'cann/ops-nn 三单同型缺陷（950）：#8304 aclnnLayerNorm 对 eps<0 放行并静默输出全 NaN，同族 aclnnAddRmsNorm 返回 161002；#8309 aclnnFastLayerNorm 对 eps<0 不校验，放行 rc=0 并静默产出全 NaN（与 #8304 同型、接口不同）；#8310 aclnnBatchNorm 对 eps<0 不校验，放行 rc=0 并静默产出全 NaN（与 #8304/#8309 同型）。三单均实测 rc=0，属参数校验缺失+非法参数静默产出 NaN：调用方传负 eps（配置错误、符号算反、动态 eps 计算出错）时接口不拒绝，方差倒数 1/sqrt(含负 eps 的表达式) 产出 NaN 整块输出，返回码 SUCCESS。同仓 AddRmsNorm 的正确拒绝行为证明这是校验缺失而非约定行为。'
  source: https://gitcode.com/cann/ops-nn/issues/8304 （同型：https://gitcode.com/cann/ops-nn/issues/8309 https://gitcode.com/cann/ops-nn/issues/8310 ）
  behavior: 调用方误传负 eps 时，LayerNorm/FastLayerNorm/BatchNorm 三个归一化算子都不报错：两段接口返回成功，输出整块 NaN；若下游不显式检查 NaN（训练步多数情况），NaN 沿网络静默扩散多步后才在别处显形；同族 AddRmsNorm 则会立即以 161002 拒绝，同仓行为不一致。
  trigger_surface: eps<0（调用方参数错误）+aclnnLayerNorm/aclnnFastLayerNorm/aclnnBatchNorm；950

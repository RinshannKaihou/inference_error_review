title: SGLang 量化 router 权重静默不加载或无 scale 加载
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: sglang
    component: MoE router 构建量化配置传递
  behavior: Qwen3-MoE 仅 ModelSlim 格式给 router 传 quant_config，Mixtral/Llama4 全格式不传；量化存储的 router 张量无参数可落被静默跳过，或 FP8 codes 无 scale 拷入。
effect:
  objects:
  - 模型权重
  - 输出内容
  detail: router 权重未加载时对全部专家输出 NaN，服务器无错启动，回答全是反斜杠/换行垃圾：GSM8K 0.0%（修复构建后 85.7%）；FP8 codes 无 scale 时 router logits 偏差 scale 倍（相对误差 301~7394），路由错误，服务静默错答。
  visibility: 静默错误
mitigation:
  detect: 加载后取 layer 0 router 真实张量过 SGLang load 步骤，比对 checkpoint 反量化参考（x@(codes*scale)^T）；或跑 GSM8K 探针；加载日志中 weight_scale not found 警告（Mixtral/Llama4 有、Qwen3-MoE 无）。
  fix: 'PR #49187（#49185 报告者提交，compressed-tensors 路径传 quant_config）open；#49198 指出还需按 checkpoint 实际存储决定是否建量化 router（10/238 个 checkpoint config 会量化但 router 存 BF16，盲目建反而 NaN），完整修复未合'

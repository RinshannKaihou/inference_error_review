original:
  mechanism: torch_npu/_inductor/codegen/cpp_wrapper_npu.py 的 CppWrapperNpu.generate_args_decl（Ascend_950、torch_npu 2.13）：先处理默认整数类型固定 int32_t，随后才检查 Triton signature。unbacked 符号表达式被简化为整数后，应按 i64 签名打包的参数提前进入默认分支。失败 kernel 的 y0_numel/x1_numel/Y0BLOCK 均要求 i64，调用端打包为 int32_t/int32_t/int64_t，前两字段合计少占 8 字节，Y0BLOCK 从应有偏移 48 提前到 40，后续 grid 字段错位；kernel 用 Y0BLOCK 计算行偏移/循环次数/写入掩码，写入受影响。该 kernel 负责拼接输出第二分块 [256,512)，300×256=76800 个元素与 25% 错误数一致，最大错误点 (85,399) 位于该分块。基线与候选用相同三项诊断前置、新进程、独立缓存对照；另 6 组标量检查覆盖 int+i32/i64/u64、float+fp64、bool+i1、无签名整数。修复分支顺序与上游 CppWrapperGpu 一致。
  source: https://gitcode.com/Ascend/pytorch/issues/5925
  behavior: AOTInductor + unbacked 符号尺寸 + use_static_size=True 的组合下，编译出的 C++ wrapper 把 i64 尺寸参数按 int32 打包，参数块整体错位：输出张量约 1/4 元素值静默错误（最大差近 14），无报错；同一 kernel 源码逻辑本身正确，错误仅在 wrapper 参数布局。
  trigger_surface: AOTInductor+unbacked 符号表达式+use_static_size；Ascend_950、torch_npu 2.13
  discovery: 2026-11-06 每日扫描

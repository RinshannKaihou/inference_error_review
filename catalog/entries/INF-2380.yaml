original:
  mechanism: CANN ops-transformer block_sparse_attention（BSA）算子（9.2.0）在大规模稀疏 blockSparseMask 下，展平偏移计算超过 uint32_t 范围导致地址回绕，读取错误位置的数据造成精度问题。复现：构造超大用例 kvseqlen=10M、blockShape=128，精度不通过；常规规模用例正常，缺陷仅在展平偏移溢出 uint32 的超大稀疏场景触发。issue 与修复 MR !15196 同日提交并已 merged（issue closed），发布版本携带情况未核实。

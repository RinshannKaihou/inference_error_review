  behavior: 对超长序列（kvseqlen 千万级）配大 blockShape 的稀疏 block attention 调用 BSA 算子时，输出精度测试失败（双标杆比对不过）；中小规模完全正常，因此只有极大上下文稀疏场景受影响。无崩溃无报错。
  trigger_surface: CANN 9.2.0；block_sparse_attention；kvseqlen~10M 级 + blockShape=128 的超大稀疏 blockSparseMask。

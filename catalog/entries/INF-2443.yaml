id: INF-2443
legacy_ids: []
slug: ascendstore_pp_rank_key_noop
aliases: []
title: AscendStore decode PP 键扩展静默不生效
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: decode_adaptor_prefill_pp
  behavior: decode_adaptor_prefill_pp 用硬编码 @pp_rank:0 做键替换展开，但键内 @pp_rank 是本 worker 秩；pp_rank>0 的 worker 替换不命中，N 个扩展键全等于原键
effect:
  objects:
  - KV状态
  - 跨请求/跨样本数据
  detail: PP>1 且 pool worker pp_rank≠0 的 decode 实例：store 路径 N 个分区切片写同一键互相覆盖，只留一份 KV；lookup N 个键解析到同一键，all() 聚合假报块完整，缺失分区被永久跳过；无报错，长提示下 decode 输出质量劣化或与前缀不一致
  visibility: 静默错误
mitigation:
  detect: store 后按键空间抽查 @pp_rank:0..N-1 键存在性
  fix: 待定（按 KeyMetadata.pp_rank 构造源串或改用非硬编码替换）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-06'
remarks: 静态代码检查发现（main@e617b70），代码路径确定性但无 NPU runtime 复现。

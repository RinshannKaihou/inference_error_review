relations: []
original:
  mechanism: vllm-ascend main@e617b70（2026-11-06 静态检查，路径确定性）：vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/metadata.py:680-702 decode_adaptor_prefill_pp 用硬编码 key.replace("@pp_rank:0", f"@pp_rank:{j}", 1) 把一个逻辑 store 键展开为每个 prefill PP rank 一个键；但键前缀（metadata.py:349-357）内嵌的 @pp_rank 来自 KeyMetadata.pp_rank=本 pool worker 的 rank_in_group（pool_worker.py:127/315-321），不恒为 0。decode 实例 PP>1 时 pp_rank≠0 的 worker 键为 @pp_rank:<k>，replace 不命中返回原键，N 个扩展键全相同。后果：1) store 路径（kv_transfer.py:926-932）N 个分区切片写同一键互相覆盖，只留一份 KV；2) lookup（:510-515）N 个键解析到同一键，all() 聚合（:531-533）假报块完整——正是其 docstring（:496-504）警告的 false-hit 场景，缺失分区被永久跳过；3) 计数校验（:933 len%logical）对重复键平凡通过；4) 期望的 @pp_rank:0..N-1 键空间在该 rank 不存在，decode 消费方与 prefill 生产方键空间不一致。
  source: https://github.com/vllm-project/vllm-ascend/issues/21164
  behavior: PD 分离部署中 decode 实例 PP>1 且 AscendStore pool worker 秩不为 0 时：多 PP prefill 的 KV 块保存静默丢失（N 份只存下 1 份），块查询却报告完整命中，decode 复用到不完整/错误的 KV；无报错，表现为长提示下 decode 输出质量劣化或与前缀不一致，难与量化噪声区分。
  trigger_surface: AscendStore KV pool+decode 侧 PP>1+pool worker pp_rank≠0；main@e617b70
  discovery: 2026-11-06 每日扫描
  notes:
  - '2026-11-09 2026-11-09 回访：修复 PR #21348 开出（open）——从本组 metadata.pp_rank 推导源 rank、按字段解析替换 @pp_rank（避免 @pp_rank:1 误匹配 :10）、rank 不匹配或扩展出重复键即 fail fast，并附单测；issue #21164 仍 open。'
  - '2026-11-10 2026-11-10 回访：issue #21164 仍 open，修复 PR #21348 仍 open 未合入，状态与 11-09 相比无变化。'

original:
  mechanism: cann/runtime aicpu_sched 守护进程：worker 线程初始化失败（中断模式 halEschedSubscribeEvent 返回非 DRV_ERROR_NONE，或消息队列模式 MessageQueue::InitMessageQueueForThread 失败）时该线程在 PostSem 后退出，但 threadStatusList_ 未回退仍为 THREAD_RUNNING；主线程 CreateWorker 通过 sem_wait 等待各 worker 应答后校验 threadStatusList_==THREAD_RUNNING——已死 worker 状态未回退，校验被绕过，对该 worker 返回成功。修复（PR !6157）：失败路径在 PostSem 前置 THREAD_EXIT。触发窗口为守护进程启动期，属低频初始化竞争，但一旦命中即整核 AICPU 任务无人调度。
  source: https://gitcode.com/cann/runtime/issues/1357
  behavior: NPU 上 aicpu_sched 守护进程启动时若某 worker 线程初始化失败，服务照常启动成功（CreateWorker 返回成功、无任何日志报错），随后落到该 AICPU 核的任务全部挂起：进程不报错不退出，host 侧同步等待超时，业务表现为无进展的卡死，现场只能靠排查定位。
  trigger_surface: aicpu_sched 守护进程启动期 worker 初始化失败（halEschedSubscribeEvent 失败或消息队列初始化失败）；低频但命中即整核任务静默挂起。
  discovery: 2026-11-10 每日扫描

id: INF-2496
legacy_ids: []
slug: aicpu_sched_worker_false_success_hang
aliases: []
title: aicpu_sched worker 假成功致业务静默卡死
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: CreateWorker 状态校验
  behavior: worker 线程初始化失败（事件订阅或消息队列初始化失败）时在 PostSem 后退出，但 threadStatusList_ 未回退仍为 THREAD_RUNNING；CreateWorker 校验被绕过，对该 worker 返回成功。
effect:
  objects:
  - 可用性/进度
  detail: 触发于 aicpu_sched 守护进程启动期 worker 初始化失败（事件订阅 halEschedSubscribeEvent 失败或消息队列初始化失败），低频；服务照常启动成功且无日志报错，落到该 AICPU 核的任务全部挂起，进程不报错不退出，host 侧同步等待超时，业务无进展卡死。
  visibility: 挂起
mitigation:
  detect: 待定
  fix: 修复 PR https://gitcode.com/cann/runtime/merge_requests/6157（初始化失败路径在 PostSem 前将线程状态置 THREAD_EXIT，使 CreateWorker 校验识别已退出 worker 并返回启动失败；合入状态未核实）。

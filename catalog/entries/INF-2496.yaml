title: aicpu_sched worker 假成功致业务静默卡死
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: CreateWorker 状态校验
  behavior: worker 线程初始化失败（事件订阅或消息队列失败）PostSem 后退出，但 threadStatusList_ 仍为 THREAD_RUNNING；CreateWorker 校验被绕过返回成功，事件无人消费任务挂起。
effect:
  objects:
  - 可用性/进度
  detail: 该 AICPU 核订阅的 kernel/msg 类事件从此无人消费，落到该核的任务挂起、host 侧同步等待超时；守护进程自认启动成功，业务卡死且无错误上报，现场排查困难。
  visibility: 挂起
mitigation:
  detect: 待定
  fix: 修复 PR https://gitcode.com/cann/runtime/merge_requests/6157（初始化失败路径在 PostSem 前将线程状态置 THREAD_EXIT，使 CreateWorker 校验识别已退出 worker 并返回启动失败；合入状态未核实）。

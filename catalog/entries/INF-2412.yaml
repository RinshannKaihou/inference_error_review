cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FA DN 尾块 dstStride
  behavior: A6（CV_RATIO==1）DN 路径 cube 侧 fixpipe dstStride 写死 s1BaseSize，vec 侧按 Align32(s1RealSize) 行距读取，尾块两侧行距不一致致 softmax 数据错位
effect:
  objects:
  - 数值结果
  detail: TND varlen 尾块（s1RealSize≤32 而 s1BaseSize=64）时输出从尾块首行起错误，batch 内前面行正确；A5（CV_RATIO=2）恒等不受影响
  visibility: 静默错误
mitigation:
  detect: 变长序列尾块行单独与参考实现对齐比对；规避可用等长 padding 消除尾块
  fix: 修复 MR !15352 已挂（CV_RATIO==1 分支 dstStride 改跟随 nSize），open 未合入

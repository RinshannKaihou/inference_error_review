original:
  mechanism: CANN ops-transformer FlashAttentionScore（A6 ascend960dt DAV_9201，CANN 9.3.0）。d=192>128 时 tiling 选 S1Base=64；无可选输入时 A6 上 IsDnForTrain=true 走 classic DN 路径（IterateBmm1DnSplitK + ProcessVec1Dn）。cube 侧 DN fixpipe 的 CV_RATIO==1 分支 dstStride 写死 s1BaseSize；vec 侧以 m=Align32(s1RealSize)/CV_RATIO 为行距读取 bmm1 UB 瓦片；尾块 Align32(s1RealSize)<s1BaseSize（如 s1RealSize≤32 时 nSize=32≠64）时写入行距与读取行距不一致，softmax（max/sum/exp）数据错位。复现场景（B=2,headNum=1,seq_q=[250,1],seq_kv=[41,40],d=192,dv=128,bf16）：batch1 唯一输出行（第 250 行）起错误，batch0 前 250 行正确。A5（CV_RATIO=2）dstStride=nSize/2 恒等于 vec 侧 m，无此问题。
  source: https://gitcode.com/cann/ops-transformer/issues/7138
  behavior: 昇腾 A6 上变长序列注意力计算：当某个 batch 的 query 长度不是对齐基数的整数倍（存在尾块，如 250 和 1 混批）时，注意力输出从尾块对应的行开始悄悄算错，前面的行正常。修复 MR 已提交但未合入。同负载在 A5 上正确。
  trigger_surface: CANN 9.3.0；FlashAttentionScore DN 路径；A6 ascend960dt；d>128（S1Base=64）+ 变长 TND 存在尾块（Align32(s1RealSize)<s1BaseSize）；bf16 复现。

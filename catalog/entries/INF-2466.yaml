  behavior: ActPerChannelMinmax.forward 每次 reset 观察器再 update，历史幅值统计被丢弃；deploy 又把最后一批参数固化为部署 scale——校准统计只覆盖最后一批。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 连续输入幅值 100 与 1 两批 KV 样本，per-channel max scale 从 0.78740156 变 0.007874016（前批幅值被丢）；官方 dynamic_cache 配置即 per_channel，部署 scale 只反映末批，更大幅值输入即溢出/截断，质量静默退化。
  visibility: 质量退化
mitigation:
  detect: 连续跑两个已知幅值（100、1）的 KV 样本过 DynamicCacheQuantizer，检查 scale 是否只剩末批统计；issue 附最小复现脚本。
  fix: 待定（issue open，未见修复；正确行为应跨批累积 min/max 或在 deploy 前聚合全部校准统计）

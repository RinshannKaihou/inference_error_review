    component: 量化 KV 索引读通路
  behavior: mxfp8/fp8 量化 KV cache 按槽位张量 gather 读回位级损坏数据；同一缓存顺序分页读正确、bf16 cache 索引读精确，缺陷仅在量化 cache 张量索引访问路径。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 量化 KV 下任何按索引 gather 选槽位的稀疏/检索式读路径静默拿到损坏 K/V，无报错无 NaN；LSA 式 top-k 读全坏。950DT、vllm-ascend v0.30.0-a5 实测。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 社区规避：写 cache 时另存 bf16 镜像、从镜像 gather（16 层 65536 行约多占 4GB，https://github.com/vllm-project/vllm-ascend/issues/21285）；上游修复未见。

original:
  mechanism: Ascend 950DT、vllm-ascend v0.30.0-a5（CANN 9.2.1、torch_npu 2.10.0.post7）上以 Qwen3.8-27B-w8a8c8-mxfp8 加 --kv-cache-dtype mxfp8 运行：单层经 reshape_and_cache 写入已知 K/V 行后，用乱序 int64 slot_ids 张量 gather 读回，值为位级损坏（量化 payload 损坏）；对同一 cache 顺序切片读（key_cache[0:N]）完全正确；bf16 cache 重复同实验精确匹配，排除调用方索引代码问题。缺陷只出现在量化（fp8/mxfp8）KV cache 张量的任意槽位索引读路径，根因未定位，报告方向上游确认该路径是否受支持。
  source: https://github.com/vllm-project/vllm-ascend/issues/21285
  behavior: 使用 mxfp8/fp8 KV cache 的服务，任何按槽位索引 gather 的读法（稀疏注意力、LSA 式 top-k 检索读）拿到的 K/V 值是错的——位级损坏、无报错、无 NaN，服务照常运行；同一批数据改成分页顺序读则完全正确。要恢复正确需为相关层额外维护一份 bf16 镜像并从镜像 gather，代价是显存翻倍（16 层 65536 行约 4GB）。
  trigger_surface: --kv-cache-dtype mxfp8/fp8 的量化 KV cache + 按槽位张量索引 gather 的读路径；分页 attention 顺序读不受影响。
  discovery: 2026-11-09 每日扫描

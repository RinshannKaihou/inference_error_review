title: vLLM 激活/门控算子非连续输入静默错值
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: SiluAndMul 等 CUDA 激活族
  behavior: 8 个 CUDA 激活/门控 launcher 不做 stride 校验，直接把张量传给按连续布局读写的 kernel；同值 strided 输入时结果与参考无关，strided 输出时只写一半单元并越界改写父 buffer。
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: T=8/H2=256 fp16，输入 stride 4 的同值视图 rel error 1.82（连续对照 0.0004）；输出视图 parent[...,::2] 只写 1024/2048 单元，另有 1024 个 view 外 parent 单元被覆盖；8 个输入、7 个输出算子复现。
  visibility: 静默错误
mitigation:
  detect: 对每个激活算子用 stride 2/4/8 与 token-strided 的同值视图对照连续输出；输出视图用 NaN 预填 parent 检查未写单元与越界覆盖
  fix: '待定（open；issue 建议在 wrapper 加 stride/contiguity 校验或 .contiguous()，参照 PR #67434）'

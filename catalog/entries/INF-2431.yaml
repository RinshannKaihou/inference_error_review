  mechanism: cann/ops-math（master dd85135684，2026-11-06 复现，Atlas A2 910B2、CANN 9.3.0）aclnnReplicationPad2dBackward 与 aclnnReplicationPad3dBackward：资料参数表（L99）声明 self 支持 DOUBLE，但 op_host/pad_v3_grad_replicate_def.cpp 的 .DataType() 只注册 DT_FLOAT/DT_FLOAT16/DT_BF16。把官方示例所有 ACL_FLOAT 改 ACL_DOUBLE（std::vector<double>）实测两段均 rc=0 放行，gradInput=[0,2.25,0,2.25]，既非 FLOAT 结果 [4,4,4,4] 也不符合任何合理 fp64 语义——DOUBLE 进入未定义路径（AiCore 无 float64 单元、既未模拟也未拦截，FP-A11 形态）。对照同仓 aclnnMoeTokenUnpermuteWithRoutingMap 对 DOUBLE 正确返回 161002，证明放行是本算子缺陷而非全局行为。

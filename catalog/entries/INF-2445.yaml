  mechanism: cann/ops-transformer FlashAttentionScore arch35 非量化 kernel（arch35 非 3510 架构）：hasRope 场景下 IterateBmm1NdL0Split 中当 s1BaseSize>=s1Size 时对 query rope 偏移额外乘以 s1BaseSize/s1Size（#if __NPU_ARCH__ != 3510 分支），与同函数内 Q、keyRope 使用 runInfo.goIdx 计算偏移不一致；gSize>1 时 goIdx 被放大，读取到错误的 rope 数据导致精度异常。修复方案为删除该特殊缩放分支，使 queryRopeGm 偏移与 Q/keyRope 一致使用 goIdx；输出与 golden 一致。issue 已 closed 并关联 MR !15422（合入状态未核实，closed 不自动证明已修复发布）。

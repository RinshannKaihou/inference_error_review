    component: PadConv2dFusionPass
  behavior: 融合把 Pad 填充量累进 Conv2D pads 后，dn2nz 能力缺失平台仍将 padding 写成 SAME；InferConv2DPadsWithPadding 按 SAME 重算并覆盖 pads，融合进来的显式填充丢失
effect:
  objects:
  - 数值结果
  detail: Pad(4)+Conv2D(7x7,s2,VALID) 输入 [256,512,512,1]：未融合 Conv 输出 [256,257,257,16]、MaxPool [256,128,128,16]；融合后 [256,256,256,16]/[256,127,127,16]，无报错
  visibility: 静默错误
mitigation:
  detect: 融合前后输出 shape 对照；检查融合后 Conv2D 的 padding/pads 属性
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13841（open）：融合后统一写 padding=EXPLICIT/auto_pad=NOTSET 保留 pads；nn_op_graph_ut 19 项用例通过（same_padding_fused_pads 验证 SAME[2,3]+Pad[3,3] 合并为 [5,6,5,6]）

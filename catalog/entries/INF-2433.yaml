original:
  mechanism: cann/ops-nn PadConv2dFusionPass（A2/A3、CANN 9.2.0、Python 3.10.12）：融合时把 Pad 的填充量累加进 Conv2D 的 pads 属性，但在不满足 Intrinsic_data_move_out2l1_dn2nz（dn2nz）能力的平台上融合后仍将 Conv2D 的 padding 写成 SAME。Conv2D shape 推导（InferConv2DPadsWithPadding，conv2d_infer_fns.cc）遇 padding=SAME 按输入/kernel/stride/dilation 重算并覆盖 pads，融合进来的显式填充丢失：SAME(512,k=7,s=2) 只得 [2,3]（有效填充 5），正确应为 pads=[4,4,4,4]（有效填充 8），输出 256 vs 257。修复（MR !13841）：融合后的前向 Conv2D 统一写 padding=EXPLICIT、auto_pad=NOTSET 并清理不再使用的 dn2nz 平台判断。
  source: https://gitcode.com/cann/ops-nn/issues/8322
  behavior: A2/A3 上 Pad+Conv2D 图被 PadConv2dFusionPass 融合后，Conv2D 及后续 MaxPool 的输出尺寸比未融合时小 1（如 257→256、128→127），张量 shape 静默改变、无报错；下游算子按错位 shape 继续计算，CNN 推理输出整体错位，且同一模型在支持 dn2nz 的平台上行为不同。
  trigger_surface: dn2nz intrinsic 缺失平台（hasDn2Nz=false）+Pad+Conv2D 可融合 pattern；A2/A3、CANN 9.2.0
  discovery: 2026-11-06 每日扫描

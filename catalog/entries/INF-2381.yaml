original:
  mechanism: MindSpore 字符串枚举参数（fft 的 norm、loss 的 reduction 等）接受其他枚举类型的名字并静默映射为本参数某取值而非报 ValueError。根因：mindspore/ops/op_def/op_enum.cc 中 REG_STRING_TO_ENUM_COMMON 调用 AddValues(map) 时 key 默认为空串，所有 COMMON 枚举（Reduction、NormMode、PadMode、RoundingMode……）被 merge 进同一张表；GetValues 找不到专用 key 时也返回这张合并表，字符串只要出现在任一 COMMON 枚举里就被接受，得到的整数再被当成当前参数的枚举值。实测（CPU）：ops.fft2 norm='none' 结果与 'ortho' 相同（[5,-1,-2,0]）、'mean' 同 'forward'、'sum'/'tanh'/'zeros' 同 'backward'，而文档写 norm 仅支持 backward/forward/ortho 且非法值应 ValueError；ops.binary_cross_entropy reduction='ortho'/'floor' 返回逐元素损失（同 'none'）、'forward' 返回均值（同 'mean'），ops.smooth_l1_loss 相同；真正不存在的 'foo' 才报 Failed to convert ... to enum。附完整可运行复现脚本与逐值输出表。
  source: https://atomgit.com/mindspore/mindspore/issues/29710
  behavior: 给算子字符串参数传本参数不支持的取值（但属于其他枚举的名字，如 norm='none'、reduction='ortho'）时，不报 ValueError，而是静默按另一个语义计算：fft2 按 ortho 归一化、BCE/smooth_l1 的 reduction 被换算成 none 或 mean，结果数值与调用者意图不同。拼写完全错误的值仍会报错，掩盖了枚举校验的存在感。
  trigger_surface: MindSpore（issue 未标注具体版本，最新版本未修复）；PyNative/图模式通用；字符串枚举入参（norm/reduction 等）传入跨枚举取值。
  discovery: 2026-11-03 每日扫描

original:
  mechanism: vllm-ascend AscendFp8Config.get_quant_method() 用 is_layer_skipped(..., match_mode="exact") 检查 ignored_layers。GLM-5.3-Flash 原生 FP8 检查点的 quantization_config.modules_to_not_convert 以扁平前缀（model.layers.3.self_attn.indexer.wq_b）列出约 1150 层，但 vLLM 以嵌套 Glm5NextForConditionalGeneration 包装加载，真实前缀是 language_model.model.layers.3...，精确匹配对所有条目全部失败。检查点明确排除（其中若干层根本没有 weight_scale_inv 张量）的层被静默路由到 FP8 块量化，无错误、无形状失配、无警告。直接实测：11 层索引器每层的 query 向量 q_values 对所有 token、所有位置恒为零，稀疏索引 top-k 选择塌缩为与 query 无关的固定集。修复 PR 20861 在 exact 失败后重试 suffix 匹配并一次性告警，测试 20/20 通过，量化 UT 489 passed。环境：Ascend 950DT、CANN 9.2.0.b080、vLLM 0.31.0、TP=8。
  source: https://github.com/vllm-project/vllm-ascend/issues/20860 修复 https://github.com/vllm-project/vllm-ascend/pull/20861
  behavior: GLM-5.3-Flash 原生 FP8 检查点在 vllm-ascend 服务时基准分数大幅低于预期区间（AIME2026 40% 对期望 ~90-93%，GPQA-Diamond 62.1% 对期望 ~89.9%），生成呈现长而无效、大量撞 max_tokens、与 W8A8-MXFP8 版本相比逐字重复率升高；模型加载与服务完全正常，无任何报错或警告。打修复后 AIME2026 93.3%、GPQA 89.4%。
  trigger_surface: vllm-ascend main（vLLM 0.31.0）；GLM-5.3-Flash 原生 FP8 检查点 + 嵌套包装模型；Ascend 950DT TP=8。其他 exact 匹配已成功的检查点不受影响。
  discovery: 2026-11-04 每日扫描

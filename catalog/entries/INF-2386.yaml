    component: AscendFp8Config 层排除匹配
  behavior: 检查点以扁平前缀列出约 1150 个排除层，嵌套包装模型真实前缀多一层，exact 匹配全部失败，被排除层（若干层无 weight_scale_inv 张量）被静默路由到 FP8 块量化
effect:

  mechanism: vllm-ascend 0.30.0rc1+PR#19309，vLLM v0.30.0，Atlas 910B 8 NPU，CANN 9.2.0，GLM-5.3-Flash-w8a8，deepseek_mtp 投推，ns∈{1,3}，36 个 ais_bench 作业（输入 32k-200k×1k 输出×prefix_cache 开关×bs 1-32）。同负载下仅改并行布局：TP4×PP2 ns=3 平均接受率 36.7%（逐位置 62.0/29.8/18.4%）、MAL 0.367；ns=1 同布局 88.5% 正常；TP8（PP=1）ns=3 65.3%（84.6/65.0/46.3%）正常。结构差异仅 PP 深度 2（MTP drafter 复制到各 PP stage）vs PP=1，隔离到 PP+MTP 组合，排除 GLM-5.3 MTP 权重与 ns=3 本身。位置 1（首个 draft 前向，不依赖前一 draft token）即掉 22.6 点，说明 drafter 输入/anchor 状态在 PP2 下错误或陈旧而非「后位衰减」。pos3 在 16.4% 样本（243/1478，TP8 对照 31/1233=2.5%）中恰为 0.000——非衰减曲线。数据取自 vLLM serve 端 SpecDecoding metrics 日志按作业窗口聚合，非客户端时延反推。根因未定位。
  source: https://github.com/vllm-project/vllm-ascend/issues/21077
  behavior: GLM-5.3-Flash 8 卡上用 MTP 投推解码：TP4×PP2 布局下开 3 个 speculative tokens 反而比 1 个更差——平均接受率掉到 36.7%，第三个位置的接受率在 16% 的采样窗口里干脆是 0。同样的模型、负载、配置换 TP8 布局就正常（65.3%）。输出内容不受污染，但投推完全白做还倒贴，吞吐显著受损；切换 TP8 可规避。

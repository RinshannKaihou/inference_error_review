original:
  mechanism: sglang v0.5.23-cu130（nightly-dev-cu13-20261028-586355a8 同样复现；v0.5.22-cu130 干净）+GLM-5.3-Flash w4afp8、TP4/H100、EAGLE num_steps=3/topk=1/draft_tokens=4、speculative_attention_mode=prefill、--max-mamba-cache-size 72、--mamba-radix-cache-strategy extra_buffer_lazy、fp8_e4m3 KV、dsa tilelang、hierarchical cache、chunked_prefill 8192、context_length 1048576：处理一个 ~1.04M token 请求（约 127 chunk）后引擎持续损坏——后续请求输出垃圾（空内容或单 token 重复）、MTP 接受率 0.00（正常 0.6-0.8）、json_schema 请求 HTTP 500（GrammarMatcher cannot accept special token id）。/flush_cache 无效，仅重启恢复。对照实验（同集群同晚）：v0.5.22 5/5 needle 检索、pod 健康；v0.5.23 长请求本身成功但 pod 中毒；nightly 长请求本身即 0/5 退化。短上下文行为正常，需要深 prefill 触发。嫌疑提交：#44098 从 KDA 状态池删 NextN 层（35→34 slot），前提是 draft 不读写 KDA 状态，但本部署 speculative_attention_mode=prefill 下 draft 会跑；报告者带两个与 mamba/KDA/draft 无关的小补丁，同补丁在 v0.5.22 正常。
  source: https://github.com/sgl-project/sglang/issues/48964
  behavior: sglang v0.5.23 服务处理一个约百万 token 的长请求后：之后的所有请求输出持续退化——内容为空或同一 token 重复到 max_tokens、MTP/EAGLE 接受率跌到 0.00、结构化输出请求直接 HTTP 500；flush_cache 无法恢复，只能重启进程。长请求本身在 v0.5.23 可能成功（5/5 needle）也可能在 nightly 上直接退化（0/5），短请求在其前一切正常。
  trigger_surface: sglang v0.5.23/nightly+GLM-5.3 类 mamba/KDA 混合模型+MTP（speculative_attention_mode=prefill）+~1M token 深度 chunked prefill；v0.5.22 干净
  discovery: 2026-11-06 每日扫描

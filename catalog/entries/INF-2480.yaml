original:
  mechanism: tt-metal ttnn.pad 在 HEIGHT_SHARDED ROW_MAJOR 张量上有三处缺陷（pad_device_operation.cpp:36-70 与 pad_rm_sharded_width_only_program_factory.cpp）：1) can_use_sharded_optimized_factory 只查 memory_layout 与宽度条件，从不检查 input_tensor.shard_spec() 与 output_mem_config.shard_spec() 的 core grid、orientation、shard_height(shape[0]) 是否一致；准入通过后 PadRmShardedWidthOnlyProgramFactory 只在每个输入核的 grid 内做本地 stick 拷贝，合法的重切分（reshard）pad 因此静默返回损坏数据；2) BFLOAT16 时对 uint16 栈变量做 *reinterpret_cast<uint32_t*> 4 字节读（2 字节栈越界读），UINT16 时 pad 值装进错误 16 位半区、width-only pad 恒补 0；3) 输出为 ND_SHARDED 时无 has_value 检查直接解引用 shape[1] 崩溃。
  source: https://github.com/tenstorrent/tt-metal/issues/64834
  behavior: 对高度分片张量调用 ttnn.pad 且输出分片规格（核网格/朝向/shard 高度）与输入不同这种完全合法的用法，输出数据静默损坏——因为优化工厂只在原核内拷贝、不做跨核搬运；UINT16 dtype 的宽度 pad 恒填 0 而不是给定 pad_value。均无报错；ND_SHARDED 输出则直接崩溃。
  trigger_surface: ttnn.pad + HEIGHT_SHARDED ROW_MAJOR 输入 + 分片输出（重切分场景触发静默损坏；BF16/UINT16 触发越界读/恒 0 pad；ND_SHARDED 输出触发崩溃）。
  discovery: 2026-11-09 每日扫描

title: NPU Inductor scan 族非最内维错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: NPUTritonKernel.scan 扫描轴
  behavior: NPUTritonKernel 继承上游 scan，按 ndim-num_reduction_dims 假定归约轴在 tile 末位；NPU 布局把归约树放在非最末维时仍扫 axis1。
effect:
  objects:
  - 数值结果
  detail: cummax/cummin/cumprod/logcumsumexp 沿 dim=0 生成错值（cummax max_abs_diff≈3.5，2D/3D/4D 均中），4D mid-dim 编译崩溃；最内维正确。
  visibility: 静默错误
mitigation:
  detect: 对 (4,4)、(2,3,4)、(2,3,4,5) 的每个 dim 与 eager 对拍；检查生成 kernel 的 tl.associative_scan 轴与归约树所在 tensor_dim 是否一致。
  fix: 'PR #49637（open）新增 NPUTritonKernel.scan，按归约树实际 tensor_dim 取扫描轴；4D mid-dim 编译崩溃另案跟踪，未修复。'

original:
  mechanism: CANN ops-math aclnnCumsum（A3 Ascend910_9362，CANN 9.3.0，master 84f3256f）在输入元素数 S>2^30 时静默返回恒等。实测 S=2^30 及以下正确（x[0]=1 其余 0 时 out 全 1.0）；S=2^30+1 与 2^30+65536 时 out==x（out[1]=0.0），GetWorkspaceSize 与执行均 rc=0、ws=16777728、输出非哨兵，说明 kernel 确实执行但块间 carry 未叠加。第二组构造（前三位 1,2,4）交叉验证：S=2^30 正确（1024,1026,1030），S=2^30+65536 恒等（1024,2,4）。9.2.0 与 9.3.0 逐值一致（非 9.3.0 回归）。报告者定位（未坐实）：arch35 cumsum_twoway_ss.h 两遍式实现中 mBlockPara.blockCount/blockFactor 为 32 位（:60/:73），「首元素正确、后续全 0」形态与 32 位自然截断一致，仓内无 1<<30 显式常量。自包含 ~110 行 C++ 两段式复现程序随 issue 附上。
  source: https://gitcode.com/cann/ops-math/issues/4574
  behavior: 对超过 2^30（约 10.7 亿）元素的一维 fp32 张量做 cumsum：接口不报错，返回码全 0，但输出就是输入本身——累加完全没做。比如 x[0]=1 其余为 0，期望全 1.0，实际只有 out[0]=1 其余全 0。下游拿到看似正常的张量继续算，前缀和语义的结果整体静默错误，比崩溃更难发现。
  trigger_surface: CANN 9.2.0/9.3.0（两者一致）；aclnnCumsum fp32 1 维 dim=0；元素数 > 2^30（约 4GiB fp32）；A3 910_9362 真机两段式直调复现。

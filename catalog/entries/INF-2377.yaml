  mechanism: aclnnForeachNorm（A3 910、CANN 9.2.0-beta.2、ops-nn@118c0c71，A2 910B3 交叉验证逐值一致）第二入参 scalar 是范数阶数 p，文档（foreach/foreach_norm/docs/aclnnForeachNorm.md A2/A3 段）给通用公式 y=(Σ|x|^p)^(1/p)，但实现只有 p∈{1,2} 两个分支：实测 p=1.5 输出与 p=1 完全相同（249.809）、p=3/2.5/0.5/±inf/nan 全部输出 L2 值 11.5266（期望分别为 4.23/6.30/124923/0.7448/0.25/未定义）；p=nan 返回有限值而 PyTorch 给 nan。关键反证排除硬件限制：同设备同输入 torch._foreach_norm 对全部 p 正确（x=[0.5,2.0,0.0,-0.5]，p=1.5 给 2.3208 而 aclnn 给 3.0=Σ|x|），torch.linalg.vector_norm(npu,1.5) 亦正确。自包含 C++ 两段直调复现完整（ret_gws=0/ret_exec=0）。输入 x=fp32[16x32] 全正无 inf/nan。
  source: https://gitcode.com/cann/ops-nn/issues/8012
  behavior: 调用 aclnnForeachNorm 且阶数 p 不是 1 或 2 时，返回值实际是 L1 或 L2 范数而非所请求的 p 阶范数，数值可差万倍（p=0.5 期望 124923 返回 11.53）；无报错。同机 torch 接口正确，仅 aclnn 直调/foreach 适配层错。
  trigger_surface: A3（910）/A2（910B3）；CANN 9.2.0-beta.2；aclnnForeachNorm p∉{1,2}。

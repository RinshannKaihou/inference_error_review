title: RoPEGrad mode=2 常量输入下 dcos 用错 x
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 位置编码
    stack: cann
    component: RoPEGrad kernel/ACLNN
  behavior: ACLNN 常量输入 + mode=2(QUARTER) + cos 全 broadcast 时，dcos 按 rotate(x) 而非原始 x 归约致符号反转；kernel 源码用 x，偏差在 ACLNN 常量输入路径。
effect:
  objects:
  - 梯度
  detail: dy=0.001、cos=1000 的三个常量用例只有 dcos 失败，MARE 恰为 2.0（相对误差 200%，即符号相反）；mode=0/1/3、随机输入、cos 部分 broadcast 均通过。
  visibility: 静默错误
mitigation:
  detect: mode=2 + 常量输入 + cos shape=(1,1,1,D) 全 broadcast 的 dcos 专项用例；同一用例走 GEIR 与 ACLNN 对比
  fix: 待定（报告建议修 ACLNN 常量输入优化路径或在 tiling 中禁用该路径；未核实是否修复）

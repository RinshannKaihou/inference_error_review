original:
  mechanism: 'CANN ops-transformer aclnnStemOamPrepPagedKv（master f5e07d37，CANN 9.3.0，Ascend950PR）：arch35 tiling_simd.cpp:355-356 只读取 kflatDim_=kFlatOutShape->GetDim(DIM_3)，不与 stemStride_*dimQk_ 比较；CheckParams()（:29-205）只校验输入形状不校验输出形状。kernel stem_oam_prep_paged_kv_simd.h:322-329 按调用方声明的 kflatDim 计算行偏移，CopyOut 每行一次写 stemStride*dimQk=2048 个 bf16；kflat_dim=1024 时行间 stride 与写入长度不匹配，最后一行越界；:341-349 的 vBias 写入（numStemBlocks 个 float）同样不校验 vBias 末维。真机复现（资料 L258 要求 kflat_dim=stemStride*D=2048）：传 1024 时两段 0/0/0，kFlat 尾部 4KB canary（预填 0xAB）2048/4096 被改写；对照 2048 时 canary 完好。资料 L241-263 规定参数不合法应返回 161002。与 #6814/#6812（INF-2214/INF-2213）同属 host/tiling 入参与输出校验缺失族，但本条是输出形状校验缺失且后果为越界写。'
  source: https://gitcode.com/cann/ops-transformer/issues/7089 关联 https://gitcode.com/cann/ops-transformer/issues/7085
  behavior: 调用 StemOamPrepPagedKv 时若 kFlat 末维传成小于 stemStride*D 的值（如 1024 对 2048），接口返回成功，但 kernel 每行仍按 2048 元素写入，越过输出缓冲区末尾踩坏相邻内存（实测 canary 2048/4096 字节被改写）；无报错，被踩内存的后续消费产生不可预测错误。
  trigger_surface: CANN 9.3.0 ops-transformer master f5e07d37；aclnnStemOamPrepPagedKv；kFlat 末维 != stemStride*D（vBias 末维同理）。

id: INF-2453
legacy_ids: []
slug: npu_triton_experimental_slice_scatter_out_of_slice_write
aliases: []
title: triton_experimental slice_scatter 改坏片外数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: slice_scatter 代码生成
  behavior: 融合的 masked load/select 形式在负偏移钳制后丢失未选中前缀，把 src 写入视图时误改切片之外的元素（x[1:5] 重复修改会把 x[0] 的 0.5 写成 0）。
effect:
  objects:
  - 数值结果
  detail: 最小复现：x=arange(8)+0.5、src=full(4,-3)、torch.slice_scatter(x,src,0,1,5) 经 torch.compile 后，切片外 x[0] 由 0.5 变 0；原输入被破坏、输出错误。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49255 （关联 issue 已 closed、PR 带 2026-11-07 完整验证，合入未核实）：先物化输入副本再向指定视图写入 src，保留切片外数据与原输入；正/负边界、步长、空切片、非连续输入及来源别名 2 项 NPU 测试通过。

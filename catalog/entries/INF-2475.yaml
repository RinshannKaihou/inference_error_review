  behavior: _npu_rewrite_rsplit_partial_body 只匹配扁平单层 r 循环锚点，promoted r-tree 嵌套双层零匹配被静默跳过，lo/hi 悬空，48 核各算全量再 combine 求和。
effect:
  objects:
  - 数值结果
  detail: 910B4 torch.compile 下归约轴含 dim0 且 ≥2 轴的多轴归约（如 x.sum(dim=[0,2,3])）结果为正确值的 48 倍，无异常无崩溃；换 batch/空间形状均复现，归约轴不含 dim0 则正确。

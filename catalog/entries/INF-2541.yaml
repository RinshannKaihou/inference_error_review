original:
  mechanism: vllm-ascend v0.30.0 起（#16996 on main、#18443 on release）默认开启 mm_device_do_normalize，把 Qwen3.5-VL 的 resize/patchify/rescale+normalize 从 CPU 下沉到 NPU worker。报告者在 950DT×8、TP=8、CANN 9.2.0、torch 2.10.0、torch_npu 2.10.0.post7、Qwen3.5-35B-A3B BF16、verl GRPO 下做三臂对照：A=main@15ec5601（CPU 预处理），B=v0.30.0（设备预处理），C=v0.30.0+--no-mm_device_do_normalize。三臂的 vllm core、CANN、torch、权重、数据、采样种子相同。Step-1（同一 θ0，纯数值）：logprob MAE 0.0138/0.0479/0.0143，prob diff 0.0055/0.0172/0.0057，pearson 0.9983/0.9799/0.9989，601 样本 greedy 准确率 0.6005/0.5720/0.6020。逐边界 dump 显示分歧在预处理带内产生：B 有 FusedInputNorm 边界（[288,1536] fp32 raw pixels → bf16 输出），A/C 没有；tokenization/embedding 逐位一致。首个 decode step 起采样 token 统计就不同。
  source: https://github.com/vllm-project/vllm-ascend/issues/21797
  behavior: 在 RL 训练回路里用 vLLM-Ascend 生成 rollout，再用训练侧 HF 处理器重算同一批 chosen token 的 logprob：两者平均差从 0.0138 涨到 0.0479、greedy 评测准确率掉约 3 个点，从第一步解码开始采样 token 就分叉；把预处理切回 CPU（--no-mm_device_do_normalize）后两个指标都回到基线，期间没有任何报错。
  trigger_surface: 'vllm-ascend v0.30.0（含 #18443）、Qwen3.5-35B-A3B BF16、950DT TP=8、CANN 9.2.0；mm_device_do_normalize 默认开启、图文混合 prompt。'
  discovery: 2026-11-13 每日扫描

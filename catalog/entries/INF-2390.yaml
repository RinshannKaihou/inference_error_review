legacy_ids: []
slug: rmsnorm_dynamic_mxquant_epsilon_double_narrowing
aliases: []
title: RmsNormDynamicMxQuant epsilon 静默归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: RmsNorm epsilon 属性窄化
  behavior: aclnn 接口把 epsilon 声明为 double，算子原型却登记为 Float 属性，进入 tiling/kernel 前被窄化成 fp32，小于 float 最小次正规的合法 double 静默变 0
effect:
  objects:
  - 数值结果
  detail: 全零 x 下 epsilon=1e-46（合法 double）时 rstd 返回 inf（期望约 1e23，在 fp32 值域内），y 输出 0；epsilon=1e-6 正常，同装置对照排除传参错误
  visibility: 静默错误
mitigation:
  detect: 全零 x + 极小 epsilon 对照 rstd 输出（1e-6 正常 / 1e-46 inf）
  fix: 待定（issue 2026-11-04 新开；建议 norm/ 下 .Float epsilon 类属性一并排查）

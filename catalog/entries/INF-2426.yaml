title: Inductor dynamic 归约长度固化首次值，输入变短后静默算错
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: NPUIndexTritonKernel 范围树
  behavior: initialize_range_tree 用首次编译的具体长度替换符号长度并写回 numels，随后固化进 kernel 调用参数，后续不同长度的输入仍按旧长度归约
effect:
  objects:
  - 数值结果
  detail: 910C 上 dynamic=True 编译 sum(dim=-1)，首输入 4096 后传 2048 得 8386560 而非 2096128（恰为 4096 之和），512 输入得 4208640，全程无异常
  visibility: 静默错误
mitigation:
  detect: 编译结果与 eager 逐输入长度对照可发现
  fix: 上游符号形状修复 commit 8695719 / v2.10 分支 9f2455f（910C 回归待完成，未核实发布）；现场以全局关闭 torch.compile 规避

  mechanism: ttnn.scale_causal_mask_hw_dims_softmax_in_place + SoftmaxShardedMultiCoreProgramConfig（is_scale_causal_mask_hw_dims_softmax 分支）：softmax_device_operation.cpp 校验布局/sharding/朝向/scale 但不查掩码宽高；softmax_program_factory_attention_optimized_sharded.cpp 以 num_tiles_in_attn_mask=mask_H*mask_W/tile_hw 计算每核游标 (start+block_h*block_w)%num_tiles_in_attn_mask；kernels/attention/dataflow/reader_unary_sharded_sm_causal_mask_hw_dims.cpp 仅在行尾以等值测试回绕（if(mask_id==mask_num_tiles) mask_id=0）。Case A：掩码窄于输入时越界读掩码、无回绕无报错（复现：输入 [1,1,64,128] height-sharded ROW_MAJOR、shard [64,128]、block_h=2/block_w=4 单核、掩码窄于输入）；Case B：错行掩码被应用。通用非分片 TILE 校验只要求掩码跨 ≥1 tile；#64681 修的是另一路径并明确不动 hw-dims。

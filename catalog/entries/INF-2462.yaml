cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Remainder floor 分支
  behavior: 实现把 fp32 商先舍入成整数再取 floor，真商贴近整数（相对差约 1e-7）时 floor 少取 1，余数由 other-ε 变约 0。
effect:
  objects:
  - 数值结果
  detail: Atlas A2（910B2）fp32 输入、self/other 真商贴近整数（如 -6.000000157）时，remainder 输出误差达 |other|（本例 0.379，即 100%），且接口全程返回成功，无任何告警。
  visibility: 静默错误
mitigation:
  detect: 用 IEEE-754 位型精确构造真商贴近整数的 self/other（如 0xC0118406/0x3EC2055D），比对 aclnn 输出与双精度公式 floor 期望。
  fix: 待定（issue open，未见修复；建议按资料公式以双精度计算商后取 floor）

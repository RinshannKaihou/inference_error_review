title: ScatterPaKvCache 超 2^32 元素 32 位写偏移回绕
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: ScatterPaKvCache 写偏移位宽
  behavior: SIMT 路径位宽选择只看输入元素数而非 cache 偏移上界，cache 超过 2^32 元素时整条写偏移链在 uint32 域计算回绕
effect:
  objects:
  - KV状态
  detail: cache 49.15 亿元素（>2^32）时合法 slot=76,799,999 两段返回 0 但目标位置一个字节未写，写入回绕落到 cache 中部约第 75760 block，静默覆盖其他 block
  visibility: 静默错误
mitigation:
  detect: 对照写后读回目标 slot（对照 NB=1024 正常、NB=600000 未写）
  fix: 待定（issue 2026-11-04 新开，未见修复）

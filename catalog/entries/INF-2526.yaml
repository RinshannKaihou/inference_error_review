original:
  mechanism: 'cann/ops-nn FastHadamardQuant（commit ae873b119fb5499c41a6893f920171551fb0a197）的 host 侧 GroupStride 把首维等于 batch 的二维张量按 [batch, groups] 处理（fast_hadamard_quant.cpp 约 221-231 行），Host 接受 group_size 后计算 groupsPerRow = n / groupSize，却没有核对 scale/offset 张量的 rank、组数和 batch 维（约 256-275 行）；device 函数 ApplyGroupedQuant 以 groupsPerRow 循环，并读取 scales[(scale_stride == 0) ? g : row_index * scale_stride + g]（约 79-99 行），offsets 使用同一索引策略。最小问题输入：x FP16/连续 [1,128]、group_scales FP16/连续 [1,1]、group_size=64、out INT8/连续 [1,64]；groupsPerRow=2，二维 scale 因首维等于 batch 被设为逐行 stride 2，kernel 对该行读取索引 0 和 1，而输入只分配了 1 个 scale，第二次读取越界。修复 PR !14357 在 kernel launch 前校验可选 group tensor 的 NPU 设备与 x 一致、FP16 dtype、连续布局、rank 为 1 或 2，并核对最后一维等于 groupsPerRow；二维输入还要求首维等于展平后的 batch。README 同步说明约束，回归覆盖错误组数、错误 batch、dtype、设备和连续性，保留合法 [batch, groups] 正向用例。'
  source: https://gitcode.com/cann/ops-nn/issues/8738 ｜修复 https://gitcode.com/cann/ops-nn/merge_requests/14357
  behavior: 对 FastHadamardQuant 传显式 group_size 但分组 scale/offset 的组数比 n/group_size 少时（例如 x 最后一维 128、group_size=64 却只给 1 个 scale），接口不报错，kernel 会按两组去读越界的第二个 scale，量化输出用了缓冲区外的值；结果看起来仍是合法 INT8，只有和 CPU 参考对比或 mssanitizer 才暴露。
  trigger_surface: cann/ops-nn FastHadamardQuant；显式 group_size 与 group_scales/group_offsets 组数或 batch 维不一致；FP16 输入、INT8 输出；NPU 连续布局。

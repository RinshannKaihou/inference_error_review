  detail: x fp16[1,128]、group_scales [1,1]、group_size=64 时 groupsPerRow=2，kernel 读 scales[1] 越界；量化输出用越界 scale，无报错。!14357 增加 rank/组数/batch/dtype/连续性校验。
  visibility: 静默错误
mitigation:
  detect: group_size 与 group_scales/offsets 的组数不匹配（如 x [1,128]、scales [1,1]、group_size=64）时调用，检查是否拒绝；mssanitizer 观察 device 越界读。
  fix: 修复 PR !14357（open，未发布）：kernel launch 前校验 group tensor 设备/dtype/连续/rank 与最后一维==groupsPerRow，二维首维==展平 batch。

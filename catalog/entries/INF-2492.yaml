original:
  mechanism: '环境：vllm-ascend 0.30.0rc2 / torch_npu 2.10.0.post7 / CANN 9.2.0 / Ascend 910B(HC) 单卡 64GB，openEuler 24.04 aarch64。模型 Qwen3.6-35B-A3B（architectures=Qwen3_5MoeForConditionalGeneration，model_type=qwen3_5_moe），checkpoint 为 compressed-tensors W8A8（权重 int8 per-channel、激活 int8 per-token 动态）。最小复现：13 token 纯文本 prompt（无多模态、prefix cache 关、MM cache 关、enforce_eager=True、TP=1、temperature=0、max_tokens=64）输出完全乱码；同 checkpoint/tokenizer/prompt/脚本在 vllm-ascend 0.18 输出正常；TP=2 多图推理同样乱码；带/不带 think 段均失败。tokenizer 文件与 FP checkpoint md5 一致（排除 tokenizer 因素）。0.30 日志关键行：Using the vLLM Ascend llmcompressor Quantization now! / Enabled custom fusions: norm_quant, act_quant / Using LBNHC KV cache layout / block_size=1056（0.18 为 2048）。根因未定位：候选面为 0.30 新增 llmcompressor W8A8 量化路径（norm_quant/act_quant 自定义融合）与 LBNHC KV 布局，均未证实；issue open，无维护者结论。'
  source: https://github.com/vllm-project/vllm-ascend/issues/21462
  behavior: 用 vllm-ascend 0.30.0rc2 在 910B 上对 Qwen3.6-35B-A3B 的 W8A8 量化 checkpoint 做推理（离线 LLM.generate 或 serving）时，即使最简单的 13 token 中文 prompt、贪心解码、eager 模式、单卡，输出也是完全不可读的乱码（中英混杂、重复片段、UNK）；换 vllm-ascend 0.18 后同一份权重、同一 tokenizer、同一脚本立即恢复正常中文。TP=2 与多图输入同样乱码，说明与并行度和多模态无关。
  trigger_surface: vllm-ascend 0.30.0rc2（910B、CANN 9.2.0）+ Qwen3.5-MoE 架构的 compressed-tensors W8A8 checkpoint；enforce_eager 亦触发；prefix cache/多模态已排除。

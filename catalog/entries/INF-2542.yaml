    component: FP8 indexer 分数累加
  behavior: arch35 单行路径分别累加偶数/奇数 head 再相加，双行路径按 head 顺序逐项累加；FP32 舍入差异改变 BF16 排序分数，TopK 集合随 query 长度变化。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: Q 长度 314 时倒数第二行选中索引 2047，5688 时改选 2048；四种长度因果可见范围相同但 TopK 不同，GLM-5.3 完整/分块 prefill 差异可传播到生成 token。
  visibility: 静默错误
mitigation:
  detect: 同一 Q/K/权重/因果范围，用 Q 长度 2/64/314/5688 分别跑，比较倒数第二行 TopK 集合是否恒含 2047 且排除 2048。
  fix: PR !15878（open）统一累加顺序；修复版四种 Q 长度均通过，原版在 5688 时回归失败。

  mechanism: CANN ops-nn aclnnAntiMxQuant（Ascend950PR_9579 A5，CANN 9.3.0 B020 libopapi 2026-10-28 构建，源码 9.3.0-beta.1 @99a37ee3）。根因（行号实测）：quant/anti_mx_quant/op_api/aclnn_anti_mx_quant.cpp 的 CheckShape（:68 起）只取 mxscaleDimNum 做维数比较（:86，要求=x 维数+1），不校验各维 size，mxscale=[1,1,0]「维数对但含 0 维」被放行；:150 的 if (x->IsEmpty() || mxscale->IsEmpty()) 把 mxscale 含 0 维当作空走早退，第二段不再启动（ws=0），y 保持未写。基线 mxscale=[1,1,2]：rc 0/0、ws=512、y 4/4 写入；变异仅第三维 2→0：rc 0/0、ws=0、y 0/4（金丝雀 0x7E01 原样）。sweep-example（device5）与自写探针（device6，三阶段 hex）两路一致。与既往空态缺陷（#8108 RmsNormDynamicMxQuant 主输入空绕过校验、#8109/#8119）触发面不同：本条主输入 x 与输出 y 都非空，唯一变化是辅输入 mxscale 含 0 维。
  source: https://gitcode.com/cann/ops-nn/issues/8232
  behavior: MX 格式反量化算子：主输入和输出都非空、完全正常，只要辅助输入 mxscale 的形状里混进一个 0 维（如 [1,1,0]），算子就把它当「空输入」提前返回成功——输出一个字节都不写，读回是未初始化显存。调用方拿到 SUCCESS 和垃圾数据，无任何告警。与之前收过的「主输入为空」类缺陷不是同一个触发面。
  trigger_surface: CANN 9.3.0（B020/beta.1）；aclnnAntiMxQuant；辅输入 mxscale 含 0 维（主输入/输出均非空）；A5 950PR 双设备独立复现。

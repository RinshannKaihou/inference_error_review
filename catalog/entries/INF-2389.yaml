original:
  mechanism: CANN ops-nn aclnnIndexAddV2（master 0fc301c67，CANN 9.3.0，Ascend950PR）：index=int64[0]、source=fp32[0,3] 是满足资料「index 的 shape 大小与 source 在 dim 维上的 shape 相等」的合法退化输入。aclnn_index_add_v2.cpp 的 UnDeterministicImpl（约 170-213 行）分 mode==0 走 l0op::InplaceScatterAddAiCore 与 mode!=0 走 l0op::InplaceIndexAddAiCpu 两条路径，均无「index 为空 → self 拷到 out / 早退写输出」处理。真机 NPU 2 复现：dim=0/-1、fp32/fp16、mode=0/1 四组合下两段 rc=0、out 48/48 字节保持 0xA5 哨兵；V1 aclnnIndexAdd 同输入输出正确（out=self）。报告者按 P0 处理建议：调用方拿到成功码但 out 是脏内存，反向/优化器链路会直接污染梯度或权重更新，结果不可复现（依赖分配器残留）。
  source: https://gitcode.com/cann/ops-nn/issues/8102
  behavior: 调用 IndexAddV2 传空 index（合法退化输入）时返回码全 0 表示成功，但输出张量一个字节都没写，读回的是申请时的未初始化内存或预填值；同一输入换 V1 接口结果正确。下游若信任返回码会把脏数据当计算结果，且每次运行内容随内存残留变化。
  trigger_surface: CANN 9.3.0 ops-nn master 0fc301c67；aclnnIndexAddV2；index 长度 0（source dim 维同为 0）；fp32/fp16、mode 0/1、dim 0/-1 均触发。
  discovery: 2026-11-04 每日扫描

title: IndexAddV2 空 index 返回成功但输出未写入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: IndexAddV2 空 index 分支缺失
  behavior: index 长度 0（source 在 dim 维同 0，满足资料约束）时两条实现路径都没有把 self 拷到 out 或早退写输出，两段接口返回 0 但 out 完全未写
effect:
  objects:
  - 数值结果
  detail: out 保持调用方预填的 0xA5 哨兵 48/48 字节未变，读回未初始化脏数据；V1 接口 aclnnIndexAdd 同输入输出正确等于 self，四种 dtype/mode/dim 组合均复现
  visibility: 静默错误
mitigation:
  detect: 空 index + out 预填哨兵的写回检查（V1 对照正确）
  fix: 待定（issue 2026-11-04 新开；相关 ops-nn#8069 覆盖 IndexAdd 族值域校验但未含本条空 index 输出未写）

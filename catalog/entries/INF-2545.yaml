id: INF-2545
legacy_ids: []
slug: aclrt_stream_query_premature_complete
aliases: []
title: aclrtStreamQuery 提前返回 COMPLETE
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: Stream::Query Stars 分支
  behavior: 910B 的 Stars 分支只比较 SQ head/tail，sqHead==sqTail 即返回 COMPLETE；任务入队置位是同步的、推进 SQ 由发送线程异步完成，窗口内 SQ 为空被误判完成。
effect:
  objects:
  - 数值结果
  detail: 下发 2GB D2D 后 6µs 查询即返回 COMPLETE，紧接 SynchronizeStream 阻塞约 28.8ms，20/20 命中；按 COMPLETE 复用 buffer 会读到 DMA 未写完的数据。
  visibility: 静默错误
mitigation:
  detect: aclrtMemcpyAsync 2GB D2D 后立即 aclrtStreamQuery，同时记录 aclrtSynchronizeStream 耗时；查询 COMPLETE 而同步仍阻塞 >1ms 即命中。
  fix: 未核实修复 PR；报告给出修复建议（sqHead==sqTail 时再比较 lastTaskId_ 与已发送/已回收任务 id，或有未完成任务则返回 RT_ERROR_STREAM_NOT_COMPLETE）。规避：不要用 aclrtStreamQuery 判完成。

original:
  mechanism: NPU 上对 bool 张量的 torch.add 走算术 aclnn add 内核，把整数和直接写入 bool 字节：True+True 的和为 2（非零字节），而 CPU 参考实现定义 bool 加法为逻辑或（True+True==True，非零即 True 且值为 1）。广播、标量、add_、alpha 各形态均受影响。复现：torch.add(tensor([True]),tensor([True])).to(torch.int64) 在 NPU 为 2、CPU 为 1；(5,1)+(5,) 广播加法（OpInfo test_comprehensive___radd___npu_bool 样本 2）eager 结果与 CPU 参考失配（25 元素中 12 个失配、最大差 1）。该 eager 侧错误还使 inductor 测试 test_torchinductor_opinfo.py::TestInductorOpInfoNPU::test_comprehensive___radd___npu_bool 样本 2 失败（编译输出正确、eager 参考侧错误）。修复方向：bool 的 add 各形态路由到逻辑内核 aclnnLogicalOr/aclnnInplaceLogicalOr 与 CPU 语义对齐。环境：torch_npu master、op-plugin master 3dbf199a、CANN 9.2.0-beta.2。
  source: GitCode issue https://gitcode.com/Ascend/op-plugin/issues/691 （open）；修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/6187 （open）
  behavior: 在 NPU 上对 bool 张量做加法（torch.add、+ 运算符、add_、含 alpha/广播/标量）结果语义错误且无报错：True+True 的底层字节为 2，转成 int64 看到 2 而不是 CPU 的 1；形状 (5,1)+(5,) 的 bool 广播加法 25 个元素中 12 个与 CPU 参考失配，最大差 1。所有把 bool 加法当逻辑或用的下游（掩码合成、条件归约、sum 后处理）在 NPU eager 路径上数值全偏，只有与 CPU 逐位对拍才能发现。
  trigger_surface: torch_npu master + op-plugin master（3dbf199a）+ CANN 9.2.0-beta.2 上任何 eager bool 张量 add/+=/广播/标量/alpha 形态；编译路径输出正确、eager 参考侧错误。
  discovery: 2026-11-07 每日扫描

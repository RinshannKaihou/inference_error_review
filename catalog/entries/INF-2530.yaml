title: FlashInfer JIT silu_and_mul 忽略行 stride
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: JIT silu_and_mul
  behavior: JIT C++ activation 只校验末维为偶数和输出 shape，不校验输入/输出 stride；kernel 用 token_idx*2*d 与 token_idx*d 线性寻址，行带空洞时读写错位。
effect:
  objects:
  - 数值结果
  detail: 行 stride 视图中 last dim 仍连续故 wrapper 接受；输出按连续行起点写，读回错位并可能改到逻辑 view 外 padding；连续对照全部通过，非连续全部错。
  visibility: 静默错误
mitigation:
  detect: 构造最后一维连续但行 stride 带空洞的输入/输出视图，与连续基线逐元素对拍；连续对照必须通过以排除数据巧合。
  fix: '待定（issue #9396 open；期望正确支持输入/输出 stride 或入口显式拒绝非连续布局）。'

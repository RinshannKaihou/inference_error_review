original:
  mechanism: 'flashinfer issue #9396（flashinfer 0.7.4、commit 77039051b0be921788dc2784ec41423b558878ec、RTX 4070 Laptop SM89、CUDA 13.3）：flashinfer.activation.silu_and_mul 的公共 JIT C++ 路径（区别于 flashinfer.triton.activation）在 Python wrapper 只校验最后一维为偶数和输出 shape，不校验输入/输出 stride；生成的 JIT kernel 使用线性寻址：输入行起点 token_idx*2*d、up 半区起点 token_idx*2*d+d、输出行起点 token_idx*d。docstring 只写输入 shape (..., 2*hidden_size) 与输出 shape，未声明必须连续。对于最后一维仍连续、但行 stride 带空洞的 view，wrapper 接受张量，kernel 却按连续行起点读写：输出写会落到 backing storage 的逻辑 view 之外 padding 区域。复现用 H=1024、rows=4 的行 stride 视图，连续对照全部正确、非连续全部错位；环境为本地 venv，作者未在干净上游环境复现。期望：支持 stride 时按 stride 寻址，否则入口拒绝非连续布局，不能静默出错或写逻辑 view 外。'
  source: https://github.com/flashinfer-ai/flashinfer/issues/9396
  behavior: 推理代码把 silu_and_mul 的输入或输出做成带行 stride 的视图（例如从更大的 fused buffer 里切一段、或输出写进 padded 缓冲）时，wrapper 接受调用且不报错，但 kernel 按连续行起点读写：输出值错位、部分位置没写，甚至改到逻辑 view 外的 padding；连续张量完全正常。
  trigger_surface: flashinfer.activation.silu_and_mul（JIT C++ 路径）；输入或输出最后一维连续但行 stride 带空洞；flashinfer 0.7.4、SM89/CUDA 13.3。
  discovery: 2026-11-13 每日扫描

cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: SwigluGroupQuantGrad 流水
  behavior: CopyOutGradX 搬出后未发 MTE3→MTE2 同步，下一轮 CopyInX 直接把新输入搬进同一 UB 地址；队列的 FreeTensor/AllocTensor 只是软件生命周期，不构成流水间 happens-before。
effect:
  objects:
  - 梯度
  detail: racecheck 在 float16 高性能模板报 2 条 UB WAR（WAR()+0x4000/0x6000：读 466/467 行、写 156/158 行）；补同步后 racecheck 无告警、样例运行正常。

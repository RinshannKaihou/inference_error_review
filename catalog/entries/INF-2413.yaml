title: triton-ascend argmin/argmax 索引通道静默损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: with_index 索引通道 lowering
  behavior: minimum_with_index/maximum_with_index 的 helper lowering 损坏索引传播：kernel 文本语义正确，但多块 argmax 恒返回初始累加器索引 0，argmin 返回非极值索引
effect:
  objects:
  - 数值结果
  detail: fp16/bf16 argmin/argmax 经 torch.compile+triton_experimental 返回错误索引：argmax 恒返 0，argmin 返 19/37/10/3 等非极值索引；极值正确、无报错，确定性复现；torch_npu 默认排除兜底，需手动加回注册清单
  visibility: 静默错误
mitigation:
  detect: compiled 与 eager 输出索引比对（极值相同、索引不同即中招）；12 配置矩阵见 issue
  fix: torch_npu 已把 argmax/argmin 移出 triton 注册清单走 extern aclnn 兜底（线上业务暂不受影响，代价是低精度归约无法走 triton codegen）

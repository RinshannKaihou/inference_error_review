title: ChunkCat 空输入早退跳过 out 校验返回脏数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: ChunkCat 空输入早退次序
  behavior: 空 tensorList 与全空 tensor 两条早退路径排在参数校验之前，既不校验 out 空指针/shape 也不写任何数据，直接返回成功
effect:
  objects:
  - 数值结果
  detail: out 预填 qNaN 在空列表/全空输入下 12/12 全部残留，调用方拿到返回码 0 但 out 是未初始化内容；161001/161002 两类参数错误在空态全部失效
  visibility: 静默错误
mitigation:
  detect: 空输入 + out 预填哨兵的写回检查

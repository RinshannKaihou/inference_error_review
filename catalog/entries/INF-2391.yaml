original:
  mechanism: CANN ops-math aclnnChunkCat（master 2026-11-04 拉取，CANN 9.3.0，Ascend 950PR）：aclnn_chunk_cat.cpp:235-238 在 tensors->Size()==0 时于 CheckParams（:240，含 out 非空与 dtype/format/rank 校验）之前直接 return ACLNN_SUCCESS；tensorList 全空 tensor 时 :207-208 在 CheckShapeAndScalarSame（:210）之前 return ACLNN_SUCCESS。两条路径不校验 out 空指针（资料 161001）也不校验 out shape 与期望输出 [numChunks, 0] 一致（资料 161002），且不写出任何数据。真机复现：空 tensorList + out fp32[2,6] 预填 qNaN → 两段 0/0，out 12/12 NaN 残留；tensors=[fp32[0,6]] 同样；out 传 nullptr 也返回 0。期望输出 shape 由 infershape 决定，空输入时为 [numChunks, 0]。
  source: https://gitcode.com/cann/ops-math/issues/4460
  behavior: 调用 ChunkCat 传空输入列表（或全空 tensor）时接口返回 0 表示成功，但输出张量保持申请时的未初始化内容（预填 NaN 全残留），非法 out（空指针、shape 不符）也不再被拦截；下游把脏数据当拼接结果使用，每次内容随内存残留不同。
  trigger_surface: CANN 9.3.0 ops-math master（2026-11-04）；aclnnChunkCat；空 tensorList 或全空 tensor 输入。
  discovery: 2026-11-04 每日扫描

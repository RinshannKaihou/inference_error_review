id: INF-2511
legacy_ids: []
slug: inductor_erf_dtype_roundtrip
aliases: []
title: NPU erf 分解 dtype 回转破坏提升契约
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: aten.erf 自定义分解
  behavior: aten.erf 的 NPU 自定义分解对非 fp32 输入先升 fp32 计算再回转 orig_dtype：bool/int64 的 INT_TO_FLOAT 提升结果被强行转回整型，破坏输出 dtype 契约。
effect:
  objects:
  - 数值结果
  detail: torch.compile 路径 erf(bool/int64) 返回原 dtype 而非提升的 float32（eager NPU/CPU 与 meta 均 float32），bool 结果被压回 0/1 语义；TestInductorOpInfoNPU 两例 dtype 断言失败。
  visibility: 静默错误
mitigation:
  detect: 对编译前后输出 dtype 做断言（torch.compile(torch.erf)(x).dtype vs eager）即可稳定区分。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49444（keep aten.erf output dtype for bool/integral inputs，open 未发布）；边界：eager aclnnErf 不支持 DT_INT32（161002，支持列表无 INT32）与 fp64 设备能力为独立问题不在本缺陷范围。

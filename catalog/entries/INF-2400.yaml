title: ttnn.permute 2^32 tile 填充体积 uint32 溢出全错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: permute 分块体积 uint32
  behavior: MultiCoreTiledGeneric 工厂以 uint32_t 累乘 tile 填充体积 padded_xw_volume 并除以 tile 面积得 xw_blocks，达到 2^32 时回绕为 0，后续任务切分全错
effect:
  objects:
  - 数值结果
  detail: n=2047（填充体积 0.999*2^32）位级正确；n=2048（恰好 2^32）20971520/20971520 元素全错且非有限值为 0（静默垃圾值），输入仅 21M 元素、只有 tile 填充输出达到 2^32
  visibility: 静默错误
mitigation:
  detect: n=2047/2048 边界对照（位级正确 vs 全错）
  fix: 待定（issue 2026-11-03 报告，main 上源码未变，未见修复 PR）

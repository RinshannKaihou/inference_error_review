original:
  mechanism: tt-metal ttnn.permute（ttnn 0.81.1，Blackhole P150）TILE 布局同时移动两个 tile 维（MultiCoreTiledGeneric program factory）时，permute_tiled_program_factory.cpp（v0.81.1 L665-673，main 2026-11-02 L667-675 未变）以 uint32_t 累乘 padded_xw_volume=X_p*W_p*input_shape[i] 再除以 tile_shape[0]*tile_shape[1] 得 xw_blocks，积达 2^32 回绕为 0，split_work_to_cor 据此切分全错。确定性复现：permute(n,5,n,1) dims=[2,0,3,1] 输出 (n,n,1,5) tile 填充为 (n,n,32,32)；n=2047（4,290,774,016=0.999*2^32）mismatched 0/20,951,045 位级正确；n=2048（4,294,967,296=2^32）mismatched 20,971,520/20,971,520 全错、non-finite 0（垃圾值非 NaN）。无错误无警告，always 确定性触发。输入仅 21M 元素（84MB fp32），只有 tile 填充体积越过阈值。
  source: https://github.com/tenstorrent/tt-metal/issues/63940
  behavior: 在 Blackhole 上对约 2^32 tile 填充元素量级（如 n=2048 的 4 维 permute）调用 ttnn.permute，输出全部元素为错误值（垃圾数据而非 NaN），无任何报错或警告；略低于阈值（n=2047）位级正确。大张量数据搬运结果静默全错，下游计算随之污染。
  trigger_surface: ttnn 0.81.1（main 同）；Blackhole P150；TILE 布局 permute 且 tile 填充体积 ≥ 2^32（约 n≥2048 的 4 维场景）。
  discovery: 2026-11-04 每日扫描

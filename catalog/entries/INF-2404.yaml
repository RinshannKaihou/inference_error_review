title: PoolKeyIndexer 段内行基址 uint32 回绕双端损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: PoolKeyIndexer 行基址位宽
  behavior: indices 输出段内行基址按 uint32 计算，当 (S1-1)×W ≥ 2^32（W=topk+pool_size-1）且 pool_size≥2 时回绕，高段行写入翻转到低段并错位覆写低段行
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 段内行基址≥2^32 且 pool_size≥2 时，indices 高段行整段未写（最高 18.23% 元素缺失）、低段行被错位覆写（31.15% 行损坏，损坏行数=2U+1）；算子返回成功、无运行时报错，下游按索引读 KV 池取到错位或垃圾数据，精度比对整批 FAIL
  visibility: 静默错误

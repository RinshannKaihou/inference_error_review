id: INF-2533
legacy_ids: []
slug: vllm_tower_lora_multiple_encoder_calls_mapping_reuse
aliases: []
title: Tower LoRA 单步多次编码复用映射错配
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: tower/connector LoRA 映射
  behavior: set_active_mm_loras 每步只建一份按模态排序的映射；每个 LoRA kernel 都从 index 0 读 mapping[:token_nums]，单步多次 encoder 调用时拿错 adapter 或越界索引。
effect:
  objects:
  - 隐状态
  - 输出内容
  detail: Qwen2.5-VL-3B image+video 同批：第 2 次调用 token_nums=9072 读 mapping[:9072]，前 988 行仍是 image adapter、sorted index 越界 → illegal access 或静默用错 adapter；单模态正常。
  visibility: 静默错误
mitigation:
  detect: 同一 engine step 提交 image+video（或模型内部多次 encoder 调用）并开 tower/connector LoRA，检查第二次 encoder 的 adapter 映射与 sorted index 是否越界；单模态同请求作对照。
  fix: '待定（issue #67313 open；未见修复 PR，期望按 encoder 调用偏移切片映射或在每次调用前重建）。'
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-13'
remarks: 与 INF-2500 共享 tower/connector LoRA 映射与编码器实际消费行不一致的失效面；INF-2500 是不等长 clip 的 padding stride 覆盖差，本条是单步多次 encoder 调用都从 mapping 起点读取。

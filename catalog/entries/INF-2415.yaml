original:
  mechanism: 'CANN ops-nn aclnnQuantMax：x 为空 Tensor（合法退化输入）时接口走空态早退，GetWorkspaceSize 与执行均返回 0、workspaceSize=0；但 amax 输出形状恒为 [1]（单个标量元素，非空），整块不写——调用方拿到 SUCCESS 与未初始化显存。issue 报告含触发矩阵与金丝雀验证（标题明确「静默脏数据」）。与既往已收「空 index/空输入 out 未写」族（INF-2389 IndexAddV2、ops-math#4460 ChunkCat 等）同型但对象不同：本条 amax 恒为 [1] 形状输出，空输入语义下应写出确定值（如 0）或返回 161002，而非 SUCCESS+未写。详细正文见批次缓存 issue #8249。'
  source: https://gitcode.com/cann/ops-nn/issues/8249
  behavior: 动态量化链路里求最大绝对值的算子：输入批次为空（如全过滤掉的 token 组）时接口返回成功，但那个恒定为 [1] 形状的 amax 输出标量一个字都没写——读回的是显存里的旧值。下游拿这个垃圾数去算量化 scale，整批量化结果静默错误。空批次在真实服务里并不罕见（全被过滤器拦掉的请求组）。
  trigger_surface: CANN ops-nn aclnnQuantMax；x 为空 Tensor（输出 amax 恒 [1] 非空）；触发与 dtype/格式无关（按 issue 报告）。

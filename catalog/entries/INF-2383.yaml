    component: wake_up 无 tag 立即恢复调度
  behavior: POST /wake_up 不带 tags 时立即恢复调度，睡眠期间排队的请求在 reload_weights 恢复被丢弃权重之前执行，用丢弃的权重算出与 prompt 无关的输出并 HTTP 200 返回
effect:

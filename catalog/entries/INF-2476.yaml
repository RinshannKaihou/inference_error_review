  discovered: '2026-11-09'
remarks: ''
evidence:
- url: https://github.com/triton-lang/triton-ascend/issues/3043
  kind: github_issue
relations: []
original:
  mechanism: triton-ascend 3.6.0（Ascend 910_9382/A3、CANN 9.2.0；main 截至 2026-11-09 同样存在）：地址由整数除法派生的 tl.load（rows = start + offs // W）被下发射成 scf.for 内无谓词标量 memref.load，掩码只以尾部 arith.select 存活——掩码外 lane 仍发起 GM 事务。定位：third_party/ascend/lib/TritonMemoryAccess/MaskAnalysis.cpp 的 MaskState::parseDiv 是硬编码 return failure()（注释 temporarily disable parseDiv），DiscreteMaskAccessConversion 因此不做谓词化；enable_mask_fallback_conversion 被忽略/强制 False，无安全回退。#2332 的修复只覆盖仿射前缀掩码，本形态是残余。带最小复现（plain 版安全降级为有界 memref.copy，div 版崩溃）与 IR 对比。
  source: https://github.com/triton-lang/triton-ascend/issues/3043
  behavior: 任何用除法派生行号、靠 mask 防越界的 gather/shape kernel（如 vLLM 序列并行行 gather、padded 窗口）在 NPU 上会真实读取掩码外内存：num_tokens % tp_size != 0 时最后 rank 越界读至多 9KB；读到已映射页时无任何现象，落在未映射页则设备报 vector core exception（507035）、进程死亡。掩码形同虚设，kernel 必须自行把地址 clamp 进缓冲区。
  trigger_surface: triton-ascend 3.6.0（main 仍在）+ 掩码谓词除法派生索引（offs//W、offs//BLOCK 等）的 tl.load；与缓冲区尾部的相对位置决定崩或静默。
  discovery: 2026-11-09 每日扫描

id: INF-2476
legacy_ids: []
slug: triton_ascend_parseDiv_mask_unpredicated
aliases: []
title: 除法索引掩码不谓词化掩码外越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 掩码谓词化（MaskAnalysis）
  behavior: MaskState::parseDiv 硬编码 return failure()，除法派生索引的掩码无法转访问范围，load 下发射成无谓词标量 memref.load，掩码仅剩尾部 select，掩码外 lane 仍访存。
effect:
  objects:
  - 可用性/进度
  - 跨请求/跨样本数据
  detail: 生产 vLLM 行 gather kernel（rows=token_start+offsets//WIDTH）：掩码外 lane 仍发 GM 事务，TP 不整除时尾部越界读至多 9KB；落在未映射页即 vector core exception 507035 杀进程。
  visibility: 报错
mitigation:
  detect: 待定
  fix: 社区规避：把索引 clamp 在缓冲区内；修复建议（实现 parseDiv 或对不可证 mask 加 scf.if 守卫）未实施，https://github.com/triton-lang/triton-ascend/issues/3043。
labels:
  stage: N/A

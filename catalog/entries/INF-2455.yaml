    component: Humming fused E8M0 重编码
  behavior: SM90 Humming MXFP4 以 FP8 激活开 fused E8M0 路径，code 钳到 [max-11,max] 并重编码 E2M1：距最大 scale 12-15 binade 块粗化，≥16 binade 解码为 0。

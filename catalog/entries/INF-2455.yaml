  - 模型权重
  - 输出内容
  detail: 无错误无警告： fused 投影邻接小 scale 部件被 qkv/gate_up 最大 scale 窗口化，N padding 行 E8M0=1.0 抬高窗口顶；Marlin 同层精确解码。层输出偏离 checkpoint 意图，精度损失取决于权重动态范围。
  visibility: 静默错误

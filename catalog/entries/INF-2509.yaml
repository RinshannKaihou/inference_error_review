original:
  mechanism: vllm-ascend M-RoPE + PCP（prefill context parallel，ModelRunner V2）：PCP 把长 prefill 请求拆到多个 rank，RopeState.prepare_positions() 的 1:1 rank 本地行→全局请求映射假设被破坏——请求碎片化为非连续 rank 本地片段、位置跨 rank 可非单调，原路径从错误全局偏移重建 M-RoPE 3D（T/H/W）位置，图像输入的空间 H/W 坐标与所索引视觉 token 错位。受影响类：use_mrope 且 prefill_context_parallel_size>1 的全部模型（Qwen2-VL/Qwen2.5-VL 原生 M-RoPE、Qwen3-VL（本 PR 验证目标）、GLM-4.6V、MiniCPM-V-4.7 canvas 变体及一切声明 SupportsMRoPE 走到 PCP prefill 的模型）。修复：prepare_positions_pcp() 按片段实际全局 start/length 逐区间切片全局 prefill_positions 表（[3,total_prefill_len]），decode 用 1D scheduled positions+prefill_delta 广播到 3 维；仅 prefill_context_parallel_size>1 且 use_mrope 时走新路径。证据：Qwen3-VL-8B-Instruct、MMMU、输出长度 8192、2×Atlas A3：TP2=58、PCP2+修复=58.2、PCP2 无修复≈34.33。
  source: https://github.com/vllm-project/vllm-ascend/pull/21551 （Bugfix PR，附 A/B 精度证据；PR closed 未合入）
  behavior: 多模态 M-RoPE 模型开 prefill context parallel（PCP2）后精度大幅下滑：Qwen3-VL-8B 在 MMMU 上从 TP2 基线 58 掉到约 34.33（相对跌约四成），图像 token 的行列位置与实际像素错位；换回 TP 或打上位置准备修复即恢复到 58.2，与基线持平。服务全程无报错。
  trigger_surface: M-RoPE 模型 + ModelRunner V2 + prefill_context_parallel_size>1（PCP）；非 M-RoPE 模型或非 PCP 路径不受影响。
  discovery: 2026-11-11 每日扫描

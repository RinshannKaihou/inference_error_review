cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: gather_v3 host 校验缺失
  behavior: gather_v3.cpp host 侧只校验 dtype/shape 不校验 index 取值范围；kernel 内 CheckIdxValue 的 assert 在生产版本被编译掉，越界 index 不报 161002，静默返回错误值。
effect:
  objects:
  - 数值结果
  detail: self=[100,200,300,400]、dim=0 时 index=4 返回 100（读到第 0 个元素）、index=99 返回 0.0；GetWorkspaceSize 与执行均返回 0 无告警；文档明确 index 不支持越界应报错；错误值向下游传播。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（建议 CheckIdxValue 由 assert 改为返回错误码；无修复 PR）。

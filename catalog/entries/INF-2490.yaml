original:
  mechanism: 昇腾 910B3、CANN 9.2.0，cann/ops-nn master e91941a02 已复核。缺陷位置 index/gather_v3/op_host/op_api/gather_v3.cpp：host 只校验 dtype/shape。kernel 内 CheckIdxValue 的 assert 实际触发过（plog 记录 gather_v3_base.h:137 Assertion '(0 <= val && val < this->gxSize_)' failed. Index 99 out of range[0 4)!）但生产版本编译掉、执行未被阻止。文档《aclnnGather》参数说明写明 index 取值范围 [-self.shape[dim], self.shape[dim]-1]、不支持越界（预期报 161002）。C++ 两段接口复现：legal [0,2,3]→[100,300,400] 正确；oob=4→[100]；oob=99→[0]；两次调用 ret 均为 0。
  source: https://gitcode.com/cann/ops-nn/issues/8561
  behavior: 上板调 aclnnGather（或经框架走到 gather_v3 内核）时传入越界索引得不到报错：小越界返回错误位置的值（长度 4 的张量 index=4 返回第 0 个元素 100），大越界返回 0.0，GetWorkspaceSize 与执行都返回成功；错误值直接进入下游计算，除非对拍否则发现不了；合法 index 结果正确。
  trigger_surface: aclnnGather + 越界 index（0.35+ 的任意越界值）；CANN 9.2.0 / master 均在。
  discovery: 2026-11-10 每日扫描

title: 自动生成 aclnn 出参 stride 静默半写
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: 自动生成 aclnn 出参回写
  behavior: 无 op_host/op_api 的接口回写时按连续布局写 storage 前 numel 个元素，出参 stride 不参与寻址，GetWorkspaceSize 也不拒绝非连续出参。
effect:
  objects:
  - 数值结果
  detail: 非连续出参两段返回 0/0，写入落在连续前缀：一半位置保留调用方哨兵、按 stride 读回错位；TopKTopPSample 64 个有效值只剩 32 个；资料标 × 的接口也不返回 161002。
  visibility: 静默错误
mitigation:
  detect: 出参构造 stride 带空洞的合法 view（max_offset<storage numel），与连续基线逐元素比对并按 stride 读回；输入非连续与连续基线作对照。
  fix: 逐算子修补中：!14347 拒绝 DynamicBlockQuant 非连续出参、!14290 修正 RmsNorm 文档；系统性 op_api 生成修复未核实。

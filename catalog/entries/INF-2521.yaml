original:
  mechanism: 'CANN ops-nn 中一批算子的 aclnn 接口没有 op_host/op_api 目录、由 op def 自动生成；这些接口回写结果时按连续布局把 numel(view) 个元素写到 storage 起始处，出参 stride 完全不参与寻址，也不在 GetWorkspaceSize 返回 161002 拒绝。issue #8663 在 Atlas A2 910B3 + CANN 9.2.0、A3 + 9.3.0 实测 4 个接口 6 个出参：aclnnRmsNorm rstdOut [4,1]/{4,2}/{4,4} 时 3/4 元素为 0；aclnnGemmaRmsNorm yOut 30/32 超差（worst=3.58）、rstdOut 3/4 为 0；aclnnRmsNormGrad dxOut 16/32 为 0；aclnnAddLayerNormGrad dxOut 16/32、dgammaOut/dbetaOut 4/8 为 0，全部两段返回 0/0。对照：同接口入参非连续（x 切片、gamma 切片）全部 PASS，全连续基线全部 PASS；无 op_host/op_api 的 7 个接口 7/7 失败，有手写实现的 Hardswish 与 ForeachMulList 2/2 正常，说明根因在自动生成接口的出参回写路径而非非连续布局本身。同族细粒度单：aclnnExpandIntoJaggedPermute #8683（6 个位置错 3 个）、aclnnMaskedSoftmaxWithRelPosBias #8684（64 元素中 32 未写）、aclnnTopKTopPSample #8685（有效值 64 个只剩 32 个）、aclnnCrossEntropyLoss #8702（logProbOut 物理前 40 个全对、按 stride{10,2} 读回 20/40 未写、38/40 超差）、aclnnForeachDivScalarList/aclnnForeachMulScalarList #8746（两段 0/0 且一半未写）。#8674 另显示 aclnnAddRmsNormCast 的 4 个出参在 def 中显式调用 .AutoContiguous()，实测仍不生效、y1Out 16/32 未写；#8688 aclnnSituGlu、#8699 aclnnSwiGluQuant 等资料标 × 的接口同样放行而非返回 161002。#8663 更新说明指出 RmsNorm/RmsNormGrad 文档已把出参非连续列从 √ 改为 ×（b4db407），这两者属于该拒未拒；GemmaRmsNorm/AddLayerNormGrad 仍是承诺支持却算错。'
  source: https://gitcode.com/cann/ops-nn/issues/8663 ｜https://gitcode.com/cann/ops-nn/issues/8674 ｜https://gitcode.com/cann/ops-nn/issues/8685 ｜https://gitcode.com/cann/ops-nn/issues/8688 ｜https://gitcode.com/cann/ops-nn/issues/8702 ｜https://gitcode.com/cann/ops-nn/issues/8736 ｜https://gitcode.com/cann/ops-nn/issues/8746
  behavior: 推理服务把输出写进预分配 buffer 的切片或带 stride 的视图时（例如往 paged KV/拼接 logits/loss 缓冲的某一段写结果，或把 TopKTopPSample 的索引写进大 buffer 的一半），接口两段都返回成功，但结果按连续布局落到 buffer 开头：按自己的 stride 读回时一半位置还是旧值、另一半错位；采样算子的有效值可能只剩一半，生成的 token 因此改变。日志没有任何报错，只有把同一调用改成连续出参再逐元素对拍才能发现。
  trigger_surface: CANN ops-nn 无 op_host/op_api 的自动生成接口（RmsNorm、GemmaRmsNorm、RmsNormGrad、AddLayerNormGrad、CrossEntropyLoss、MaskedSoftmaxWithRelPosBias、TopKTopPSample、ExpandIntoJaggedPermute、SwiGlu/SituGlu、Foreach*ScalarList 等）；出参为非连续 view（stride 有空洞但 max_offset < storage numel）；Atlas A2/A3、CANN 9.2.0/9.3.0。
  discovery: 2026-11-13 每日扫描
  notes:
  - '2026-11-13 2026-11-13 回访：同族新增 18 单（ops-nn #8746/#8747/#8748/#8769/#8796/#8800、ops-transformer #7488/#7489/#7490/#7491/#7493/#7494/#7495/#7496/#7522/#7534/#7552、ops-math #4730）。其中 #8800 为 aclnnBatchNorm 资料标 √ 却静默漏写（反向口径），#7496 为版本回归（原拒绝改为静默错值），#4730 aclnnHansEncode 三个出参同族。'

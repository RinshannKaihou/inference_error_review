original:
  mechanism: vllm-ascend main@e617b70（2026-11-06 静态检查）：#20213 修复 P 侧 prompt 截断后的 stale block_hashes 时，只在 kv_p2p/mooncake_connector.py:1925-1931 与 kv_p2p/mooncake/base_scheduler.py:212-218 两处加了 request.block_hashes.clear()+update_block_hashes()；同样的截断（_all_token_ids.pop()/num_prompt_tokens-=1/max_tokens=1/_p_side_truncated=True 四行）存在于 kv_p2p/mooncake_hybrid_connector.py:1425-1449（_truncate_request_for_prefill，need_truncate=use_compress）与 kv_p2p/mooncake_layerwise_connector.py:936-956（_truncate_request_for_hybrid_prefill，need_truncate=attn+Mamba hybrid cache），均无 hash 重建。Request.block_hashes 在构造时按全 prompt 计算，截断后所有基于 hash 的前缀缓存/KV 复用决策仍指向截断前 prompt；hybrid 连接器截断的明确目的（on_new_request 注释：先截断使本地与连接器查找用同一 prompt 长度）因此未达成。layerwise 还在 get_num_new_matched_tokens(:999-1000) 内截断，与另两处在 on_new_request 截断的查找顺序不一致。
  source: https://github.com/vllm-project/vllm-ascend/issues/21166 （原修复：https://github.com/vllm-project/vllm-ascend/issues/20213 ）
  behavior: hybrid 压缩或 attention+Mamba 混合模型走 mooncake PD 传输时：prompt 被 P 侧截断后，本地前缀缓存与 KV 复用决策仍按截断前完整 prompt 的 hash 判定，与连接器侧查找不一致——本应命中的前缀错失（吞吐损失）或按不匹配 hash 复用 KV，均无报错，表现为前缀命中率异常与偶发输出不一致。
  trigger_surface: MooncakeHybridConnector（use_compress）或 MooncakeLayerwiseConnector（attention+Mamba hybrid）+P 侧 prompt 截断；main@e617b70

title: NPU 模板 GEMM 融合 epilogue 缺 fp32 截断 cast
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: 模板 GEMM epilogue codegen
  behavior: codegen_template 漏调 _compute_fusion_metadata，跳过 fp32→fp16/bf16→fp32 截断 cast，epilogue 全程 fp32 计算写回。
effect:
  objects:
  - 数值结果
  detail: max_autotune Triton 模板 GEMM（mm/addmm+relu/sub 等）开 epilogue 融合且输出 fp16/bf16 时，融合与未融合路径数值不一致，无任何报错。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 修复 MR https://gitcode.com/Ascend/pytorch/merge_requests/49099 已提交（render() 前补调 _compute_fusion_metadata，并对齐 prologue 参数、显式拒绝不支持的 prologue 融合），合入状态未核实。

- url: https://gitcode.com/Ascend/pytorch/issues/6080
  kind: gitcode_issue
relations: []
original:
  mechanism: op_plugin/ops/opapi/UniqueConsecutiveKernelNpuOpApi.cpp 在无 dim 时按 self.sizes() 分配 y_inverse，0 维输入即 rank-0，直接交给 aclnnUniqueConsecutive；该算子不写 rank-0 的 inverse 输出，把分配器给的旧内存原样返回。把输入换成 rank-1 视图（x.reshape(1)）后 inverse 稳定为 0，1 维及以上输入本来就正确。报告者在 Ascend 910B4、torch-npu master（3a98c281，op-plugin pin eee88cf4）、torch 2.16.0.dev20261107+cpu、triton-ascend 3.6.0.post2、CANN 9.2.0-beta.2 上复现：六种 dtype 的标量输入在脏分配器下分别吐出 0 或 99344109427201；不弄脏分配器时间歇复现（干净零页看着像对的）。TestInductorOpInfoNPU 有 6 个完整方法首错为此。修复方向为 rank-1 视图下发并把 inverse reshape 回 0 维。
  source: https://gitcode.com/Ascend/pytorch/issues/6080
  behavior: 对 0 维（标量）张量调用 torch.unique_consecutive(x, return_inverse=True) 时，values 与 counts 正常，inverse 却可能是任意旧内存值：同一输入连调三次得到 0/0/73014444033，下游拿这些索引去 gather 时读到错位置或越界，而干净环境下又看起来是对的。
  trigger_surface: 0 维张量、return_inverse=True、无 dim；1 维及以上正确；910B4 + torch_npu master、CANN 9.2.0-beta.2、triton_experimental 后端。
  discovery: 2026-11-13 每日扫描

id: INF-2549
legacy_ids: []
slug: unique_consecutive_0d_uninitialized_inverse
aliases: []
title: unique_consecutive 0 维输入 inverse 未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: UniqueConsecutive 0 维
  behavior: 无 dim 时按 self.sizes() 分配 y_inverse，0 维输入把 rank-0 张量交给 aclnnUniqueConsecutive；该算子不写 rank-0 的 inverse。
effect:
  objects:
  - 数值结果
  detail: 标量输入 return_inverse=True 时 inverse 为分配器旧内存值：脏分配器下六种 dtype 分别吐出 0 或 99344109427201，不弄脏分配器时间歇复现（干净零页看着像对的）；TestInductorOpInfoNPU 6 例首错为此。
  visibility: 静默错误
mitigation:
  detect: 标量输入 + return_inverse=True，先分配并释放填充 0x5A5A5A5A5A5A 的块再调用，断言 inverse==0；同时跑 1 维视图对照。
  fix: 'op-plugin PR #6218（open）0 维输入改走 rank-1 视图、返回前 reshape 回 0 维；报告者实测 6 例转通过，未发布。'
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-13'

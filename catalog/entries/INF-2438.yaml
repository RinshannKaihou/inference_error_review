  behavior: fp8_block.py 以 is_950() 决定 mxfp8_method，非 950 时为 None，process_weights_after_loading 把整块 FP8 权重反量化成模型 dtype 走非量化 GEMM，不报错
effect:
  objects:
  - 性能/资源

  detail: A2/A3 无 FP8 matmul 却静默降级 BF16：权重显存翻倍（fp8 1B→bf16 2B）、加载峰值更高，27B FP8 单卡属性破坏；唯一痕迹一条看似正常的 info 日志；文档 quantization.md:117 写成 intended
  visibility: 性能退化
mitigation:
  detect: 对比加载后权重大小/显存占用；查 fp8_block.py mxfp8_method 是否 None
  fix: 待定（报告者准备 fail-fast PR，未见提交）；规避：A2/A3 使用 BF16 发布版或 ModelSlim/LLM-Compressor 量化 checkpoint

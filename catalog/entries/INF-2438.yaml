original:
  mechanism: vllm-ascend main@ac6405d9e 的 vllm_ascend/quantization/methods/w8a8/fp8_block.py：服务原生 block-wise FP8 checkpoint（quant_method=fp8+weight_block_size）时，:180/:270 以 self.mxfp8_method = AscendW8A8MXFP8DynamicLinearMethod() if is_950() else None 决定路径。mxfp8_method 为 None 时 process_weights_after_loading 用 resolve_block_scales(...) 把整块 FP8 权重反量化进模型 dtype、经非量化 GEMM 服务（:226-228/:247-249）；MoE 方案经 _resolve_experts/bf16_method/quant_type=QuantType.NONE 同样处理。A2/A3（910B/910C）无 FP8 matmul，降级不买吞吐且权重足迹翻倍、加载峰值更高（fp8 权重与 weight_scale_inv 仍存活时物化稠密副本）。A5 attention 后端确需稠密解析（sfa_v1.py:544 断言 kv_b_proj.weight.dtype==act_dtype），错的是硬件条件默认值。该行为当前被文档 quantization.md:117 写成 intended。
  source: https://github.com/vllm-project/vllm-ascend/issues/21157
  behavior: 在 910B/910C 上加载原生 FP8 模型（如 Qwen/Qwen3.8-27B-FP8、GLM-5.3-Flash FP8）：服务正常启动、可对话，但全程 BF16 计算——显存占用翻倍导致「27B FP8 单卡可部署」失效或 OOM，服务数值为 bf16(fp8_weight*scale) 而非 checkpoint 的 FP8 算术；除一条读起来像 FP8 在运行的 info 日志外无任何提示，跨平台对比结果差异无从归因。
  trigger_surface: A2/A3（910B/910C）+原生 block-wise FP8 checkpoint（quant_method=fp8+weight_block_size）；950 正常
  discovery: 2026-11-06 每日扫描

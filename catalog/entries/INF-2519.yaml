original:
  mechanism: flashinfer 0.7.3（commit 775207de）norm.gated_residual_rmsnorm Cake 生成程序 cake_muse_spark_norm_8418dc5f50dc570d66db_kernel.cu：rows≤128 的 PDL 程序在 L156-183 加载 branch、L214 才 griddepcontrol.wait——PDL 语义下生产者在 launch_dependents 后仍可继续写 branch（报告者的独立 producer 内核：触发依赖后自旋再以有限值覆写 NaN 预填的 branch），消费者在 wait 前读到的可能是覆写前数据。B300 SM103 实测 50 试验×rows{1,8,16,17,48,64,65,128,129,256,1024}×mode{0,1}×backend/pdl 组合：rows≤128 且 PDL 开时稳定读到旧值，129+ 行程序（wait 后加载）、backend=cute、enable_pdl=False 均正确。与 INF-2399（trtllm_fp8_block_scale_routed_moe PDL 默认开读到未写完 scratch 返回错行）共享机制：PDL 消费者在依赖就绪前读生产者输出；触发差异：MoE scratch 未写完 vs RMSNorm branch 输入未写完、本条限定 Cake 程序 rows≤128 变体。影响面：vLLM Muse Spark 默认参数即命中（DSpark draft 辅助隐状态、DP+EP TP=1、批 8-48 行、紧跟让其提前启动的生产者）。
  source: 'https://github.com/flashinfer-ai/flashinfer/issues/9343 '
  behavior: 使用 flashinfer gated_residual_rmsnorm（Cake 后端、PDL 默认开）且批行数不超过 128 的服务：紧跟生产者内核执行时该归一化会读到生产者尚未写完的 branch 输入，输出含旧值/NaN 的辅助隐状态；下游 DSpark draft 在 greedy 下所有 draft token 被拒（接受长度掉到 1.0，吞吐塌缩），温度采样下 NaN 概率让所有 draft 被接受、输出彻底变成垃圾（AIME25 从 100% 掉到 0%）。关 PDL 或换 cute 后端即恢复正常接受长度。
  trigger_surface: flashinfer 0.7.3 gated_residual_rmsnorm Cake PDL 程序（rows≤128）+ 生产者允许消费者提前启动的 PDL 流水（vLLM Muse Spark DSpark 辅助隐状态路径，DP+EP、TP=1、decode/verify 批 8-48 行）；B300 SM103 实测。
  discovery: 2026-11-11 每日扫描

id: INF-2519
legacy_ids: []
slug: gated_rmsnorm_pdl_branch_early_read
aliases: []
title: gated RMSNorm PDL 提前读 branch 出 NaN
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: Cake PDL 程序序（rows≤128）
  behavior: Cake PDL 程序（rows≤128）在 griddepcontrol.wait 之前的 prologue 加载 branch（>128 行程序在 wait 后加载）：生产者触发依赖后仍覆写 branch，消费者读到覆写前数据。
effect:
  objects:
  - 隐状态
  - 输出内容
  detail: vLLM Muse Spark 默认参数构建 DSpark draft 辅助隐状态（DP+EP TP=1、批 8-48 行）：draft 收 NaN——greedy 全拒（接受长度 ~1.0）、温度采样全收输出垃圾（AIME25 0% vs 100%）。
  visibility: 静默错误
mitigation:
  detect: 独立复现内核（producer launch_dependents 后自旋再覆写 NaN→有限值，正确的 PDL 消费者输出必须有限）在 50 次试验中稳定区分好坏配置；rows 1-128 全坏、129+/cute/关 PDL 全好。
  fix: 规避：enable_pdl=False 或 backend='cute'（接受长度恢复 ~3.6-4.0、输出正确）。建议修复（issue open，0 评论）：branch 加载移到 griddepcontrol.wait 后并重渲染 cake_muse_spark_norm backend，同时排查其他 Cake PDL 程序同类 prologue 预取生产者输出。

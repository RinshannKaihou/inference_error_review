id: INF-2550
legacy_ids: []
slug: vllm_custom_ops_innermost_stride_unchecked
aliases: []
title: vLLM 自定义算子未校验最内维 stride
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: 自定义算子 stride 校验
  behavior: host 只检查 residual 行 stride 或只下发 token/head stride，kernel 按最内维连续寻址；stride(-1)!=1 时地址算错并写错 residual。
effect:
  objects:
  - 数值结果
  detail: fused_add_rms_norm 转置 input（stride 1,4）4035/4096 超差 max 8.75、residual max 4.89；rotary_embedding 2D 转置 q 512/512 错，3D 仅末维 stride=4 时仍 512/512 错（max≈9）。
  visibility: 静默错误
mitigation:
  detect: 对同一逻辑张量分别用连续与转置/列切 view 调用 fused_add_rms_norm / rotary_embedding，与 native PyTorch 参考逐元素比对；行 padding、head padding 作为对照。
  fix: 未核实修复 PR；规避为调用前 .contiguous()，或在 wrapper 显式拒绝 stride(-1)!=1。
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-13'
remarks: 与 INF-2530 共享“自定义算子只校验部分 stride、kernel 假定连续寻址”，触发差异：INF-2530 是 FlashInfer JIT silu_and_mul 的行 stride，本条是 vLLM 算子的最内维 stride。

pattern: PAT-INF-0205
original:
  mechanism: vLLM 的两个自定义 CUDA 算子都只校验/传递部分 stride：fused_add_rms_norm 的 host 代码有 STD_TORCH_CHECK(residual.stride(-1)==1)，但没有检查 input.stride(-1)，kernel 用 input[blockIdx.x*input_stride+idx] 寻址（input_stride=input.stride(-2)，idx 沿特征维连续），转置或列切片输入的地址即错，且转置时 input_stride==1 使不同 block 的写区间重叠；rotary_embedding 的 wrapper 传 token stride 和（3D 时）head stride，kernel 始终假定最内维连续、2D 展平时 head block 连续。实测：fused_add_rms_norm fp32 转置 input（stride 1,4）input max diff 8.748、4035/4096 超差、residual max diff 4.885；列切片（stride 2048,2）max diff 9.425、4022/4096 超差；bf16 转置同样复现。rotary_embedding 2D 转置 q max diff 9.14（512/512 超 1e-4）、k 8.22（256/256）；3D shape (4,2,64) stride (512,256,4) 仅末维 stride=4 时 q/k 仍 512/512、256/256 全错。对照：2D/3D 连续、行 padding、head padding 均为 0 或 1e-7 量级。
  source: https://github.com/vllm-project/vllm/issues/67411 ｜https://github.com/vllm-project/vllm/issues/67401
  behavior: 把已经转置或列切片的张量（stride(-1)!=1，但逻辑 shape 合法）直接传给 vllm._custom_ops.fused_add_rms_norm 或 rotary_embedding，调用成功、无告警，但归一化后的 input、被更新的 residual、旋转后的 q/k 全部错位：4096 个元素里 4000 多个超差，最大误差 8~9；只有改成 .contiguous() 才对得上。
  trigger_surface: vLLM 自定义算子 fused_add_rms_norm / rotary_embedding，输入最内维 stride != 1（转置、列切片）；行 padding 与 head padding 已支持。
  discovery: 2026-11-13 每日扫描

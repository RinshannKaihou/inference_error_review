original:
  mechanism: NPU Inductor 的 eliminate_modular() 在处理乘法表达式时，用单个轴长的代入结果判断完整表达式的整周期性，可将 (6*i)%3 错误化简为 6*i，产生错误的 load 地址。受影响社区原始用例 test_torchinductor.py::GPUTests::test_buffer_use_after_remove_npu，历史失败记录中 eager 前向结果 24、编译结果 22。正确语义应是：仅在完整表达式是整个周期的整数倍时化简为 0，其他情况结合各符号的轴范围判断，无法证明时保留取模。修复补丁离线符号检查覆盖 560 个表达式、1960 次取值，独立 helper 无不等价结果，并含 17 项符号/多轴检查与 12 组原问题 load 地址检查；NPU 整图回归与主仓 CI 待完成。
  source: https://gitcode.com/Ascend/pytorch/issues/5961
  behavior: 用到取模索引的算子在 torch.compile 编译后，个别 buffer 用例的计算结果与 eager 不一致（记录在案的对照：24 vs 22），无报错；由于是 load 地址算错，受影响的是取模参与地址计算的任意张量读写。
  trigger_surface: torch.compile + 索引表达式中含乘法与取模组合（如 (6*i)%3）的 kernel。
  discovery: 2026-11-09 每日扫描

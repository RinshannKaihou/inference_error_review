title: FlatQuant 裁剪三维输入广播错改序列维
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: FlatQuantOnlineWrapper 裁剪
  behavior: _apply_clip 用展平 [B*S,H] 算出的 h_min/h_max（[B*S,1]）直接 clamp 三维 hidden_states：维度不匹配抛错，[B,S=1,H] 广播成 [B,2,H]，静默改序列维。
effect:
  objects:
  - 数值结果
  detail: CPU 必现（msmodelslim master cb83735f，PyTorch 2.9.0+cpu）：[2,1,4] 输入输出 [2,2,4]，序列维 1→2；[2,3,4] 报错。逐 token 裁剪应保持输入 shape。
  visibility: 静默错误
mitigation:
  detect: 对 FlatQuantOnlineWrapper 分别喂 [2,3,4] 与 [2,1,4] 三维输入，检查输出 shape 是否与输入一致；把同一输入展平成 [-1,H] 执行后恢复形状作对照。
  fix: 修复 PR !1173（open，未发布）：保留 FlatQuant 激活裁剪前后的 shape；!1172 同步保留导出的裁剪比例。

original:
  mechanism: 'Ascend/msmodelslim issue #694（master cb83735f94604d308fa67784b1c7d5b8981addf0，PyTorch 2.9.0+cpu，Ubuntu 22.04/aarch64）：FlatQuantOnlineWrapper 开启裁剪后，_apply_clip 先把输入展平成 [batch*seq, hidden] 计算范围，却把二维范围 [B*S,1] 直接用于原始三维张量 hidden_states 的 clamp。复现：wrapper = FlatQuantOnlineWrapper(torch.nn.Identity()); wrapper._add_clip(torch.tensor([0.5]))；输入 [2,3,4] 时 h_min/h_max 形状 [6,1] 与 [2,3,4] 的维度 3 vs 6 不匹配，抛 RuntimeError: The size of tensor a (3) must match the size of tensor b (6) at non-singleton dimension 1；输入 [2,1,4]（B*S=2）时 [2,1] 被广播成 [1,2,1] 再与 [2,1,4] 计算，输出 shape 变成 [2,2,4]，序列维从 1 静默变成 2。期望逐 token 对最后一维裁剪、输出保持输入 shape；根因与修复方向是把 clamp 施加在展平视图上再恢复 init_shape，或把上下界恢复成可广播形状。修复 PR !1173 标题为 Preserve FlatQuant activation shapes during clipping，!1172 为 Preserve exported FlatQuant activation clipping ratios，均 open。'
  source: https://gitcode.com/Ascend/msmodelslim/issues/694 ｜https://gitcode.com/Ascend/msmodelslim/merge_requests/1173
  behavior: 用 msmodelslim 的 FlatQuant 在线量化 wrapper 处理三维激活（[batch, seq, hidden]）且序列长度为 1 时，裁剪后的输出 shape 会被静默扩成 [batch, 2, hidden]，序列维凭空多一倍；其他序列长度则直接抛 RuntimeError。前者不会报错，后续层按错误 shape 继续算，表现为输出长度/对齐错乱或精度异常。
  trigger_surface: Ascend/msmodelslim FlatQuantOnlineWrapper + _add_clip；三维输入 [B,S,H]；S=1 时静默扩维，S>1 时 RuntimeError；CPU 即可复现，msmodelslim master cb83735f。
  discovery: 2026-11-13 每日扫描

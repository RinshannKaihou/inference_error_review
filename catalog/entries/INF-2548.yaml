original:
  mechanism: '自 #12237 起，NVIDIA tt.fp_to_fp 带 rounding mode 的窄化被降到 llvm.fptrunc.round。f64→bf16 且 round.towardzero 时，NVPTX 只在 sm_90+ 选择 cvt.rz.bf16.f64，sm_90 以下没有该指令，NVPTX 后端报 error: unsupported conversion or rounding mode for llvm.fptrunc.round。Triton 的 translateLLVMIRToASM（python/src/llvm.cc）只运行 codegen pass manager 并返回 PTX，不检查 LLVM 是否报错，于是使用一个转换被丢弃的函数的 PTX：该 PTX 根本不 load 输入（%rs1 从未写），16/16 元素写成 -5.3e36。同一 issue 中 f64→f16、f64→f32 的 RTZ 已正确；3.8.0/3.9.0 对 f64→bf16 RTZ 直接编译期拒绝（#12260）。'
  source: https://github.com/triton-lang/triton/issues/12741
  behavior: 在 sm_80/sm_89 上用 fp_downcast_rounding='rtz' 把 float64 转 bfloat16，kernel 能编译能启动，但写出的是固定垃圾值（实测每个元素 -5.3e36）；编译日志里只有一行 LLVM error，不抛异常，只有和参考实现对拍才发现。
  trigger_surface: Triton main，f64→bf16 + rtz，sm_80/sm_89；f64→f16/f32 已修，3.8.0/3.9.0 会拒绝编译。
  discovery: 2026-11-13 每日扫描

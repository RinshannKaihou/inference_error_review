title: Triton f64→bf16 rtz 编译成功写垃圾
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: PTX 生成忽略 LLVM 错
  behavior: f64→bf16 带 rtz 被降到 llvm.fptrunc.round，sm_90 以下无对应指令；translateLLVMIRToASM 只跑 pass 不检查 LLVM 报错，仍用丢转换的 PTX 启动。
effect:
  objects:
  - 数值结果
  detail: sm_80/sm_89 上 16/16 元素写成 -5.3e36，编译 stderr 有 unsupported conversion 但不抛异常；3.8.0/3.9.0 会编译期拒绝。
  visibility: 静默错误
mitigation:
  detect: sm_80/sm_89 上用 fp_downcast_rounding='rtz' 做 f64→bf16 cast，与 numpy 参考对拍；同时抓取编译 stderr 中的 LLVM error。
  fix: 未核实修复 PR；规避为不用 rtz 转 bf16（默认 rtz 之外的舍入路径正确），或升级到会拒绝该 cast 的版本。

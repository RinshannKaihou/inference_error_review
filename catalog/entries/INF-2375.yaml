    component: BalanceScheduler 输出构造
  behavior: BalanceScheduler.schedule() 构造 SchedulerOutput 时未填 has_sync_kv_loads，默认 False 使 start_load_kv 推迟到 forward 后，层等待时装载未初始化
effect:
  objects:
  - KV状态
  - 输出内容

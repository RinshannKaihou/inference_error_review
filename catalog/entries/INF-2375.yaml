  detect: 插桩记录 bind_connector_metadata/wait_for_layer_load/start_load_kv/clear_connector_metadata 时序；HBM 清空仅外部命中场景对比输出
  fix: 待定（issue 建议恢复上游 has_sync_kv_loads 记账并检查其他复制调度器实现；connector 侧 workaround 已验证有效）

  mechanism: torch_npu/_inductor/triton_experimental/codegen/triton.py 标量累加器（use_scalar_accumulators，online_softmax_nodes∈{1,2}）路径四族独立缺陷（A2/910B4，CANN 9.2.0，torch 2.16.0a0，torch_npu 2.16.0+git111ec0d，triton-ascend 3.6.0）：B1/B2 _apply_linearize 把 r0 循环提升为 real_block 多 tile 后循环携带累加器 init 仍携带第一遍秩，子节点寄存器槽位未计入，tile 步长混入 combine 维（triton 编译期断言 initial type ['1'] vs ['1','4096']）；B3 acc_type 经进程全局 triton_type 映射把 int64 累加器降级 tl.int32 致极值 init 字面量溢出（全部配置编译失败）；哨兵毒——上游把归约默认值折进 masked load（other=-inf，整数 load 同），vendor 编译器整数 load 内 -inf 经 fptoui 转 255，随后被 0-default re-mask 覆盖时哨兵冗余且毒化归约（u8 amax 行全 255）；D2 同内核中 online_softmax_reduce 与窄整型 sum 的标量携带形式触发 vendor 编译器误编译（u8 sum 与 eager 差 183，n=8200 稳定、n=4104 对齐相关翻转，i32/i64 密集形式免疫）。A1/A3 store 秩与 C1/C2 strict 门控与 B 族共享线性化发射链路，随修复顺带治愈。适配套件 75 例 TE 后端 63 过 12 红，其中 8 例同源本单、4 例顺带治愈、1 例 kldiv 独立。

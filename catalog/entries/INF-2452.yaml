id: INF-2452
legacy_ids: []
slug: vllm_ascend_sw_kv_stale_blocks_cross_request_corruption
aliases: []
title: vllm-ascend 滑窗 KV 陈旧块跨请求污染输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: BlockTables 滑窗屏蔽缺失
  behavior: Ascend 重写 initialize_kv_cache 未传 sliding_window_reach，滑窗屏蔽永不激活，窗口下已释放重分配的块 ID 未置空，attention 读到其他请求 KV。
effect:
  objects:
  - 跨请求/跨样本数据
  - 输出内容
  - KV状态
  detail: 并发 decode 换血负载下部分请求输出损坏：GSM8K 探针 4/6 由对转错，尾部乱码；块表 dump 显示重复块 ID 仅限滑窗 draft 层，首个重复恰出现在首请求越过 4096 窗口边界的解码步。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/21252 （open，未合入）：镜像上游推导 sliding_window_reach 并以 kernel block size 计算 null-block 数；修复后重复块 ID 消失、6/6 探针对齐基线、输出与无换血基线逐字节一致。

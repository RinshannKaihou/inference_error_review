title: flashinfer radix top-k 跨行竞态写错索引
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 解码/采样
    stack: flashinfer
    component: topk.cuh 行循环共享内存
  behavior: CTA 组逐行循环里非确定 collect 后无 __syncthreads：快 warp 提前开始下一行 LoadToSharedOrdered 覆写 shared_ordered 而慢 warp 仍在读，写出错误 top-K 索引。
effect:
  objects:
  - 数值结果
  detail: bf16 B=192 V=65536 k=4096 时 300 种子 8 个出现坏行（9/57600 行，各含一个错误的并列元素），racecheck 报 1-2 hazards；无崩溃无报错；deterministic=True 路径（已有 barrier）不受影响。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 一行 __syncthreads() 修复（行循环末尾补 barrier；作者验证修复后 0 hazard、0/300 坏种子、既有 900 测试通过），PR 待维护者意见。

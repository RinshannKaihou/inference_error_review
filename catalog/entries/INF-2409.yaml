title: aclnnMm 把 NZ format 当 ND 静默计算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Mm format 校验
  behavior: aclnnMm 对 FRACTAL_NZ 输入/输出完全不校验也不按 NZ 语义计算，把 NZ 当 ND 静默处理；同源 aclnnMatmul 首段即 161002 拒绝
effect:
  objects:
  - 数值结果
  detail: out=NZ 时输出与 out=ND 完全相同（NZ 被忽略，决定性证据）；fp16 下输入 NZ 组合 0/0 静默算错、fp32 下 561103 内部码，失败码随 dtype 漂移
  visibility: 静默错误
mitigation:
  detect: 调用侧在传入前校验 format==ND；同输入用 aclnnMatmul 探测（返回 161002 即 NZ 混入）

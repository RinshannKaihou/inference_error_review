  mechanism: aclnnForeachRoundOffNumber / V2（Atlas A2 910B2、CANN 9.2.0、ops-nn master 12ad726c）在 roundMode=6（资料定义「最近邻奇数舍入」）时输出为与输入无关的未初始化 UB 缓冲残值：连续三次调用同一二进制同一输入 x={0.5,1.5,2.5} 得到 0.059/0.063/0.067、-0.0998/-0.0959/-0.0919、0.206/0.210/0.214 三组完全不同结果；roundMode=1(RNE) 对照稳定输出 {0,2,2} 正确。补充证据：Python 侧同进程连续 5 次输出各异；输入全 0 输出 [2.87,2.84,2.81] 非 0；输入全 3.0（无小数）输出 [5.32,5.21,5.10] 非 3；同输入换 shape n=3→11.36、n=6→5.68、n=12→3.79（随 UB 缓冲布局变化）；V1/V2 同现象。期望 half-to-odd 对 {0.5,1.5,2.5} 应得 {1,1,3}。两段返回码均 0，属静默脏数据。

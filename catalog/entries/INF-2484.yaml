original:
  mechanism: tt-metal ttnn eltwise（relu、where、scalar multiply）以 output_tensor 接收结果时，按输出 shard 计算 tile 行数（32 行×32 值的 tile）；对 rank-6 张量该计数忽略从后数第六维，最后一个 shard 的最后一个 tile 行从不写入。Blackhole p150、c408df62、默认 fast dispatch：rank-6 [2,1,1,1,32,32]（2048 值、64 行、单核 [64,32] shard 含 2 个 tile 行）输出预填 -99.0 后三算子均 1024/2048 值错（恰一个 tile 行）、末值仍 -99.0，3 次全新运行结果相同；rank-5/rank-4 同元素数同分片对照全部精确，唯一变量是 rank。真实输出残留的是该内存的旧内容；无已知模型路径达到 rank-6 高度分片 eltwise。
  source: https://github.com/tenstorrent/tt-metal/issues/64827
  behavior: 给 eltwise 算子传入 rank-6 高度分片输出张量时，结果里最后一个 tile 行不会被计算写回，保留这块内存里原来的任意旧值（测试里是 -99.0，真实场景是任意残留数据），无报错且逐位稳定复现；同形状降到 rank-5/4 就完全正确。
  trigger_surface: ttnn relu/where/multiply(scalar) + 调用方提供输出张量 + rank-6 高度分片；Blackhole 实测。

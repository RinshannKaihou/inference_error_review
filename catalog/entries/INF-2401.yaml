id: INF-2401
legacy_ids: []
slug: deepseek_v4_beam_search_compression_cache_misreorder
aliases: []
title: DeepSeek-V4 beam search 压缩缓存未随 beam 重排
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: transformers
    component: HCA/CSA reorder_cache 继承
  behavior: HCA/CSA 层在普通滑动窗 KV 外存压缩状态，但继承的 reorder_cache() 只按 beam 父选择重排 keys/values 行，压缩状态留在旧行未随 beam 移动
effect:
  objects:
  - 输出内容
  - KV状态
  detail: num_beams>1+use_cache 时 beam 候选与 use_cache=False 不一致：CSA 改变首序列、HCA 改变候选顺序、混合 HCA/CSA 改变候选集，无报错；补上压缩状态的 batch 选择后与全上下文 forward 及无缓存 beam 生成一致
  visibility: 静默错误
mitigation:
  detect: seeded 小模型上 reorder_cache([2,0,0]) 逐步与全上下文 forward 对比；beam generate 与 use_cache=False 对照
  fix: 待定（issue 2026-11-04 新开，报告者已验证补齐 batch 选择可恢复一致，未见修复 PR）

original:
  mechanism: transformers 5.23.0.dev0（e540ae45，main 同）：DeepseekV4 的 HCA/CSA 层在普通滑动窗 KV cache 之外存储压缩状态（compression state），但继承的 reorder_cache() 只从 keys/values 中按 beam 父选择取行。beam search 选中不同父时普通 KV 跟随父 beam，而压缩状态停留在旧行。CPU FP32 eager 复现（2 层小模型，sliding_window=8、index_topk=2，CSA=4/HCA=128 默认压缩率）：reorder_cache([2,0,0]) 后 5 步单 token forward 与所选历史+续写的完整 forward 不一致；实际 generate(num_beams=3) 对比原实现/诊断补丁/use_cache=False，CSA 改变首序列、HCA 改变候选顺序、混合 HCA/CSA 改变候选集。仅补上压缩状态的 batch 选择即恢复与全上下文 forward 和无缓存 beam 生成一致。普通 generate() 自动创建 dynamic cache 即可触达。
  source: https://github.com/huggingface/transformers/issues/50336
  behavior: DeepSeek-V4（含 HCA/CSA 压缩注意力层）用 beam search + KV cache 生成时，返回的 beam 候选与不用缓存时不一致：首选序列、候选排序或候选集错误，随 beam 父选择漂移；无报错，正常单请求生成不受影响。
  trigger_surface: transformers 5.23.0.dev0/main；DeepseekV4ForCausalLM（HCA/CSA 层）+ generate(num_beams>1) + use_cache；任意硬件（CPU 复现）。
  discovery: 2026-11-04 每日扫描

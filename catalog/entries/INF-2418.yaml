id: INF-2418
legacy_ids: []
slug: npu_dropout_rand_ops_cse_merge
aliases: []
title: npu._npu_dropout 未入 rand_ops 被 CSE 合并
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: fx_graph_cse rand_ops 名单
  behavior: npu._npu_dropout 内部用 RNG 但不在 fx_graph_cse 的 rand_ops 名单（aten.native_dropout 在），fallback_random=True 时相同 dropout 调用被错误合并
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 两次 dropout 共用同一 mask（torch.equal(a,b)==True），随机性丢失、分支强相关、RNG 序列错位；npu-triton/npu-ascendc 后端均复现，纯推理与默认 fallback_random=False 不受影响
  visibility: 静默错误
mitigation:
  detect: 对两个独立 dropout 输出做 torch.equal 断言；关闭 fallback_random
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49092 （把 _npu_dropout、npu_dropout_gen_mask、npu_dropout_do_mask、npu_dropout_with_add_softmax 补进 rand_ops，状态未核实是否合入）

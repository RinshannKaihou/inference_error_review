original:
  mechanism: tt-metal ttnn.transformer.scaled_dot_product_attention_decode（含 paged 版）：文档（sdpa_decode_nanobind.cpp:44）与技术报告（llms.md:543,559）均声明 attn_mask 版式 [1 x b x nh x s]，但 reader 从 dim0 取批数：sdpa_decode_program_factory.cpp:108 Bmask=attn_mask.padded_shape()[0]，reader_decode_all.cpp:300 以 (cur_batch/…)%Bmask 取偏移。[1,b,nh,s] 掩码 Bmask=1，%1 恒 0——每个 user 都读 user 0 的掩码行；校验（sdpa_decode_device_operation.cpp:184-221）只查 dim2/dim3，dim0/dim1 不设防（dim0 非 1 非 b 时掩码回绕错用、dim1>1 的多余数据永不读）。技术报告声称掩码不匹配是硬 assert 崩溃而非静默错误，dim0/1 不成立。影响路径：Llama 3.2 Vision 的 decode 交叉注意力掩码正是该版式（llama_vision_model.py 构造 [1,B,nh,S] → reshape）；仓内 test_llama_cross_attention.py 的 batch_2 用例覆盖此场景但唯一运行它的 CI job 以 -k 过滤掉 batch 用例。
  source: https://github.com/tenstorrent/tt-metal/issues/64811
  behavior: 按官方文档版式给 decode attention 传每用户不同的 [1,b,nh,s] 掩码时，批量里每个用户实际用的都是用户 0 的掩码，交叉注意力因此关注错误 tile（多余 padding 或丢失真实 token），输出静默错误；同批图片相同或 batch=1 时无现象，越难在测试中暴露。
  trigger_surface: ttnn sdpa_decode/paged sdpa_decode + 按 [1,b,nh,s]（或 dim0≠b）版式传 attn_mask + batch≥2 且各 user 掩码不同。
  discovery: 2026-11-09 每日扫描

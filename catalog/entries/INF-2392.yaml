title: V1 runner PP+MTP 三重缺陷静默错 token
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: PP+MTP 草稿与接受计数通路
  behavior: V1 runner + PP>1 + MTP 下 draft token 永不到达调度器、非末级 PP stage 接受计数陈旧、batch queue 让调度器超前消费三重缺陷叠加，需同时修复任一子集仍输出错误
effect:
  objects:
  - 输出内容
  detail: 输出 token 被静默污染；drafts=0 时 PP2 输出与 PP1 完全一致（投机静默失效，看似正确）；async_scheduling 组合仍观察到静默错 token 由启动守卫拒绝
  visibility: 静默错误
mitigation:
  detect: PP2 与 PP1 输出一致性不构成验证（drafts=0 时同样一致）；需断言 drafts>0
  fix: '修复 PR https://github.com/vllm-project/vllm-ascend/pull/20844 （open，未发布，Fixes #14207；同时为未覆盖的 V1+PP>1+spec+async 组合加启动拒绝守卫）'

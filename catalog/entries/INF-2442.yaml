  mechanism: cann/ops-transformer arch38（mc62）FlashAttention useDn（DN）场景两处参数计算问题：1) ProcessVec1DnRegbaseV2 在 s2RealSize>vec1S2CopyLenDn 分支中，第二段 DataCopy 源 gap 使用 vec1S2CopyLenDn，L1 侧 pitch 未按 s2RealSize 64 对齐；2) ComputeSouterParam 中 useDn 且 s1RealSize>16 时 halfS1RealSize 取 s1RealSizeAlign32，与实际 s1RealSize 不一致。触发：S2 尾块 s2RealSize>s2BaseSize/2 且非 64 对齐的用例精度异常。期望 L1 搬移 pitch 按 s2RealSize 64 对齐、halfS1RealSize 取实际值；关联修复 MR !15443，issue 已 closed（合入与发布状态未核实）。本单为提交者源码定位，无独立实测数值。

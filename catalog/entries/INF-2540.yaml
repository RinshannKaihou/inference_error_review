id: INF-2540
legacy_ids: []
slug: is_inf_int32_offset_overflow_writes_input
aliases: []
title: is_inf 超 2^31 元素偏移溢出写坏输入
kind: 故障
status: pending_audit
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: is_inf 偏移计算
  behavior: host 的 totalDataCount、tiling 字段与 kernel 的 CopyOut offset 都用 32 位；元素数超 2^31 后偏移回绕为负，出参尾部不写并越界写进输入。
effect:
  objects:
  - 数值结果
  detail: fp16 n=2^31+8192 时 out 有 7296 个元素未写或错位（首个 2147484544），只读输入 x 被污染 3648 个元素（首个 1073750464）；两段 rc=0，无报错。
  visibility: 静默错误
mitigation:
  detect: 用 >2^31 元素的 fp16 全 +inf 输入跑 aclnnIsInf，out 预置哨兵并校验 x 只读不变，与 n=2^31-8192 对照。
  fix: PR !7391（merged 2026-11-13）把 host 计数、tiling 字段与 kernel 偏移统一为 uint64；910B3/CANN 9.3.0 实测 out bad 7296→0、x bad 3648→0（含 2^32 回绕用例），发布版本未核实。

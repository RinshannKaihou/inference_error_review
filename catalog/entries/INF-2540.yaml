original:
  mechanism: 'cann/ops-math 的 is_inf 在 host 侧用 uint32_t totalDataCount 逐维相乘，perCoreDataCount/tailDataCoreNum/lastCoreDataCount 及对应 tiling 字段也是 32 位；kernel op_kernel/is_inf.h 的 CopyOut offset 形参为 int32_t，blockOffset/actualInOffset/actualOutOffset 为 uint32_t。元素数超过 2^31 后输出偏移变为负值或回绕，out 尾部不写、越界写到 x 区域。修复参考同构的 math/is_finite（计数与偏移均为 64 位），把 host 计数、tiling 字段与 kernel 偏移全部改为 64 位，不改变分核策略。PR !7391 在 Ascend910B3 + CANN 9.3.0、fp16/bf16 全 +inf 下实测：n=2^31-8192 对照 out bad=0、x bad=0；n=2^31+8192 缺陷组 out bad=7296 firstBadIdx=2147484544、x bad=3648 firstBadIdx=1073750464；修复后 fp16/fp32/bf16 与 n=2^32+8192 用例均 out bad=0、x bad=0。关联 issue #4530。'
  source: https://gitcode.com/cann/ops-math/merge_requests/7391 ｜https://gitcode.com/cann/ops-math/issues/4530
  behavior: 对超大张量做 IsInf/有限性检查时（例如量化前或 silent-check 扫整模型激活），调用返回成功，但结果数组尾部一段没有写、按索引读回是调用方预置的旧值；更严重的是本应只读的输入张量被改写，后续算子拿到被污染的激活，数值全错却没有任何日志。
  trigger_surface: 元素数 > 2^31 的 IsInf 调用（fp16 约 4.3GB 以上，如 [2^31+8192]）；910B3/CANN 9.3.0 实测，host/tiling 的 32 位字段在更大规模同样回绕。
  discovery: 2026-11-13 每日扫描
migration:

original:
  mechanism: 环境：CANN 9.2.0 / PyTorch 2.16.0a0 / torch_npu 2.16.0+git111ec0d / triton-ascend 3.6.0+gita176ab28 / 昇腾 910B4。abs/add/pow 在 torch_npu/_inductor/triton_experimental/lowering_override_list.py 的 GENERATE_LIST（abs:88 / add:25 / pow:30），hypot 不在名单但实测仍进编译器；register_pointwise_numeric 生成 triton kernel 后数值通道四机制各异：int64 值通道按 32 位截断（8589934599 低 32 位恰为 7）；bool 结果通道值相关翻转（真测试 seed 25 元素中 9 个 diff=1）；hypot/f32 为 naive sqrt(x²+y²) 无溢出保护（±FLT_MAX 输入注入 inf/NaN）；pow/f64 底数经 f32 计算（36549.93220051291→36549.92578125）。逐样本探针（2026-11-05，OpInfo sample_inputs + eager vs CPU 参考 + torch.compile dynamic=True + disable_cache_limit）证明 eager(aclnn) 与 CPU 四例全部零差异、四例全部在编译腿复现，排除 op-plugin/CANN eager 路径；对应上游测试 test_op_dtype_propagation_{abs_npu_int64,add_npu_bool,hypot_npu_float32,pow_npu_float64}。风险性质与 argmax/argmin 索引损坏（triton-ascend#2981=INF-2413）同类；分层定位（TE codegen vs triton-ascend lowering）待协查。
  source: https://github.com/triton-lang/triton-ascend/issues/3076
  behavior: 开启 TORCHINDUCTOR_NPU_BACKEND=triton_experimental 后用 torch.compile 跑 abs(int64)、add(bool)、hypot(float32)、pow(float64) 的边界/大值输入时得到静默错误数值：|−8589934599| 变成 7、布尔加法 25 个元素里 9 个翻转、±FLT_MAX 的 hypot 变 inf/NaN、f64 pow 底数只剩 f32 精度（36549.93220051291→36549.92578125）；全程无报错无警告，eager 路径同输入完全正确，只能靠逐样本对拍发现。
  trigger_surface: TORCHINDUCTOR_NPU_BACKEND=triton_experimental（torch.compile）+ 对应 dtype 组合（abs→int64、add→bool、hypot→float32、pow→float64）；路由豁免落地前可触发。

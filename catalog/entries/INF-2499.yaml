original:
  mechanism: 'per-commit wheel 对比：Qwen/Qwen3.5-122B-A10B-FP8、TP=1、lm_eval 5-shot GSM8K 前 10%（132 题固定集）、B200，除 vllm 外环境全部固定；0.32.0rc1.dev49+g31e90ac37 三轮 119/132（90.15%），dev50+g0fae39a014 三轮 114/132（86.36%）。唯一差异 commit 0fae39a014 即 PR #61343（2026-10-13 合入）：per_token_group_quant_8bit（smem 与 register 两种调度）及融合 RMSNorm+group-quant kernel（layernorm_utils.cuh）从逐元素除法改为乘预计算倒数，统一 CUDA FP8 组量化数值，声称 accuracy-neutral（GSM8K/GPQA 噪声内），PR 自身精度表对 Qwen3.5-397B-A17B-FP8 也报 GSM8K 方向性下降但归为噪声。GB200 对照：含该 commit 的 wheel 116/132，换回旧 wheel 119/132。报告者未做逐题对比与全 1319 题复测；132 题固定集重复只证明集合内稳定而非独立统计样本。'
  source: https://github.com/vllm-project/vllm/issues/65906
  behavior: 用含 commit 0fae39a014 的 vLLM nightly（0.32.0rc1.dev50+）serving Qwen3.5-122B-A10B-FP8，B200 上 5-shot GSM8K 前 10% 准确率从 90.15%（119/132）掉到 86.36%（114/132），同一固定题集三轮结果一致；退回前一 commit 的 wheel 恢复 119/132；GB200 上同样换回旧 wheel 后 116/132→119/132。输出可读但答案正确率下降，无任何报错。
  trigger_surface: 'vLLM ≥0.32.0rc1.dev50（含 PR #61343）+ FP8 per-token-group 量化模型（Qwen3.5 MoE FP8 实测）+ GSM8K 类准确率评测。'

original:
  mechanism: cann/ops-transformer FusedInferAttentionScore（FIA）Atlas A2 arch22 路径，fused_block_epilogue_rescale_o.hpp 的 SubCoreCompute：LSE_MODE_==OUT_ONLY 且 splitParams.isSplitkv 时，Brcb 将 LSE 展开到 tvUbTensor（PIPE_V），DataCopyPad 把 LSE 写 GM（MTE3），随后原实现直接返回、未等待 MTE3 完成。tvUbTensor 是 BlockEpilogue 复用的 UB 成员（TV_UB_TENSOR_OFFSET），后续 non-split（isSplitkv==false）任务直接对其 Brcb 覆写；原有 SetFlag<MTE3_V>(EVENT_ID4) 仅置位、本文件内无对应 WaitFlag 消费，不能阻断复用。即 MTE3 读与 V 写之间缺同步，LSE 可能在搬运完成前被覆写。定位为当前 master 固有缺陷，不依赖特定版本；修复补一对 MTE3_V(EVENT_ID5) SetFlag/WaitFlag。
  source: https://gitcode.com/cann/ops-transformer/issues/7287 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/15558
  behavior: 在 Atlas A2 上跑 FIA arch22 kernel、启用 split-KV combine 且需要输出 LSE，并且同一个 BlockEpilogue 实例在 split-KV 任务后紧跟 non-split 任务时，combine 阶段的 LSE 输出会异常（被提前覆写），是否出错取决于竞争窗口、非必现；输出值偶发错、无报错。
  trigger_surface: aclnnFusedInferAttentionScore 系列 + arch22 + LSE_MODE=OUT_ONLY + split-KV combine + BlockEpilogue 跨 split/non-split 任务复用。

id: PAT-INF-0003
title: 浮点归约顺序随批次与内核选择漂移
shared_mechanism: 共同根因是浮点加法不满足结合律：归约树随批形状、split-K/stream-K 切分、内核自选配置、TP 拓扑与调度组批而变，末位差异在近并列 argmax 处翻成可见输出差异。差异在改变归约顺序的是哪一层：内核、调度还是编译产物。

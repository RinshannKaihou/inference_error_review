id: PAT-INF-0004
title: 验证门禁与真实语义失配致假通过
shared_mechanism: 共同点是参考实现或门禁与实际被测语义失配：golden 丢参数、判据恒真或恒假、覆盖面缺层、容差不随 dtype 收紧。缺陷因此既不执行也不报警，验证绿灯与正确性之间没有因果链；差异只在失效手法：签名、谓词、范围或阈值。

id: PAT-INF-0002
title: 输出通道解析依赖不完备的终止符假设
shared_mechanism: 共同点是解析器把生成文本切进 content/reasoning/tool 通道时依赖不完备的终止符与状态假设，且增量路径无回退、聚合路径无事务保证。差异在失效位置：流式分帧、非流式聚合、参数提取与异常粒度各自丢内容、泄标记或坏参数。

id: PAT-INF-0005
title: 缓存身份键遗漏隔离维度与粒度一致
shared_mechanism: 共同点是缓存条目的身份键只由部分维度派生（token、uuid、块号），遗漏隔离语义，或让同一尺寸语义存在多个权威源，使不同请求与不同内容映射到同一条目。差异在于丢掉哪一维：租户 salt、适配器、内容判别，还是块/哈希粒度。

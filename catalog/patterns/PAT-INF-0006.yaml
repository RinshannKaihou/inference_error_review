id: PAT-INF-0006
title: 结构化输出约束在部分分支未被施加
shared_mechanism: 共同点是约束施加链在特定分支上断开：parser 未实现强制、后端选择谓词漏项、门控初值恒假、schema 特性检查不递归，请求既不报错也不受约束地自由生成。差异在断点位置（准入、分派、门控、编译），结果同为静默降级为无约束文本。

id: PAT-INF-0007
title: 块与页尺寸常量多源推导不一致致错位
shared_mechanism: 共同点是块、页、宽度等物理尺寸由多个子系统各自推导而不共享同一定义：kpool 页粒度、对齐器块大小、dtype 打包宽度、内核实例化常量互不知情。换算因此按错单位进行，表现为检索错位、自覆写或越界；差异只在错位的是哪根轴。
